<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef1f5;--ink:#1a2230;--ink-2:#3c4859;--muted:#586472;--line:#e3e7ec;--line-2:#ccd3dc;--accent:#2560ad;--accent-2:#1c4a88;--accent-soft:#e9f0fa;--good:#15683e;--good-soft:#eaf4ee;--good-line:#a7cdb7;--warn:#875008;--warn-soft:#fbf0da;--warn-line:#e4bd80;--crit:#9c302b;--crit-soft:#f9ebe9;--crit-line:#e3aca7;--shadow:0 1px 2px rgb(20 30 45/.05),0 2px 8px rgb(20 30 45/.05);--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;--accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--good-line:#2d5a43;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}}
:root[data-theme="light"]{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef1f5;--ink:#1a2230;--ink-2:#3c4859;--muted:#586472;--line:#e3e7ec;--line-2:#ccd3dc;--accent:#2560ad;--accent-2:#1c4a88;--accent-soft:#e9f0fa;--good:#15683e;--good-soft:#eaf4ee;--good-line:#a7cdb7;--warn:#875008;--warn-soft:#fbf0da;--warn-line:#e4bd80;--crit:#9c302b;--crit-soft:#f9ebe9;--crit-line:#e3aca7;}
:root[data-theme="dark"]{--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;--accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--good-line:#2d5a43;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 64px;position:relative;}
.themetoggle{position:absolute;top:26px;right:20px;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);}
.themetoggle:hover{border-color:var(--accent);color:var(--accent);}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
h1{font-size:clamp(22px,3.2vw,28px);margin:8px 0 0;letter-spacing:-.02em;font-weight:700;}
.lede{color:var(--ink-2);font-size:14.5px;max-width:82ch;margin:9px 0 0;}
.panel{margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.lvl{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);}
.lvl:last-child{border-bottom:none;}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.lname{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.lname .side{float:right;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);}
.lname .side a{color:var(--accent);cursor:pointer;text-decoration:none;}
.lname .side a:hover{text-decoration:underline;}
input[type=date],input[type=number],input[type=text],.txt{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
.datehint{margin-top:9px;font-size:12px;color:var(--muted);}
.datehint b{color:var(--ink-2);}
.srcs{display:flex;flex-wrap:wrap;gap:6px;}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line-2);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--surface);color:var(--muted);}
.chk.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600;}
.chk .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.chk.on .dot{background:var(--accent);}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
.seg button{border:none;background:var(--surface);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--line-2);}
.seg button.on{background:var(--accent-soft);color:var(--accent-2);}
.segwrap{display:flex;gap:22px;flex-wrap:wrap;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 6px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);}
.tile .n{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;}
.tile .l{font-size:12px;color:var(--muted);margin-top:6px;}
.tile.hi .n{color:var(--accent-2);}
.tile.unc .n{color:var(--crit);}
.tile.unc{border-color:var(--crit-line);}
.tile.warn .n{color:var(--warn);}
.tile.warn{border-color:var(--warn-line);}
.tile.good .n{color:var(--good);}
.shrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:24px 2px 10px;}
.sh{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;}
.rowfilter{padding:6px 10px;font-size:13px;width:190px;margin-left:auto;}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:13px;background:var(--surface);}
th{text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;}
th:first-child{text-align:left;}
th.grp{color:var(--accent-2);border-left:1px solid var(--line);}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;}
td:first-child{text-align:left;}
tr:last-child td{border-bottom:none;}
td.dim{color:var(--ink);font-weight:600;white-space:nowrap;}
td.tot{font-weight:700;color:var(--ink);border-left:1px solid var(--line);}
td.crit{color:var(--crit);font-weight:600;}
td.warncol{color:var(--warn);font-weight:600;}
tr.totrow td{background:var(--surface-2);font-weight:700;color:var(--ink);border-top:2px solid var(--line-2);}
.cell{display:inline-block;min-width:24px;border-radius:5px;padding:1px 6px;}
.bar{height:8px;border-radius:4px;background:var(--accent);display:inline-block;vertical-align:middle;}
.cov{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px;}
.cov.g{background:var(--good-soft);color:var(--good);}
.cov.a{background:var(--warn-soft);color:var(--warn);}
.cov.r{background:var(--crit-soft);color:var(--crit);}
.trunc{font-size:12px;color:var(--muted);margin:8px 2px 0;}
.xnote{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.6;border-left:3px solid var(--line-2);padding-left:12px;}
.xnote b{color:var(--ink-2);}
footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--good-soft);color:var(--good);border:1px solid var(--good-line);border-radius:20px;padding:2px 9px;margin-top:10px;}
.anchors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.abtn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;transition:border-color .12s,background .12s;}
.abtn:hover{border-color:var(--accent);}
.abtn.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.abtn .t{font-weight:650;font-size:14.5px;color:var(--ink);}
.abtn.on .t{color:var(--accent-2);}
.abtn .d{font-size:12px;color:var(--muted);margin-top:2px;}
.explain{margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.55;}
.explain b{color:var(--ink);}
.explain .q{color:var(--accent-2);font-style:italic;}
.dates{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
.fld .fl{font-size:11px;color:var(--muted);margin-bottom:5px;}
input[type=date],#sla,#ownfilter{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
#sla{width:78px;font-family:var(--mono);}
.clockline{margin:14px 2px 0;font-size:12.5px;color:var(--muted);}
.clockline b{color:var(--accent-2);font-family:var(--mono);}
.tile.sla .n{color:var(--good);}
#ownfilter{padding:6px 10px;font-size:13px;width:180px;margin-left:auto;}
tr.off{opacity:.4;}
td.dim.clk{cursor:pointer;}
td.dim .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none;}
tr.on td.dim .dot{background:var(--accent);}
td.unc{color:var(--crit);font-weight:600;}
input[type=date],#ownfilter{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
td.pend{color:var(--crit);font-weight:600;}
.sortarrow{color:var(--accent);font-weight:700;}
th.sorted{color:var(--accent-2);}
td.owncol{white-space:nowrap;}
.muted-pct{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px;}
/* report-specific: greyed n/a cell + note */
  .na{color:var(--muted);font-style:italic;cursor:help;border-bottom:1px dotted var(--line-2);}
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 18px;}
.fstep{display:grid;grid-template-columns:158px 1fr 268px;gap:14px;align-items:center;padding:8px 0;}
.fstep+.fstep{border-top:1px dashed var(--line);}
.flabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);line-height:1.3;}
.flabel .fdesc{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px;}
.ftrack{background:var(--surface-2);border-radius:5px;overflow:hidden;height:22px;display:flex;align-items:center;}
.fval{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;}
.fval b{color:var(--ink);font-size:16px;}
.fpct{margin:0 6px;}
@media(max-width:640px){.fstep{grid-template-columns:1fr;gap:5px;} .fval{text-align:left;}}
/* --- brand tokens --- */
:root{--brand:#e01820;--brand-2:#c3141b;}
@media(prefers-color-scheme:dark){:root{--brand:#ff5257;--brand-2:#ff7378;}}
:root[data-theme="light"]{--brand:#e01820;--brand-2:#c3141b;}
:root[data-theme="dark"]{--brand:#ff5257;--brand-2:#ff7378;}
/* --- SPA shell --- */
.topnav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 20px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);border-top:3px solid var(--brand);}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;font-family:var(--sans);padding:0;}
.logoplate{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:7px;padding:4px 8px;display:inline-flex;align-items:center;box-shadow:0 1px 2px rgb(20 30 45/.06);}
.logoplate img{height:19px;display:block;}
.logoplate.lg{padding:12px 18px;border-radius:13px;}
.logoplate.lg img{height:clamp(40px,7vw,58px);}
.bname{font-weight:750;font-size:14.5px;color:var(--ink);letter-spacing:-.01em;}
.brand:hover .bname{color:var(--brand);}
.crumb{font-size:13px;color:var(--muted);} .crumb b{color:var(--ink-2);font-weight:600;}
.navspace{margin-left:auto;}
.herologo{margin-bottom:20px;}
.hero-eyebrow{color:var(--brand)!important;}
.nav-refresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:default;}
.nav-refresh .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}
.nav-refresh.late{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft);}
.nav-refresh.late .dot{background:var(--warn);}
.nav-refresh.stale{color:var(--crit);border-color:var(--crit-line);background:var(--crit-soft);}
.nav-refresh.stale .dot{background:var(--crit);}
.statusbar{margin:14px 0 0;padding:10px 13px;border:1px solid var(--line);border-left:3px solid var(--good);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--muted);}
.statusbar.late{border-left-color:var(--warn);}
.statusbar.stale{border-left-color:var(--crit);}
.statusbar b{color:var(--ink-2);}
.nav-pool{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;}
.nav-pool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);}
.nav-pool .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.nav-pool.on .dot{background:var(--accent);}
.poolbar{margin:14px 0 0;padding:9px 13px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--muted);}
.poolbar b{color:var(--ink-2);}
.nav-tt{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;} .nav-tt:hover{border-color:var(--accent);color:var(--accent);}
.homewrap{max-width:1040px;margin:0 auto;padding:34px 20px 64px;}
.hero-eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
.hero-h1{font-size:clamp(26px,4vw,38px);margin:10px 0 0;letter-spacing:-.025em;font-weight:800;text-wrap:balance;}
.hero-sub{color:var(--ink-2);font-size:15.5px;max-width:70ch;margin:12px 0 0;line-height:1.55;}
.modeseg{display:inline-flex;border:1px solid var(--accent);border-radius:9px;overflow:hidden;}
.modeseg button{border:none;background:var(--surface);color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:700;padding:8px 16px;cursor:pointer;}
.modeseg button+button{border-left:1px solid var(--accent);}
.modeseg button.on{background:var(--accent);color:#fff;}
.modehint{margin:9px 2px 0;font-size:12.5px;color:var(--muted);}
.modehint b{color:var(--ink-2);}
.acts{display:grid;gap:8px;}
.actrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 15px;}
.actrow .t{font-size:13.5px;font-weight:650;color:var(--ink);}
.actrow .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.actrow .v{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--accent-2);}
.dwrap{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden;}
.dwrap:focus-within{border-color:var(--accent);}
.dwrap .dtext{border:none;border-radius:0;background:transparent;width:104px;padding:8px 0 8px 11px;font-variant-numeric:tabular-nums;}
.dwrap .dtext:focus{outline:none;}
.dwrap .dtext.bad{color:var(--crit);}
.dcal{position:relative;display:grid;place-items:center;width:32px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line);}
.dcal:hover{color:var(--accent);background:var(--surface-2);}
.dcal svg{width:15px;height:15px;pointer-events:none;}
.dcal input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;pointer-events:none;}
.kpinote{margin:10px 2px 0;font-size:12.5px;color:var(--muted);}
.kpinote b{color:var(--ink-2);}
.mdbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px;margin:22px 0 4px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
.mdbar .fld{display:flex;flex-direction:column;gap:5px;}
.mdctl{flex:1 1 420px;display:flex;flex-direction:column;gap:12px;}
.mdrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.ordiv{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;font-weight:700;
letter-spacing:.14em;color:var(--muted);}
.ordiv::before,.ordiv::after{content:"";height:1px;background:var(--line);flex:1;}
.mdbar .fl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.mdwin{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;}
.mdwin b{color:var(--ink-2);}
.mature{margin:10px 0 0;padding:9px 13px;border:1px solid var(--warn-line);border-left:3px solid var(--warn);border-radius:8px;background:var(--warn-soft);font-size:12.5px;color:var(--ink-2);}
.mdsect{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:30px 2px 10px;}
.mdsect .note{font-size:11.5px;color:var(--muted);}
.hcrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);}
.hc .n{font-size:19px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;}
.hc .l{font-size:11.5px;color:var(--muted);margin-top:6px;}
.hc.bad .n{color:var(--crit);} .hc.bad{border-color:var(--crit-line);}
.hc.warn .n{color:var(--warn);} .hc.warn{border-color:var(--warn-line);}
.mdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;align-items:start;}
  .kpistrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:26px 0 6px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);}
.kpi .n{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent-2);}
.kpi .l{font-size:12px;color:var(--muted);margin-top:7px;}
.sectlabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:34px 2px 14px;}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px;margin:20px 0 4px;}
.ncard{display:flex;align-items:center;gap:9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;font-family:var(--sans);transition:border-color .14s,transform .14s;}
.ncard:hover{border-color:var(--accent);transform:translateY(-1px);}
.ncard .ic{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:15px;}
.ncard .t{font-size:13px;font-weight:650;color:var(--ink);line-height:1.25;letter-spacing:-.01em;}
.rcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;font-family:var(--sans);display:flex;flex-direction:column;gap:9px;}
.rcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgb(20 30 45/.10);}
.rcard .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;}
.rcard .t{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.rcard .d{font-size:13px;color:var(--muted);line-height:1.5;}
.rcard .go{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:2px;}
.homefoot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;}
#view>.wrap{padding-top:22px;}
</style>

// These accounts hold real leads but never work them (≈0 attempts, ≈0 contact).
// Leaving them in rate denominators understates counsellor performance, so every
// report excludes them by default. One switch, applied identically everywhere.
window.__EXPOOL = true;
function poolSkip(L){ return window.__EXPOOL && L[11]===1; }

// human reads. All day indices are already IST calendar days (pull.py shifts +5:30).
// The daily pull runs mid-morning IST, so the newest day present is always partial
// (day 73 held 12 leads vs ~900/day). A day is complete only if the snapshot was
// taken after that IST day ended — otherwise "latest day" reads as a collapse.
function lastFullDay(maxDay){
  const D=window.__DATA, DAY=86400000;
  if(!D || !D.generated_at) return maxDay;
  const base=new Date(D.base+"T00:00:00Z");
  const g=new Date(D.generated_at); if(isNaN(g)) return maxDay;
  const ist=new Date(g.getTime()+330*60000);                     // IST wall clock
  const genIdx=Math.round((Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate())-base.getTime())/DAY);
  return Math.max(0, Math.min(maxDay, genIdx-1));
}

function init_ageing(){

const DATA = window.__DATA;
// leads: [src, created, firstcall, assign, owner, lastactivity, followup] — minutes since base (IST); null=missing
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;

  const asOf=dateToIdx(document.getElementById("asof").value);
  const c0=Math.max(0,dateToIdx(document.getElementById("a-c0").value));
  const c1=Math.min(asOf,dateToIdx(document.getElementById("a-c1").value));
  const rows={};
  let excl=0, cohort=0;
  for(const L of DATA.leads){
    if(poolSkip(L)) continue;

function init_owner(){

const DATA = window.__DATA;
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
// ---- shared helpers (keep) ----
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }

function p90(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length*.9)]; }
function heat(v,max){ if(!v||!max) return ""; const pct=Math.min(52,Math.round(52*v/max)); return `background:color-mix(in srgb, var(--accent) ${pct}%, transparent)`; }
const maxDay=(()=>{ let m=0; for(const L of DATA.leads){ const d=dayIdx(L[1]); if(d!=null&&d>m)m=d; } return m; })();
// ---- REPORT-SPECIFIC CODE: implement compute()/render(), wire controls, call render() ----

// as-of day for "overdue follow-up" = latest created day in the dataset (proxy for "today" in IST)
const ASOF = maxDay;

// stage indices whose label contains "enrol" (case-insensitive) => Enrolled
const ENROLLED_IDX = new Set((DATA.stages||[]).map((s,i)=>[s,i]).filter(([s])=>String(s).toLowerCase().includes("enrol")).map(([,i])=>i));
const ENROLLED_LABELS = (DATA.stages||[]).filter(s=>String(s).toLowerCase().includes("enrol"));

const srcOrder=(()=>{
  const cnt=new Array((DATA.sources||[]).length).fill(0);
  for(const L of DATA.leads){ if(dayIdx(L[1])>=0) cnt[L[0]]++; }
  return (DATA.sources||[]).map((_,i)=>i).sort((a,b)=>cnt[b]-cnt[a]);
})();

// ---- control state ----
const srcOn = new Set(srcOrder);            // included source indices

let sortDir = -1;                           // desc

const COLS = [
  {k:"owner",   label:"Owner",        grp:false},
  {k:"leads",   label:"Leads",        grp:false},
  {k:"contacted",label:"Contacted",   grp:false},
  {k:"uncalled",label:"Uncalled",     grp:false},
  {k:"cov",     label:"Coverage %",   grp:true},
  {k:"avgatt",  label:"Avg attempts", grp:false},
  {k:"medspeed",label:"Median speed (from assignment)", grp:false},
  {k:"sla",     label:"SLA % (all)",  grp:false},
  {k:"overdue", label:"Overdue FU",   grp:true},
  {k:"enrolled",label:"Enrolled",     grp:false},
];

// ---- DOM refs ----
const dStart=document.getElementById("dStart"), dEnd=document.getElementById("dEnd");
const slaMinEl=document.getElementById("slaMin"), minVolEl=document.getElementById("minVol");

dStart.value=DATA.base; dStart.min=DATA.base; dStart.max=idxToStr(maxDay);

// ---- compute per-owner rows for the current window/sources ----
function compute(){
  const sIdx=Math.max(0,dateToIdx(dStart.value));
  const eIdx=dateToIdx(dEnd.value);
  const sla=Math.max(1,+slaMinEl.value||120);
  const inWin=d=>d!=null&&d>=0&&d>=sIdx&&d<=eIdx;

  // accumulator per owner
  const M=new Map();
  function row(o){ let r=M.get(o); if(!r){ r={owner:o,leads:0,contacted:0,uncalled:0,attSum:0,speeds:[],slaHit:0,overdue:0,enrolled:0,unmeasurable:0}; M.set(o,r);} return r; }

  for(const L of DATA.leads){
    if(poolSkip(L)) continue;
    const d=dayIdx(L[1]);
    if(!inWin(d)) continue;
    if(!srcOn.has(L[0])) continue;
    const r=row(L[4]);
    r.leads++;
    r.attSum+=(L[7]||0);
    if(L[2]!=null){
      r.contacted++;
      // Clock from ASSIGNMENT, not creation: this owner is only answerable for the
      // time after the lead landed on their desk. Reassignment is ~fully automated,
      // so creation-clocked speed mostly measures how old an inherited lead was.
      const st=L[3];
      const sp = st==null ? null : L[2]-st;
      if(sp!=null && sp>=0){ r.speeds.push(sp); if(sp<=sla) r.slaHit++; }

    }

       && stageCls(L[9])==="open") r.overdue++;   // open leads only — a closed lead owes no callback

  const rows=[];
  for(const r of M.values()){
    r.name=DATA.owners[r.owner];
    r.cov = r.leads? r.contacted/r.leads*100 : 0;
    r.avgatt = r.leads? r.attSum/r.leads : 0;
    r.medspeed = r.speeds.length? med(r.speeds) : null;
    r.slaBase = r.leads - r.unmeasurable;
    r.sla = r.slaBase? r.slaHit/r.slaBase*100 : 0;        // uncalled = miss; unmeasurable = excluded
    r.slaOfContacted = r.speeds.length? r.slaHit/r.speeds.length*100 : 0;
    r.uncalledPct = r.leads? r.uncalled/r.leads*100 : 0;
    rows.push(r);
  }
  return {rows, sla, sIdx, eIdx};
}

// ---- totals across ALL owners in scope (min-volume/name filters don't affect totals) ----
function totals(rows){
  const t={leads:0,contacted:0,uncalled:0,attSum:0,speeds:[],slaHit:0,overdue:0,enrolled:0,unmeasurable:0};
  for(const r of rows){
    t.leads+=r.leads; t.contacted+=r.contacted; t.uncalled+=r.uncalled;
    t.attSum+=r.attSum; t.slaHit+=r.slaHit; t.overdue+=r.overdue; t.enrolled+=r.enrolled;
    t.unmeasurable+=r.unmeasurable;
    t.speeds.push(...r.speeds);
  }
  t.cov = t.leads? t.contacted/t.leads*100 : 0;
  t.avgatt = t.leads? t.attSum/t.leads : 0;
  t.medspeed = t.speeds.length? med(t.speeds) : null;
  t.slaBase = t.leads - t.unmeasurable;
  t.sla = t.slaBase? t.slaHit/t.slaBase*100 : 0;
  t.slaOfContacted = t.speeds.length? t.slaHit/t.speeds.length*100 : 0;
  t.uncalledPct = t.leads? t.uncalled/t.leads*100 : 0;
  return t;
}

function sortVal(r,k){
  switch(k){
    case "owner": return r.name.toLowerCase();
    case "cov": return r.cov;
    case "avgatt": return r.avgatt;
    case "medspeed": return r.medspeed==null?(sortDir<0?-Infinity:Infinity):r.medspeed;
    case "sla": return r.sla;
    default: return r[k];
  }
}

  // ---- footer ----
  const enrolTxt = ENROLLED_LABELS.length? `matched stage label(s): ${ENROLLED_LABELS.join(", ")}` : `no stage label containing "enrol" found in this dataset`;

function init_source(){

const DATA = window.__DATA;
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
// ---- shared helpers (keep) ----
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }
function dmy(i){ return isoToDMY(idxToStr(i)); }   // display only; inputs stay ISO
function fm(m){ if(m==null)return "—"; if(m>=1440)return (m/1440).toFixed(1)+"d"; if(m>=60)return (m/60).toFixed(1)+"h"; return Math.round(m)+"m"; }
function cc(c){return c>=50?"g":(c>=25?"a":"r");}
function med(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function p90(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length*.9)]; }
function heat(v,max){ if(!v||!max) return ""; const pct=Math.min(52,Math.round(52*v/max)); return `background:color-mix(in srgb, var(--accent) ${pct}%, transparent)`; }
const maxDay=(()=>{ let m=0; for(const L of DATA.leads){ const d=dayIdx(L[1]); if(d!=null&&d>m)m=d; } return m; })();
// ---- REPORT-SPECIFIC CODE: implement compute()/render(), wire controls, call render() ----

const SRC=DATA.sources||[];
// Internshala-style source rows (partner-link sources) to hide under the "exclude" preset
const isInternshala = (name)=> /internshala/i.test(name||"");

// ---- money (INR) ----

// control state
let startIdx=0, endIdx=maxDay;
let sortKey="created", sortDir=-1;               // default: Lead Created desc
const shown=new Set(SRC.map((_,i)=>i));          // source indices whose rows render
let rowQuery="";

function slaThresh(){ const v=+document.getElementById("sla").value; return isFinite(v)&&v>0?v:120; }

// ---- compute one row per source over the created window ----
function compute(){
  const sla=slaThresh();
  const rows=SRC.map((name,i)=>({idx:i,name,created:0,attempted:0,connected:0,attSum:0,speeds:[],slaHit:0,rev:0,paid:0,pooled:0}));
  for(const L of DATA.leads){
    // Count pooled leads per source BEFORE skipping them. A source can look strong
    // purely because most of it is parked and only the worked sliver reaches the table.
    if(L[11]===1){ const d0=dayIdx(L[1]);
      if(d0!=null && d0>=startIdx && d0<=endIdx && rows[L[0]]) rows[L[0]].pooled++;
      continue; }
    if(poolSkip(L)) continue;
    const d=dayIdx(L[1]);
    if(d==null||d<startIdx||d>endIdx) continue;   // created-window filter (also enforces dayIdx>=0 via startIdx>=0)
    const r=rows[L[0]]; if(!r) continue;
    r.created++;
    const att=L[7]|0;
    if(att>0) r.attempted++;
    if((L[8]|0)>0) r.connected++;
    r.attSum+=att;
    const rv=+L[17]||0;                           // mx_Total_Amount_Paid, rupees collected to date
    if(rv>0){ r.rev+=rv; r.paid++; }              // attributed to the lead's CREATED date, not the payment date
    if(L[2]!=null && L[1]!=null){                 // contacted → has a first-call time
      const spd=L[2]-L[1];                        // source quality = end-to-end wait, so clock from creation
      if(spd>=0){ r.speeds.push(spd); if(spd<=sla) r.slaHit++; }
    }
  }
  for(const r of rows){
    r.poolpct = (r.pooled+r.created) ? r.pooled/(r.pooled+r.created)*100 : 0;
    r.connpct = r.attempted ? r.connected/r.attempted*100 : null;
    r.avgatt  = r.created ? r.attSum/r.created : 0;
    r.speed   = med(r.speeds);
    r.sla     = r.created ? r.slaHit/r.created*100 : null;   // of all created, not just contacted
    r.paidpct = r.created ? r.paid/r.created*100 : null;     // how thin the revenue base is for this source
  }
  return rows;
}

function totals(rows){
  const t={created:0,attempted:0,connected:0,attSum:0,speeds:[],slaHit:0,contacted:0,paid:0,pooled:0};
  for(const r of rows){ t.created+=r.created; t.attempted+=r.attempted; t.connected+=r.connected; t.attSum+=r.attSum; t.speeds=t.speeds.concat(r.speeds); t.slaHit+=r.slaHit; t.contacted+=r.speeds.length; t.paid+=r.paid; t.pooled+=r.pooled; }
  t.connpct=t.attempted?t.connected/t.attempted*100:null;
  t.avgatt=t.created?t.attSum/t.created:0;
  t.speed=med(t.speeds);
  t.sla=t.created?t.slaHit/t.created*100:null;
  t.paidpct=t.created?t.paid/t.created*100:null;
  t.poolpct=(t.pooled+t.created)?t.pooled/(t.pooled+t.created)*100:0;
  return t;
}

function render(){
  const all=compute();
  const t=totals(all);                             // totals across ALL sources in window (not filtered by shown/query)

  // tiles
  const connPct = t.connpct==null?"—":t.connpct.toFixed(1)+"%";
  const paidPct = t.paidpct==null?"—":t.paidpct.toFixed(1)+"%";
  document.getElementById("tiles").innerHTML=`
    <div class="tile hi"><div class="n">${t.created.toLocaleString("en-IN")}</div><div class="l">Total leads created</div></div>
    <div class="tile good"><div class="n">${t.paid.toLocaleString("en-IN")}</div>
      <div class="l">Paying leads (${paidPct} of created)</div></div>    <div class="tile"><div class="n">${t.attempted.toLocaleString("en-IN")}</div><div class="l">Attempted (attempts &gt; 0)</div></div>
    <div class="tile ${t.connpct!=null&&t.connpct<25?'warn':''}"><div class="n">${connPct}</div><div class="l">Connect % (proxy, of attempted)</div></div>
    <div class="tile"><div class="n">${fm(t.speed)}</div><div class="l">Median speed to lead</div></div>`;

  // rows: filter to shown sources, non-empty, and text query; then sort
  let rows=all.filter(r=>shown.has(r.idx) && r.created>0);
  const q=rowQuery.trim().toLowerCase();
  if(q) rows=rows.filter(r=>r.name.toLowerCase().includes(q));
  rows.sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==="name"){ return sortDir*String(av).localeCompare(String(bv)); }
    av=(av==null?-1:av); bv=(bv==null?-1:bv);
    return sortDir*(av-bv);
  });

  document.getElementById("tbody").innerHTML=rows.map(r=>{
    const cls=r.connpct==null?"a":cc(r.connpct);
    const connpct=r.connpct==null?'<span class="cov a">—</span>':`<span class="cov ${cls}">${r.connpct.toFixed(1)}%</span>`;
    const slaCell=r.sla==null?'<span class="cov a">—</span>':`<span class="cov ${cc(r.sla)}">${r.sla.toFixed(0)}%</span>`;
    const paidCell=r.paid
      ? `${r.paid.toLocaleString("en-IN")}<span class="muted-pct">(${r.paidpct.toFixed(1)}%)</span>`
      : `<span style="color:var(--muted);">0</span>`;
    const poolCell=x=> x.poolpct>0.05
      ? `<span class="cov ${x.poolpct>=50?"r":x.poolpct>=20?"a":"g"}" title="${x.pooled.toLocaleString("en-IN")} leads from this source sit in the unworked pool and are not in Lead Created — the rates to the right describe only the worked remainder">${x.poolpct.toFixed(0)}%</span>`
      : '<span style="color:var(--muted)">\u2014</span>';
    return `<tr>
      <td class="dim">${r.name}</td>
      <td>${r.created.toLocaleString("en-IN")}</td>
      <td>${poolCell(r)}</td>
      <td>${r.attempted.toLocaleString("en-IN")}</td>
      <td>${r.connected.toLocaleString("en-IN")}</td>
      <td>${connpct}</td>
      <td>${r.avgatt.toFixed(2)}</td>
      <td>${fm(r.speed)}</td>
      <td>${slaCell}</td>
      <td>${paidCell}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:18px;">No sources match the current filters.</td></tr>`;

  // total row reflects the CURRENTLY SHOWN rows
  const st=totals(rows);
  document.getElementById("tfoot").innerHTML=`<tr class="totrow">
    <td>Total (${rows.length} source${rows.length===1?"":"s"})</td>
    <td>${st.created.toLocaleString("en-IN")}</td>
    <td>${st.poolpct>0.05?`<span class="cov ${st.poolpct>=50?"r":st.poolpct>=20?"a":"g"}">${st.poolpct.toFixed(0)}%</span>`:'<span style="color:var(--muted)">\u2014</span>'}</td>
    <td>${st.attempted.toLocaleString("en-IN")}</td>
    <td>${st.connected.toLocaleString("en-IN")}</td>
    <td>${st.connpct==null?"—":st.connpct.toFixed(1)+"%"}</td>
    <td>${st.avgatt.toFixed(2)}</td>
    <td>${fm(st.speed)}</td>
    <td>${st.sla==null?"—":st.sla.toFixed(0)+"%"}</td>
    <td>${st.paid.toLocaleString("en-IN")}${st.paidpct==null?"":`<span class="muted-pct">(${st.paidpct.toFixed(1)}%)</span>`}</td>
  </tr>`;

  document.getElementById("trunc").innerHTML=
    `Window <b>${dmy(startIdx)}</b> → <b>${dmy(endIdx)}</b> · showing ${rows.length} of ${SRC.length} sources · `+
    `Connected* = mx_Interacted_Count &gt; 0 (proxy) · `+
    `<b>${t.paid.toLocaleString("en-IN")}</b> of the ${t.created.toLocaleString("en-IN")} created leads have made a payment.`;
}

function init_attempts(){

const DATA = window.__DATA;
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
// ---- shared helpers (keep) ----
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }
function dmy(i){ return isoToDMY(idxToStr(i)); }   // display only; inputs stay ISO
function fm(m){ if(m==null)return "—"; if(m>=1440)return (m/1440).toFixed(1)+"d"; if(m>=60)return (m/60).toFixed(1)+"h"; return Math.round(m)+"m"; }
function cc(c){return c>=50?"g":(c>=25?"a":"r");}
function med(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function p90(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length*.9)]; }
function heat(v,max){ if(!v||!max) return ""; const pct=Math.min(52,Math.round(52*v/max)); return `background:color-mix(in srgb, var(--accent) ${pct}%, transparent)`; }
const maxDay=(()=>{ let m=0; for(const L of DATA.leads){ const d=dayIdx(L[1]); if(d!=null&&d>m)m=d; } return m; })();
// ---- REPORT-SPECIFIC CODE: implement compute()/render(), wire controls, call render() ----

// ---- breakdown dimensions ----
// one place that defines every per-dimension difference, so ST.by never needs an if-chain
const BY={
  src:   { col:0,  labels:()=>DATA.sources||[], noun:"source",   head:"By source",                  lsq:"Source",     filter:false },
  owner: { col:4,  labels:()=>DATA.owners||[],  noun:"owner",    head:"By lead owner",              lsq:"Lead Owner", filter:true, ph:"Filter owner name…" },
  city:  { col:13, labels:()=>DATA.cities||[],  noun:"location", head:"By location (lead city)",    lsq:"City",       filter:true, ph:"Filter location…" }
};
function dim(){ return BY[ST.by] || BY.src; }

// "Rest Of India" is a catch-all bucket in the city field, not a real location — flag it rather than let it read as one
const CATCH_RE=/^rest\s*of\s*india$/i;
const CATCH_IDX=(DATA.cities||[]).findIndex(c=>CATCH_RE.test(String(c||"")));

// ---- state ----
const ST={ d0:0, d1:maxDay, srcs:new Set((DATA.sources||[]).map((_,i)=>i)), by:"src", minVol:5, rowFilter:"", sortKey:"leads", sortDir:-1 };

// bucket a lead's attempt count into 0 / 1-2 / 3-5 / 6+
function bucket(a){ return a<=0?0 : a<=2?1 : a<=5?2 : 3; }
const BUCKET_LABELS=["0","1–2","3–5","6+"];

function fmtInt(n){ return n==null?"—":Math.round(n).toLocaleString("en-IN"); }
function fmtAvg(n){ return n==null?"—":n.toFixed(2); }
function fmtPct(n){ return n==null?"—":n.toFixed(0)+"%"; }

// columns: key, label, group?(distribution), numeric getter for sort, cell renderer
const COLS=[
  {key:"name",    label:"", grp:false},
  {key:"leads",   label:"Leads", grp:false},
  {key:"total",   label:"Total attempts", grp:false},
  {key:"avg",     label:"Avg / lead", grp:false},
  {key:"conn",    label:"Connected leads", grp:false},
  {key:"avgConn", label:"Avg on connected", grp:false},
  {key:"b0",      label:"0 att", grp:true},
  {key:"b1",      label:"1–2", grp:true},
  {key:"b2",      label:"3–5", grp:true},
  {key:"b3",      label:"6+", grp:true},
];

function compute(){
  const D=dim(), labels=D.labels(), col=D.col;
  const map=new Map(); // key idx -> agg
  function agg(k){ let a=map.get(k); if(!a){ a={idx:k, name:labels[k]||"—", leads:0, total:0, conn:0, connAtt:0, b:[0,0,0,0]}; map.set(k,a); } return a; }
  let matched=0;
  for(const L of DATA.leads){
    if(poolSkip(L)) continue;
    const d=dayIdx(L[1]);
    if(d==null||d<0) continue;                 // created cohort only
    if(d<ST.d0||d>ST.d1) continue;             // date-range window
    if(!ST.srcs.has(L[0])) continue;           // source filter
    matched++;
    const key = L[col];
    const a=agg(key);
    const att=L[7]||0, inter=L[8]||0;
    a.leads++; a.total+=att; a.b[bucket(att)]++;
    if(inter>0){ a.conn++; a.connAtt+=att; }
  }
  let rows=[...map.values()].map(a=>({
    idx:a.idx, name:a.name, leads:a.leads, total:a.total,
    avg: a.leads? a.total/a.leads : null,
    conn:a.conn, avgConn: a.conn? a.connAtt/a.conn : null,
    b0:a.b[0], b1:a.b[1], b2:a.b[2], b3:a.b[3],
    isCatch: ST.by==="city" && CATCH_IDX>=0 && a.idx===CATCH_IDX
  }));
  // totals across ALL matched rows (before min-vol / name filter), so the Total row is a true grand total
  const tot={ leads:0, total:0, conn:0, connAtt:0, b0:0,b1:0,b2:0,b3:0 };
  let catchLeads=0;
  for(const r of rows){ tot.leads+=r.leads; tot.total+=r.total; tot.conn+=r.conn; tot.connAtt+=(r.avgConn!=null?r.avgConn*r.conn:0); tot.b0+=r.b0; tot.b1+=r.b1; tot.b2+=r.b2; tot.b3+=r.b3; if(r.isCatch) catchLeads+=r.leads; }
  tot.avg = tot.leads? tot.total/tot.leads : null;
  tot.avgConn = tot.conn? tot.connAtt/tot.conn : null;
  const catchPct = tot.leads? catchLeads/tot.leads*100 : null;
  // filters that only affect the displayed rows
  let hiddenN=0, hiddenRows=0;
  rows=rows.filter(r=>{
    if(r.leads<ST.minVol){ hiddenN+=r.leads; hiddenRows++; return false; }
    if(D.filter && ST.rowFilter && !String(r.name).toLowerCase().includes(ST.rowFilter.toLowerCase())) return false;
    return true;
  });
  // sort
  const k=ST.sortKey, dir=ST.sortDir;
  rows.sort((x,y)=>{
    if(k==="name") return dir*String(x.name).localeCompare(String(y.name));
    const xv=x[k]==null?-Infinity:x[k], yv=y[k]==null?-Infinity:y[k];
    return dir*(xv-yv);
  });
  return {rows, tot, matched, hiddenN, hiddenRows, catchLeads, catchPct};
}

function tile(n,l,cls){ return `<div class="tile ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

function render(){
  const D=dim();
  const {rows, tot, matched, hiddenN, hiddenRows, catchLeads, catchPct}=compute();
  // tiles
  document.getElementById("tiles").innerHTML =
    tile(fmtInt(tot.total), "Total attempts (logged)", "hi") +
    tile(fmtAvg(tot.avg), "Avg attempts / lead") +
    tile(fmtInt(tot.conn), "Connected leads (proxy)", "good") +
    tile(fmtAvg(tot.avgConn), "Avg attempts on connected");

  // head
  const th=COLS.map(c=>{
    const active = c.key===ST.sortKey;
    const arrow = active ? (ST.sortDir<0?" ▼":" ▲") : "";
    const cls = c.grp ? ' class="grp"' : (c.key==="name"?'':'');
    return `<th data-k="${c.key}"${cls}>${c.label}${arrow}</th>`;
  }).join("");
  document.getElementById("thead").innerHTML = `<tr>${th}</tr>`;

  const totRow = `<tr class="totrow">
    <td>Total</td>
    <td>${fmtInt(tot.leads)}</td>
    <td>${fmtInt(tot.total)}</td>
    <td>${fmtAvg(tot.avg)}</td>

    <td>${fmtAvg(tot.avgConn)}</td>

  let t=`Showing ${rows.length} ${D.noun} row${rows.length===1?"":"s"} over ${fmtInt(matched)} leads created ${dmy(ST.d0)} → ${dmy(ST.d1)}.`;
  if(hiddenRows) t+=` ${hiddenRows} row${hiddenRows===1?"":"s"} hidden (below min volume of ${floor} leads, ${fmtInt(hiddenN)} leads); Total row still counts them.`;
  if(ST.by==="city" && catchPct!=null && catchLeads>0){

  }

  // footer
  document.getElementById("footer").innerHTML =
    `All dates &amp; times in <b>IST</b>. Cohort complete — rows count only leads created ≥ ${isoToDMY(DATA.base)} (dayIdx ≥ 0). ` +
    `Attempts field = <b>mx_Reached_Out_Attempts</b> (logged, under-logged floor). "Connected" = mx_Interacted_Count &gt; 0 (proxy). ` +
    `<b>Location</b> = the lead's <b>city</b> field (100% populated, but heavily bucketed into "Rest Of India"); the true <b>centre</b> field is the finer cut and is only ~22% populated, so it is not offered as a breakdown here. ` +

// ---- REPORT-SPECIFIC CODE: implement compute()/render(), wire controls, call render() ----

function compute(){
  const labels = S.by==="src" ? DATA.sources : DATA.owners;

function init_funnel(){

const DATA = window.__DATA;
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
// ---- shared helpers (keep) ----
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }
function dmy(i){ return isoToDMY(idxToStr(i)); }   // display only; inputs stay ISO
function fm(m){ if(m==null)return "—"; if(m>=1440)return (m/1440).toFixed(1)+"d"; if(m>=60)return (m/60).toFixed(1)+"h"; return Math.round(m)+"m"; }
function cc(c){return c>=50?"g":(c>=25?"a":"r");}
function ccLeak(c){return c<=2?"g":(c<=10?"a":"r");}          // leakage: small = good
function relCls(v,avg){ if(!avg) return "a"; return v>=avg*1.2?"g":(v<=avg*0.8?"r":"a"); }
function med(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function p90(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length*.9)]; }
function heat(v,max){ if(!v||!max) return ""; const pct=Math.min(52,Math.round(52*v/max)); return `background:color-mix(in srgb, var(--accent) ${pct}%, transparent)`; }
const maxDay=(()=>{ let m=0; for(const L of DATA.leads){ const d=dayIdx(L[1]); if(d!=null&&d>m)m=d; } return m; })();
// ---- REPORT-SPECIFIC CODE ----
let BREAK="overall";                 // stage table: overall | source | owner | program
let DIM="source";                    // funnel breakdown: source | owner | program
let START=0, END=maxDay;             // created-window day indices
let sortCol="count", sortDir=-1;     // overall stage table sort
const SEL=new Set();                 // selected source indices
const PROGS = Array.isArray(DATA.programs)? DATA.programs : [];
const HASPROG = PROGS.length>0;
const NOPROG = -1;                   // synthetic key for leads with no program
const PROGCAP = 14;                  // max program columns in the heat matrix
// "Enrolled/paid" = ProspectStage whose class is "won", or whose label contains "enrol".
// Discovered at runtime from DATA.stage_class / DATA.stages — never a hardcoded index.
const EN=new Set(); DATA.stages.forEach((s,i)=>{ if(stageCls(i)==="won" || /enrol/i.test(s)) EN.add(i); });

function pctStr(n,d){ return d? (100*n/d).toFixed(1)+"%" : "0%"; }
function pctNum(n,d){ return d? 100*n/d : 0; }
function pname(k){ return k===NOPROG ? "(no programme)" : (PROGS[k] || "(unknown)"); }
function dimNames(){ return DIM==="owner" ? DATA.owners : (DIM==="program" ? PROGS : DATA.sources); }
function dimLabel(k){ if(DIM==="program") return pname(k); const a=dimNames(); return a[k] || "(unknown)"; }
function dimTitle(){ return DIM==="owner" ? "lead owner" : (DIM==="program" ? "programme" : "source"); }

function compute(){
  // f = AS-REPORTED counts: each condition evaluated independently on its own LSQ field.
  // n = STRICT-PATH counts: cumulative AND down the spec order, so each step really is
  //     a subset of the one above it. f - n = leads that skipped an earlier step.
  const f={created:0,attempted:0,contacted:0,connected:0,counselled:0,enrolled:0,enrCns:0};
  const n={attempted:0,contacted:0,connected:0,counselled:0,enrolled:0};
  const miss={enrNoAttempt:0,enrNoCall:0,enrNoConnect:0,enrNoCouns:0,cnsNoConnect:0,anyRev:0,rev:0};
  const stageCount=DATA.stages.map(()=>0);
  const srcM = BREAK==="source"  ? DATA.stages.map(()=>({})) : null;  // srcM[stage][src]=count
  const ownM = BREAK==="owner"   ? {} : null;                         // ownM[owner][stage]=count
  const proM = BREAK==="program" ? DATA.stages.map(()=>({})) : null;  // proM[stage][prog]=count
  const dimM = {};                                                    // funnel rows by DIM key
  for(const L of DATA.leads){
    if(poolSkip(L)) continue;
    const d=dayIdx(L[1]); if(d==null||d<0||d<START||d>END) continue;
    if(!SEL.has(L[0])) continue;
    const st=L[9];
    const at=(L[7]||0)>0;        // Attempted  — attempts > 0 (the spec's step 2)
    const ct=L[2]!=null;         // Contacted  — first-call timestamp present (reference only)
    const cn=(L[8]||0)>0;        // Connected  — interacted count > 0
    const cs=L[16]===1;          // Counselled — counselling flag
    const en=EN.has(st);         // Enrolled / paid
    f.created++;
    if(at) f.attempted++;
    if(ct) f.contacted++;
    if(cn) f.connected++;
    if(cs) f.counselled++;
    if(en) f.enrolled++;
    // C2P must divide a SUBSET of the counselled base or it is not a conversion rate:
    // 60% of enrolments are never flagged counselled, which pushed C2P over 100% —
    // one owner rendered 6,700% in a green badge.
    if(en && cs) f.enrCns++;
    // strict nesting: created -> attempted -> connected -> counselled -> enrolled
    if(at){ n.attempted++;
      if(ct) n.contacted++;
      if(cn){ n.connected++;
        if(cs){ n.counselled++;
          if(en) n.enrolled++; } } }
    if(en){
      if(!at) miss.enrNoAttempt++;
      if(!ct) miss.enrNoCall++;
      if(!cn) miss.enrNoConnect++;
      if(!cs) miss.enrNoCouns++;
      const r=L[17]||0; if(r>0){ miss.anyRev++; miss.rev+=r; }
    }
    if(cs && !cn) miss.cnsNoConnect++;
    stageCount[st]++;
    const pk = (L[12]==null? NOPROG : L[12]);
    if(srcM){ const r=srcM[st]; r[L[0]]=(r[L[0]]||0)+1; }
    if(ownM){ const o=L[4]; (ownM[o]||(ownM[o]={}))[st]=(ownM[o][st]||0)+1; }
    if(proM){ const r=proM[st]; r[pk]=(r[pk]||0)+1; }
    const dk = DIM==="owner" ? L[4] : (DIM==="program" ? pk : L[0]);
    const row = dimM[dk] || (dimM[dk]={leads:0,att:0,ct:0,con:0,cns:0,enr:0,enrCns:0});
    row.leads++; if(at)row.att++; if(ct)row.ct++; if(cn)row.con++; if(cs)row.cns++; if(en)row.enr++; if(en&&cs)row.enrCns++;
  }
  return {f,n,miss,stageCount,srcM,ownM,proM,dimM};
}

// ---- A · the spec funnel -----------------------------------------------------
// Bars are drawn in two parts: the SOLID part is the strict-path count (this lead
// cleared every earlier step too); the FADED part is the extra leads that satisfy
// this step but skipped one above it. Bar total length = the as-reported count.
function renderFunnel(f,n){
  const base=f.created||1;
  const steps=[
    {label:"Lead created",  val:f.created,    nest:f.created,    desc:"All leads created in the window (unworked bulk pool excluded)"},
    {label:"Attempted",     val:f.attempted,  nest:n.attempted,  desc:"Call attempts &gt; 0 — the spec's step 2"},
    {label:"Connected*",    val:f.connected,  nest:n.connected,  desc:"Interacted count &gt; 0 — proxy for a real connect"},
    {label:"Counselled",    val:f.counselled, nest:n.counselled, desc:"Counselling-done flag on the lead"},
    {label:"Enrolled / paid",val:f.enrolled,  nest:n.enrolled,   desc:"ProspectStage class “won” (or label contains “enrol”)"}
  ];
  const neutral='style="background:var(--surface-2);color:var(--ink-2)"';
  let html="";
  steps.forEach((s,i)=>{
    const solid=100*s.nest/base, extra=100*Math.max(0,s.val-s.nest)/base, pct=100*s.val/base;
    const rSolid = extra>0 ? "5px 0 0 5px" : "5px";
    const rExtra = solid>0 ? "0 5px 5px 0" : "5px";
    let badges="";
    if(i>0){
      const prev=steps[i-1].val, conv=prev?Math.round(100*s.val/prev):0;
      badges+=` <span class="cov ${cc(conv)}">&rarr; ${conv}% step</span>`;
    }
    if(s.label==="Counselled") badges+=` <span class="cov" ${neutral}>L2C ${pctStr(f.counselled,f.created)}</span>`;
    if(s.label==="Enrolled / paid") badges+=` <span class="cov" ${neutral}>C2P ${pctStr(f.enrCns,f.counselled)}</span> <span class="cov" ${neutral}>L2P ${pctStr(f.enrolled,f.created)}</span>`;
    const skip = s.val-s.nest;
    const skipLine = i>0 && skip>0
      ? `<span class="fpct">${skip.toLocaleString()} of these skipped an earlier step</span>`
      : (i>0 ? `<span class="fpct">all on the full path</span>` : "");
    html+=`<div class="fstep">
      <div class="flabel">${s.label}<span class="fdesc">${s.desc}</span></div>
      <div class="ftrack">
        <span class="bar" style="width:${solid.toFixed(1)}%;height:22px;border-radius:${rSolid}"></span>
        <span style="display:block;height:22px;border-radius:${rExtra};width:${extra.toFixed(1)}%;background:color-mix(in srgb, var(--accent) 26%, transparent)"></span>
      </div>
      <div class="fval"><b>${s.val.toLocaleString()}</b><span class="fpct">${pct.toFixed(1)}% of leads</span>${badges}<br>${skipLine}</div>
    </div>`;
  });
  document.getElementById("funnel").innerHTML=html;
}

// ---- B · path integrity ------------------------------------------------------
function renderLeak(f,n,miss){
  const rows=[
    {name:"Attempted",   field:"mx_Attempts &gt; 0",      val:f.attempted,  nest:n.attempted,  ref:false},
    {name:"Contacted",   field:"mx_First_Call present",   val:f.contacted,  nest:n.contacted,  ref:true},
    {name:"Connected*",  field:"mx_Interacted_Count &gt; 0", val:f.connected, nest:n.connected, ref:false},
    {name:"Counselled",  field:"counselling-done flag",   val:f.counselled, nest:n.counselled, ref:false},
    {name:"Enrolled / paid",field:"ProspectStage class “won”", val:f.enrolled, nest:n.enrolled, ref:false}
  ];
  let body="";
  rows.forEach(r=>{
    const skip=Math.max(0,r.val-r.nest), sp=pctNum(skip,r.val);
    const nm = r.ref ? `${r.name} <span class="fpct">(reference, not a spec step)</span>` : r.name;
    body+=`<tr><td class="dim">${nm}</td><td class="fpct">${r.field}</td><td>${r.val.toLocaleString()}</td><td>${r.nest.toLocaleString()}</td><td>${skip.toLocaleString()}</td><td><span class="cov ${ccLeak(sp)}">${r.val?sp.toFixed(1):"0.0"}%</span></td></tr>`;
  });
  document.getElementById("leakhead").innerHTML=`<tr><th>Step</th><th>LSQ field behind it</th><th>As reported</th><th class="grp">On the full path</th><th>Skipped an earlier step</th><th>% off-path</th></tr>`;
  document.getElementById("leakrows").innerHTML=body;
  const e=f.enrolled||1;
  document.getElementById("leaknote").innerHTML =
    `Of the <b>${f.enrolled.toLocaleString()}</b> enrolled leads in scope: `+
    `<b>${miss.enrNoAttempt.toLocaleString()}</b> (${pctStr(miss.enrNoAttempt,e)}) have <b>no attempt logged</b>, `+
    `<b>${miss.enrNoCall.toLocaleString()}</b> (${pctStr(miss.enrNoCall,e)}) have <b>no first call</b>, `+
    `<b>${miss.enrNoConnect.toLocaleString()}</b> (${pctStr(miss.enrNoConnect,e)}) were <b>never connected</b>, and `+
    `<b>${miss.enrNoCouns.toLocaleString()}</b> (${pctStr(miss.enrNoCouns,e)}) are <b>not flagged counselled</b>. `+
    `<b>${miss.cnsNoConnect.toLocaleString()}</b> counselled leads have no connect logged. `+
    `These are activity-logging gaps, not impossible journeys — which is exactly why the ratios above are quoted as-reported, not off the narrowed path.`;
}

// ---- C · funnel by source / owner / programme --------------------------------
function renderDim(dimM,f){
  const head=document.getElementById("dhead"), body=document.getElementById("drows");
  const rf=document.getElementById("rowfilter2");
  const q=rf.value.trim().toLowerCase();
  let keys=Object.keys(dimM).map(Number);
  if(q) keys=keys.filter(k=>dimLabel(k).toLowerCase().includes(q));
  keys.sort((a,b)=>dimM[b].leads-dimM[a].leads);
  const shown=keys.slice(0,60);
  const avgL2C=pctNum(f.counselled,f.created), avgL2P=pctNum(f.enrolled,f.created), avgC2P=pctNum(f.enrCns,f.counselled);
  document.getElementById("ctitle").textContent="C · Funnel by "+dimTitle()+" — L2C / C2P / L2P";
  head.innerHTML=`<tr><th>${dimTitle().replace(/^./,c=>c.toUpperCase())}</th><th>Leads</th><th>Attempted</th><th>Connected</th><th>Counselled</th><th>Enrolled</th><th class="grp">L2C</th><th>C2P</th><th>L2P</th></tr>`;
  body.innerHTML="";
  shown.forEach(k=>{
    const r=dimM[k];
    const l2c=pctNum(r.cns,r.leads), c2p=pctNum(r.enrCns,r.cns), l2p=pctNum(r.enr,r.leads);
    body.insertAdjacentHTML("beforeend",`<tr>
      <td class="dim">${dimLabel(k)}</td>
      <td>${r.leads.toLocaleString()}</td>
      <td>${r.att.toLocaleString()} <span class="fpct">${pctStr(r.att,r.leads)}</span></td>
      <td>${r.con.toLocaleString()} <span class="fpct">${pctStr(r.con,r.leads)}</span></td>
      <td>${r.cns.toLocaleString()}</td>
      <td>${r.enr.toLocaleString()}</td>
      <td class="grp"><span class="cov ${relCls(l2c,avgL2C)}">${l2c.toFixed(1)}%</span></td>
      <td>${r.cns?`<span class="cov ${relCls(c2p,avgC2P)}">${c2p.toFixed(1)}%</span>`:'<span class="fpct">—</span>'}</td>
      <td><span class="cov ${relCls(l2p,avgL2P)}">${l2p.toFixed(1)}%</span></td>
    </tr>`);
  });
  const t=keys.reduce((a,k)=>{ const r=dimM[k]; a.leads+=r.leads;a.att+=r.att;a.con+=r.con;a.cns+=r.cns;a.enr+=r.enr;a.enrCns+=r.enrCns||0; return a; },{leads:0,att:0,con:0,cns:0,enr:0,enrCns:0});
  body.insertAdjacentHTML("beforeend",`<tr class="totrow"><td>Total (all ${keys.length})</td><td>${t.leads.toLocaleString()}</td><td>${t.att.toLocaleString()}</td><td>${t.con.toLocaleString()}</td><td>${t.cns.toLocaleString()}</td><td>${t.enr.toLocaleString()}</td><td class="grp">${pctStr(t.cns,t.leads)}</td><td>${pctStr(t.enr,t.cns)}</td><td>${pctStr(t.enr,t.leads)}</td></tr>`);
  if(!shown.length) body.innerHTML=`<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:16px">No ${dimTitle()} matches.</td></tr>`;
  document.getElementById("trunc2").innerHTML = `<b>L2C</b> = counselled ÷ leads · <b>C2P</b> = enrolled <i>that were also flagged counselled</i> ÷ counselled · <b>L2P</b> = enrolled ÷ leads, all on <b>as-reported</b> counts. Badges are shaded <b>relative to the overall rate</b> in scope (green ≥ 1.2×, red ≤ 0.8×), not against an absolute bar. `
    + (q ? `Showing ${shown.length} of ${keys.length} matching “${q}”; the total row reconciles all matches.`
         : `${keys.length} ${dimTitle()}s in scope; top ${shown.length} shown by volume. The total row reconciles all of them.`);
}

function selectedSrcOrder(){
  const cnt={}; DATA.sources.forEach((s,i)=>cnt[i]=0);
  for(const L of DATA.leads) cnt[L[0]]++;
  return Object.keys(cnt).map(Number).filter(k=>SEL.has(k)).sort((a,b)=>cnt[b]-cnt[a]);
}
function progColsInScope(proM){
  const tot={}; DATA.stages.forEach((s,i)=>{ const r=proM[i]; for(const k in r) tot[k]=(tot[k]||0)+r[k]; });
  const cols=Object.keys(tot).map(Number).sort((a,b)=>tot[b]-tot[a]);
  return {cols:cols.slice(0,PROGCAP), hidden:Math.max(0,cols.length-PROGCAP)};
}

// ---- D · ProspectStage distribution -----------------------------------------
function renderStage(res){
  const {stageCount,srcM,ownM,proM}=res;
  const total=stageCount.reduce((a,b)=>a+b,0);
  const thead=document.getElementById("thead"), body=document.getElementById("rows");
  const rf=document.getElementById("rowfilter");
  rf.style.display = BREAK==="owner" ? "" : "none";
  const q=rf.value.trim().toLowerCase();

  if(BREAK==="overall"){
    document.getElementById("btitle").textContent="D · ProspectStage distribution — overall";
    let idx=DATA.stages.map((s,i)=>i).filter(i=>stageCount[i]>0);
    const maxc=Math.max(1,...idx.map(i=>stageCount[i]));
    idx.sort((a,b)=> sortCol==="name" ? sortDir*DATA.stages[a].localeCompare(DATA.stages[b]) : sortDir*(stageCount[a]-stageCount[b]));
    const arrow=k=> sortCol===k?(sortDir<0?" ▾":" ▴"):"";
    thead.innerHTML=`<tr><th data-k="name">Stage${arrow("name")}</th><th data-k="count">Leads${arrow("count")}</th><th data-k="count">% of total</th><th>Distribution</th></tr>`;
    body.innerHTML="";
    idx.forEach(i=>{
      const c=stageCount[i]; const w=Math.round(100*c/maxc);
      const nm = EN.has(i)?`<span style="color:var(--good)">${DATA.stages[i]}</span>`:DATA.stages[i];
      body.insertAdjacentHTML("beforeend",`<tr><td class="dim">${nm}</td><td>${c.toLocaleString()}</td><td>${pctStr(c,total)}</td><td><span style="display:block;background:var(--surface-2);border-radius:4px;overflow:hidden"><span class="bar" style="width:${w}%"></span></span></td></tr>`);
    });
    body.insertAdjacentHTML("beforeend",`<tr class="totrow"><td>Total</td><td>${total.toLocaleString()}</td><td>100%</td><td></td></tr>`);
    if(!idx.length) body.innerHTML=`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">No leads in scope.</td></tr>`;
    thead.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(sortCol===k) sortDir=-sortDir; else{ sortCol=k; sortDir=(k==="name"?1:-1);} render(); });
    document.getElementById("trunc").textContent="Enrolled stage(s) highlighted in green. Click Stage / Leads headers to sort.";
    return;
  }

  if(BREAK==="source"){
    document.getElementById("btitle").textContent="D · ProspectStage × Source — heat matrix";
    const cols=selectedSrcOrder();                                  // source columns
    let stIdx=DATA.stages.map((s,i)=>i).filter(i=>stageCount[i]>0);
    stIdx.sort((a,b)=>stageCount[b]-stageCount[a]);
    let cmax=0; stIdx.forEach(i=>cols.forEach(c=>{ const v=(srcM[i][c]||0); if(v>cmax)cmax=v; }));
    thead.innerHTML=`<tr><th>Stage</th>${cols.map(c=>`<th>${DATA.sources[c]}</th>`).join("")}<th class="grp">Total</th><th>% of total</th></tr>`;
    body.innerHTML="";
    stIdx.forEach(i=>{
      const cells=cols.map(c=>{ const v=srcM[i][c]||0; return `<td><span class="cell" style="${heat(v,cmax)}">${v||""}</span></td>`; }).join("");
      const nm = EN.has(i)?`<span style="color:var(--good)">${DATA.stages[i]}</span>`:DATA.stages[i];
      body.insertAdjacentHTML("beforeend",`<tr><td class="dim">${nm}</td>${cells}<td class="tot">${stageCount[i].toLocaleString()}</td><td>${pctStr(stageCount[i],total)}</td></tr>`);
    });
    const colTot=cols.map(c=>{ let s=0; stIdx.forEach(i=>s+=(srcM[i][c]||0)); return s; });
    body.insertAdjacentHTML("beforeend",`<tr class="totrow"><td>Total</td>${colTot.map(v=>`<td>${v.toLocaleString()}</td>`).join("")}<td>${total.toLocaleString()}</td><td>100%</td></tr>`);
    if(!stIdx.length||!cols.length) body.innerHTML=`<tr><td colspan="${cols.length+3}" style="text-align:center;color:var(--muted);padding:16px">No leads in scope.</td></tr>`;
    document.getElementById("trunc").textContent="Cells shaded by lead count (deeper = more). Rows ranked by total volume; Enrolled stage(s) in green.";
    return;
  }

  if(BREAK==="program"){
    document.getElementById("btitle").textContent="D · ProspectStage × Programme — heat matrix";
    const {cols,hidden}=progColsInScope(proM);
    let stIdx=DATA.stages.map((s,i)=>i).filter(i=>stageCount[i]>0);
    stIdx.sort((a,b)=>stageCount[b]-stageCount[a]);
    let cmax=0; stIdx.forEach(i=>cols.forEach(c=>{ const v=(proM[i][c]||0); if(v>cmax)cmax=v; }));
    thead.innerHTML=`<tr><th>Stage</th>${cols.map(c=>`<th>${pname(c)}</th>`).join("")}<th class="grp">Total</th><th>% of total</th></tr>`;
    body.innerHTML="";
    stIdx.forEach(i=>{
      const cells=cols.map(c=>{ const v=proM[i][c]||0; return `<td><span class="cell" style="${heat(v,cmax)}">${v||""}</span></td>`; }).join("");
      const nm = EN.has(i)?`<span style="color:var(--good)">${DATA.stages[i]}</span>`:DATA.stages[i];
      body.insertAdjacentHTML("beforeend",`<tr><td class="dim">${nm}</td>${cells}<td class="tot">${stageCount[i].toLocaleString()}</td><td>${pctStr(stageCount[i],total)}</td></tr>`);
    });
    const colTot=cols.map(c=>{ let s=0; stIdx.forEach(i=>s+=(proM[i][c]||0)); return s; });
    body.insertAdjacentHTML("beforeend",`<tr class="totrow"><td>Total (all programmes)</td>${colTot.map(v=>`<td>${v.toLocaleString()}</td>`).join("")}<td>${total.toLocaleString()}</td><td>100%</td></tr>`);
    if(!stIdx.length||!cols.length) body.innerHTML=`<tr><td colspan="${cols.length+3}" style="text-align:center;color:var(--muted);padding:16px">No leads in scope.</td></tr>`;
    document.getElementById("trunc").textContent = hidden
      ? `Top ${cols.length} programmes by volume shown; ${hidden} smaller programme${hidden===1?"":"s"} hidden (their leads are still in the Total column). Cells shaded by lead count.`
      : "Cells shaded by lead count (deeper = more). Rows ranked by total volume; Enrolled stage(s) in green.";
    return;
  }

  // BREAK === "owner": owners (rows) × stages (columns)
  document.getElementById("btitle").textContent="D · Lead owner × ProspectStage — heat matrix";
  let stCols=DATA.stages.map((s,i)=>i).filter(i=>stageCount[i]>0);
  stCols.sort((a,b)=>stageCount[b]-stageCount[a]);
  let owners=Object.keys(ownM).map(Number);
  const ownTot=o=>{ let s=0; const r=ownM[o]; for(const k in r) s+=r[k]; return s; };
  if(q) owners=owners.filter(o=>DATA.owners[o].toLowerCase().includes(q));
  owners.sort((a,b)=>ownTot(b)-ownTot(a));
  const shown=owners.slice(0,60);
  let cmax=0; owners.forEach(o=>stCols.forEach(st=>{ const v=(ownM[o][st]||0); if(v>cmax)cmax=v; }));
  thead.innerHTML=`<tr><th>Lead owner</th>${stCols.map(st=>`<th>${DATA.stages[st]}</th>`).join("")}<th class="grp">Total</th><th>% of total</th></tr>`;
  body.innerHTML="";
  shown.forEach(o=>{
    const cells=stCols.map(st=>{ const v=ownM[o][st]||0; return `<td><span class="cell" style="${heat(v,cmax)}">${v||""}</span></td>`; }).join("");
    const t=ownTot(o);
    body.insertAdjacentHTML("beforeend",`<tr><td class="dim">${DATA.owners[o]}</td>${cells}<td class="tot">${t.toLocaleString()}</td><td>${pctStr(t,total)}</td></tr>`);
  });
  const colTot=stCols.map(st=>{ let s=0; owners.forEach(o=>s+=(ownM[o][st]||0)); return s; });
  body.insertAdjacentHTML("beforeend",`<tr class="totrow"><td>Total (all ${owners.length})</td>${colTot.map(v=>`<td>${v.toLocaleString()}</td>`).join("")}<td>${total.toLocaleString()}</td><td>100%</td></tr>`);
  if(!owners.length) body.innerHTML=`<tr><td colspan="${stCols.length+3}" style="text-align:center;color:var(--muted);padding:16px">No owners match.</td></tr>`;
  document.getElementById("trunc").textContent = q
    ? `Owners matching “${q}” (${owners.length}); top ${shown.length} shown.`
    : `${owners.length} owners with leads in scope; top ${shown.length} shown, ranked by volume. Type to filter, or the total row reconciles all owners.`;
}

function render(){
  START=dateToIdx(document.getElementById("dstart").value);
  END=dateToIdx(document.getElementById("dend").value);
  if(END<START){ const t=START; START=END; END=t; }
  document.getElementById("rangel").textContent = dmy(START)+" → "+dmy(END);
  const res=compute(); const f=res.f, n=res.n;
  document.getElementById("t-tot").textContent=f.created.toLocaleString();
  document.getElementById("t-att").textContent=f.attempted.toLocaleString();
  document.getElementById("t-contacted").textContent=f.contacted.toLocaleString();
  document.getElementById("t-con").textContent=f.connected.toLocaleString();
  document.getElementById("t-cns").textContent=f.counselled.toLocaleString();
  document.getElementById("t-enr").textContent=f.enrolled.toLocaleString();
  document.getElementById("t-l2c").textContent=pctStr(f.counselled,f.created);
  document.getElementById("t-c2p").textContent=pctStr(f.enrCns,f.counselled);
  document.getElementById("t-rate").textContent=pctStr(f.enrolled,f.created);
  renderFunnel(f,n);
  renderLeak(f,n,res.miss);
  renderDim(res.dimM,f);
  renderStage(res);
  const offPath = f.enrolled - n.enrolled;
  const noCouns = !f.counselled;
  document.getElementById("xnote").innerHTML=
    `<b>Read this before quoting a conversion rate.</b> The spec funnel is <b>Lead created &rarr; Attempted &rarr; Connected &rarr; Counselled &rarr; Enrolled</b>, `+
    `with <b>L2C</b> = counselled ÷ leads, <b>C2P</b> = enrolled <i>that were also flagged counselled</i> ÷ counselled, <b>L2P</b> = enrolled ÷ leads. `+
    `<b>These five steps are NOT a nested funnel.</b> Each one is a separate LSQ field — attempts, interacted count, the counselling flag, ProspectStage — and a lead can satisfy a later one without ever satisfying an earlier one, `+
    `usually because the activity was never logged. In this window <b>${offPath.toLocaleString()}</b> of <b>${f.enrolled.toLocaleString()}</b> enrolled leads (${pctStr(offPath,f.enrolled||1)}) did not clear every step above them. `+
    `So: the <b>solid</b> part of each bar is the strict subset that cleared every earlier step, the <b>faded</b> part is the leads that skipped one, and the headline number is the <b>as-reported</b> count — the figure the business quotes. Section B breaks the gap down step by step. `+
    (noCouns ? `<b>No counselled leads are present in this scope</b>, so L2C reads 0% and C2P is undefined — check the pull before reporting that as a real collapse. ` : ``)+
    `<b>Counselled being larger than Enrolled is expected</b> (counselling precedes payment); the thing to watch is the off-path share, not that ordering. `+
    `<b>Attempted</b> replaces the old “Contacted” step to match the spec; Contacted (first-call timestamp) is kept as a reference row in section B because the two disagree materially. `+
    `<b>Connected</b> is a proxy (mx_Interacted_Count &gt; 0), not a verified conversation. Enrolled is low in a young cohort — many leads are still “New Lead” — so L2P is a <b>floor, not a mature rate</b>. `+
    `<b>Cross-check in LSQ:</b> stage counts here should match the LSQ <b>Lead-Stage distribution</b> report (Manage Leads → group by ProspectStage) on the same created-date window and sources.`;
  document.getElementById("foot").innerHTML=`Window ${dmy(START)} → ${dmy(END)} (IST). Cohort — leads created ${isoToDMY(DATA.base)} onwards, pulled complete (earlier creates excluded, d≥0). Unworked bulk/bot pool excluded from every denominator when the pool toggle is on. Stage labels and the enrolled/“won” class read live from the data — never hardcoded. Fields: created, mx_Attempts (Attempted), mx_First_Call (Contacted, reference), mx_Interacted_Count (Connected proxy), counselling flag (Counselled), ProspectStage (Enrolled), programme (breakdown).`;
}
