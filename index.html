function init_home(){
  const DATA=window.__DATA;
  const di=m=>m==null?null:Math.floor(m/1440);
  const maxDay=(()=>{ let m=0; for(const r of DATA.leads){ const d=di(r[1]); if(d!=null&&d>m)m=d; } return m; })();
  const LAST=lastFullDay(maxDay);                       // newest COMPLETE day
  const iso=i=>new Date(new Date(DATA.base+"T00:00:00Z").getTime()+i*86400000).toISOString().slice(0,10);
  const toIdx=v=>Math.round((new Date(v+"T00:00:00Z")-new Date(DATA.base+"T00:00:00Z"))/86400000);
  // Enrolment lags creation by weeks, so a window running up to today measures an
  // immature cohort and understates L2P. MATURITY marks where that starts to bite.
  const MATURITY=30;
  const d0El=document.getElementById("h-d0"), d1El=document.getElementById("h-d1");
  if(!d0El.value){                                       // first render: default to 30d
    d0El.value=iso(Math.max(0,LAST-29)); d1El.value=iso(LAST);
  }
  [d0El,d1El].forEach(e=>{ e.min=DATA.base; e.max=iso(LAST); });
  let lo=Math.max(0,Math.min(toIdx(d0El.value),toIdx(d1El.value)));
  let hi=Math.min(LAST,Math.max(toIdx(d0El.value),toIdx(d1El.value)));
  if(!isFinite(lo)||!isFinite(hi)){ lo=Math.max(0,LAST-29); hi=LAST; }

  // ---- mode ----------------------------------------------------------------
  // COHORT     : population = leads CREATED in the window. A real funnel — each step
  //              nests, so conversion % and L2C/C2P/L2P are meaningful.
  // OPERATIONAL: population = leads TOUCHED in the window, including backlog created
  //              earlier. Each row is a DIFFERENT population keyed on its own event
  //              date, so these are counts only — a step-% between them is not a real
  //              number and is deliberately not shown.
  const MODE=window.__HMODE||"cohort";
  const inWin=v=>{ const d=di(v); return d!=null && d>=lo && d<=hi; };
  const S=DATA.leads.filter(r=>{ if(poolSkip(r)) return false;
    const d=di(r[1]); return d!=null && d>=lo && d<=hi; });
  const n=S.length||1;
  // operational population: any tracked activity whose timestamp lands in the window
  const W=DATA.leads.filter(r=>!poolSkip(r) && (
      inWin(r[5]) || inWin(r[2]) || inWin(r[15]) || inWin(r[19]) || inWin(r[20]) || inWin(r[1])));
  const ops={
    worked   : W.length,
    created  : S.length,
    attempted: DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[2])).length,
    connected: DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[15])).length,
    counselled:DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[19])).length,
    enrolled : DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[20])).length,
  };
  ops.backlog=W.filter(r=>{ const d=di(r[1]); return d==null||d<lo; }).length;

  document.getElementById("h-win").innerHTML=
    `<b>${dmyHome(lo)} \u2192 ${dmyHome(hi)}</b><br>${hi-lo+1} days \u00b7 ${S.length.toLocaleString('en-IN')} leads created`;
  // maturity warning: does the window reach into the not-yet-converted zone?
  const mEl=document.getElementById("h-mature");
  const freshDays=Math.max(0, hi-(LAST-MATURITY));
  if(MODE==="cohort" && hi>LAST-MATURITY && lo<=LAST){
    mEl.hidden=false;
    mEl.innerHTML=`<b>Immature cohort.</b> This window runs to ${dmyHome(hi)}, and leads created in the last ~${MATURITY} days have not had time to counsel or enrol. `
      +`Counselled, Enrolled, L2C, C2P, L2P and Revenue are therefore <b>understated</b> \u2014 use <b>Mature cohort</b> for a conversion rate you can quote.`;
  } else { mEl.hidden=true; }
  const num=v=>v.toLocaleString('en-IN');
  const pct=(a,b)=>b?(100*a/b).toFixed(1)+"%":"\u2014";
  const dur=m=>m==null?"\u2014":m>=1440?(m/1440).toFixed(1)+"d":m>=60?(m/60).toFixed(1)+"h":Math.round(m)+"m";
  const med=a=>{ if(!a.length) return null; const x=a.slice().sort((p,q)=>p-q); return x[Math.floor(x.length/2)]; };

  // ---- single pass ----
  const SLA=120;
  let att=0,con=0,coun=0,enr=0,attSum=0,revN=0,slaHit=0,slaBase=0,unmeas=0,overdue=0;
  const b=[0,0,0,0];                       // attempt buckets 0 / 1-2 / 3-5 / 6+
  const spd=[];                            // speed from assignment (same clock as the scorecard)
  const ASOF=(()=>{ let m=0; for(const r of S){ const d=di(r[1]); if(d>m)m=d; } return lastFullDay(m); })();
  const bySrc=new Map();
  for(const r of S){
    const a=r[7]||0, isAtt=a>0, isCon=(r[8]||0)>0;
    if(isAtt) att++; if(isCon) con++;
    if(r[16]===1) coun++;
    if(stageCls(r[9])==="won") enr++;
    attSum+=a; b[a<=0?0:a<=2?1:a<=5?2:3]++;
    if(r[17]>0) revN++;
    // "Overdue" has to mean a callback nobody made. Date-passed alone flagged 86% of
    // the book, 90% of which had activity after the due date — a stale field, not neglect.
    if(r[6]!=null && di(r[6])<ASOF && (r[5]==null || di(r[5])<di(r[6]))) overdue++;
    // speed: first call minus original assignment; unmeasurable rows leave the denominator
    if(r[2]!=null){
      const st=r[3], d=st==null?null:r[2]-st;
      if(d!=null&&d>=0){ spd.push(d); slaBase++; if(d<=SLA) slaHit++; }
      else unmeas++;
    } else { slaBase++; }                  // never called = an SLA miss, not an exclusion
    const sk=r[0], S1=bySrc.get(sk)||{n:0,att:0,con:0,a:0,paid:0}; S1.n++; S1.att+=isAtt?1:0; S1.con+=isCon?1:0; S1.a+=a; if((r[17]||0)>0) S1.paid++; bySrc.set(sk,S1);
  }
  // window-scoped pool count, and the same split per source — a source can look like a
  // strong performer purely because most of it is parked and only the worked sliver shows
  const poolRows=DATA.leads.filter(r=>{ if(r[11]!==1) return false;
    const d=di(r[1]); return d!=null && d>=lo && d<=hi; });
  const pool=poolRows.length;
  const poolBySrc=new Map();
  for(const r of poolRows) poolBySrc.set(r[0],(poolBySrc.get(r[0])||0)+1);
  const poolPct=k=>{ const p=poolBySrc.get(k)||0, w=(bySrc.get(k)||{n:0}).n; return p+w? 100*p/(p+w) : 0; };

  // ---- KPI row (spec: Master_Dashboard r5) ----
  const kpi = MODE==="cohort"
    ? [["Leads created",num(S.length)],["Leads attempted",num(att)],["Connected",num(con)],
       ["Connect %",pct(con,att)],["Avg attempts / lead",(attSum/n).toFixed(2)],
       ["Median speed to lead",dur(med(spd))],["SLA compliance %",pct(slaHit,slaBase)],
       [(window.__EXPOOL?"Unworked pool (excluded)":"Unworked pool (included)"),num(pool)]]
    : [["Leads worked",num(ops.worked)],["of which backlog",num(ops.backlog)],
       ["New leads created",num(ops.created)],["First attempts made",num(ops.attempted)],
       ["First connects made",num(ops.connected)],["Counselling sessions",num(ops.counselled)],
       ["Enrolments",num(ops.enrolled)]];
  document.getElementById("kpis").innerHTML=kpi.map(k=>`<div class="kpi"><div class="n">${k[1]}</div><div class="l">${k[0]}</div></div>`).join("");
  // Basis + nesting. Every tile counts leads CREATED in the window — not leads worked
  // in it. Attempted/Connected are genuine subsets; Counselled/Enrolled are not.
  const enrNoCoun=S.filter(r=>stageCls(r[9])==="won"&&r[16]!==1).length;
  const counNoCon=S.filter(r=>r[16]===1&&(r[8]||0)<=0).length;
  document.getElementById("h-modehint").innerHTML = MODE==="cohort"
    ? `<b>Cohort performance.</b> Everything below describes the leads <b>created</b> in this window and how they converted, whenever that conversion happened. Answers \u201cwere these leads any good?\u201d`
    : `<b>Operational performance.</b> Everything below describes what actually <b>happened</b> in this window, including work on leads created earlier. Answers \u201cwhat did the team do?\u201d Counts only \u2014 no conversion rates, because each row is a different population.`;
  document.querySelectorAll("#h-mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===MODE));
  // the health check and maturity warning are cohort concepts; hide them in ops mode
  document.querySelectorAll(".hcrow, #hcnote").forEach(e=>{ e.style.display = MODE==="cohort"?"":"none"; });
  document.querySelectorAll(".mdsect").forEach(e=>{
    const sh=e.querySelector(".sh");
    if(sh && sh.textContent.trim().startsWith("Quick health check")) e.style.display = MODE==="cohort"?"":"none";
  });
  document.getElementById("kpinote").innerHTML=
    MODE==="ops"
    ? `<b>Basis.</b> Every tile counts an <b>event that occurred</b> between ${dmyHome(lo)} and ${dmyHome(hi)}, `
      +`regardless of when the lead was created — ${num(ops.backlog)} of the ${num(ops.worked)} leads worked were created before this window. `
      +`<b>No row is a subset of another</b>, so ratios between them are not conversion rates. `
      +`Switch to <b>Cohort performance</b> for a funnel that nests.`
    : `<b>Basis.</b> Every tile counts leads <b>created</b> between ${dmyHome(lo)} and ${dmyHome(hi)} — `
    +`not leads worked on during it. A lead created in June and called yesterday is not here. `
    +`All five funnel tiles are subsets of Leads created. `
    +`<b>Chain.</b> Created \u2283 Attempted \u2283 Connected holds exactly. Below that it breaks — `
    +(enrNoCoun||counNoCon
      ? `Counselled and Enrolled come from separate LeadSquared fields, so `
        +`${num(enrNoCoun)} enrolled lead${enrNoCoun===1?" was":"s were"} never flagged counselled`
        +(counNoCon?` and ${num(counNoCon)} counselled never registered a connect`:"")
        +`. Funnel / Stage has the full breakdown. `
      : `not in this window: Counselled and Enrolled nest cleanly here. `)
    +`<b>Timing.</b> Counselled and Enrolled are measured <b>as of the last refresh</b>, so the `
    +`counselling or payment may have happened after this window closed. That is deliberate — it is `
    +`how a cohort converts, not how much counselling happened in the period.`
    +(window.__EXPOOL?"":" <b>The unworked pool is currently included</b>, which dilutes every rate above.");

  // ---- quick health check (spec: r9) ----
  const hc=[["0 attempts",b[0],b[0]/n>0.25?"bad":""],["1\u20132 attempts",b[1],""],["3\u20135 attempts",b[2],""],
    ["6+ attempts",b[3],""],[`SLA breaches (>${SLA} min)`,slaBase-slaHit,"warn"],["Overdue follow-ups",overdue,overdue/n>0.3?"bad":"warn"]];
  document.getElementById("health").innerHTML=hc.map(h=>`<div class="hc ${h[2]}"><div class="n">${num(h[1])}</div><div class="l">${h[0]}</div></div>`).join("");
  document.getElementById("hcnote").innerHTML=
    `<b>SLA</b> = first call placed within <b>${SLA} minutes of the lead being assigned</b> to its owner; `
    +`a lead never called counts as a breach. `
    +`<b>Overdue follow-up</b> = the lead carries a scheduled next-follow-up date in LeadSquared `
    +`(mx_Follow_Up_Date) that has already passed as of <b>${dmyHome(ASOF)}</b> without being actioned or rescheduled `
    +`\u2014 a promised callback nobody made. `
    +`Attempt buckets use the report spec's threshold of 5.`;

  // ---- funnel (cohort) OR activity scorecard (operational) ----
  const fEl=document.getElementById("mfunnel"), aEl=document.getElementById("macts");
  if(MODE==="cohort"){
    aEl.innerHTML=""; aEl.hidden=true; fEl.hidden=false;
    document.getElementById("mftitle").textContent="Funnel snapshot \u00b7 cohort created in window";
    const steps=[["Lead created",S.length],["Attempted",att],["Connected",con],["Counselled",coun],["Enrolled",enr]];
    fEl.innerHTML=steps.map((st,i)=>{
      const p=100*st[1]/S.length;
      const c=Math.round(100*st[1]/(steps[i-1]?steps[i-1][1]||1:1));
      const badge=i>0?` <span class="cov ${c>=50?"g":c>=25?"a":"r"}">\u2192 ${c}% step</span>`:"";
      return `<div class="fstep"><div class="flabel">${st[0]}</div><div class="ftrack"><span class="bar" style="width:${p.toFixed(1)}%;height:20px;border-radius:5px"></span></div><div class="fval"><b>${num(st[1])}</b><span class="fpct">${p.toFixed(1)}% of created</span>${badge}</div></div>`;
    }).join("")
     +`<div class="fstep" style="margin-top:8px"><div class="flabel">L2C / C2P / L2P</div><div class="ftrack"></div><div class="fval"><b>${pct(coun,S.length)} / ${pct(enr,coun)} / ${pct(enr,S.length)}</b></div></div>`;
    document.getElementById("mfnote").innerHTML="<b>These five steps come from independent LeadSquared fields, so they do not strictly nest</b> \u2014 a lead can be Enrolled without a logged first call. Attempts and connects are under-logged, so effort figures are floors.";
  } else {
    fEl.innerHTML=""; fEl.hidden=true; aEl.hidden=false;
    document.getElementById("mftitle").textContent="Activity in window \u00b7 counts, not a funnel";
    const rows=[
      ["Leads worked",ops.worked,"any tracked activity in the window \u2014 including backlog created earlier"],
      ["\u2514 of which backlog",ops.backlog,"created before this window, worked during it"],
      ["New leads created",ops.created,"created in the window"],
      ["First attempts made",ops.attempted,"first call logged in the window"],
      ["First connects made",ops.connected,"first interaction in the window"],
      ["Counselling sessions",ops.counselled,"first counselling dated in the window"],
      ["Enrolments",ops.enrolled,"first payment dated in the window"],
    ];
    aEl.innerHTML=rows.map(r=>
      `<div class="actrow"><div><div class="t">${r[0]}</div><div class="d">${r[2]}</div></div>`
      +`<div class="v">${num(r[1])}</div></div>`).join("");
    document.getElementById("mfnote").innerHTML=
      "<b>Deliberately no conversion percentages here.</b> Each row is a different population keyed on its own event date \u2014 "
      +"a lead can be worked this month but created last month, and counselled this month having connected last month. "
      +"A ratio between two of these rows is not a conversion rate. Switch to <b>Cohort performance</b> for rates you can quote. "
      +"<b>One limitation:</b> LeadSquared exposes only the <i>latest</i> activity date, so \u201cLeads worked\u201d is exact for a "
      +"window ending on the most recent day and under-counts older windows.";
  }

  // ---- source table (spec: r9 right-hand block) ----
  if(MODE==="ops"){
    const oSrc=new Map();
    for(const r of W){ const k=r[0], o=oSrc.get(k)||{n:0,att:0,con:0,enr:0};
      o.n++; if(inWin(r[2])) o.att++; if(inWin(r[15])) o.con++; if(inWin(r[20])) o.enr++; oSrc.set(k,o); }
    document.querySelector("#msrc").closest(".tblwrap").previousElementSibling.querySelector(".sh").textContent="Source \u00b7 activity in window";
    const head=document.querySelector("#msrc").closest("table").querySelector("thead tr");
    head.innerHTML="<th>Source</th><th>Leads worked</th><th>First attempts</th><th>First connects</th><th>Enrolments</th>";
    document.getElementById("msrc").innerHTML=[...oSrc.entries()].sort((a,c)=>c[1].n-a[1].n).map(([k,v])=>
      `<tr><td class="dim">${DATA.sources[k]}</td><td>${num(v.n)}</td><td>${num(v.att)}</td><td>${num(v.con)}</td><td>${v.enr?num(v.enr):"\u2014"}</td></tr>`).join("");
  } else {
  document.querySelector("#msrc").closest(".tblwrap").previousElementSibling.querySelector(".sh").textContent="Source performance";
  document.querySelector("#msrc").closest("table").querySelector("thead tr").innerHTML=
    "<th>Source</th><th>Lead base</th><th>% in pool</th><th>Connect %</th><th>Avg att.</th><th>Paying leads</th>";
  document.getElementById("msrc").innerHTML=[...bySrc.entries()].sort((a,c)=>c[1].n-a[1].n).map(([k,v])=>
    (()=>{ const pp=poolPct(k);
      const cls=pp>=50?"r":pp>=20?"a":"";
      const ptxt=pp>0.05?`<span class="cov ${cls||"g"}" title="${num(poolBySrc.get(k)||0)} of this source's leads sit in the unworked pool and are not in Lead base">${pp.toFixed(0)}%</span>`:'<span style="color:var(--muted)">\u2014</span>';
      return `<tr><td class="dim">${DATA.sources[k]}</td><td>${num(v.n)}</td><td>${ptxt}</td><td><span class="cov ${v.att&&100*v.con/v.att>=50?"g":v.att&&100*v.con/v.att>=25?"a":"r"}">${pct(v.con,v.att)}</span></td><td>${(v.a/(v.n||1)).toFixed(2)}</td><td>${v.paid?num(v.paid):"\u2014"}</td></tr>`;})()).join("");
  }

  // ---- footer ----
  const gen=DATA.generated_at?new Date(DATA.generated_at):null;
  const istNow=gen?new Date(gen.getTime()+330*60000):null;
  const pad=v=>String(v).padStart(2,"0");
  const stamp=istNow?`${pad(istNow.getUTCDate())}-${pad(istNow.getUTCMonth()+1)}-${istNow.getUTCFullYear()} ${pad(istNow.getUTCHours())}:${pad(istNow.getUTCMinutes())} IST`:"unknown";
  // ---- controls ----
  document.querySelectorAll("#h-mode button").forEach(b=>b.onclick=()=>{
    window.__HMODE=b.dataset.m; init_home();
  });
  d0El.onchange=d1El.onchange=()=>{ markCustom(); init_home(); };
  function markCustom(){ document.querySelectorAll("#h-preset button").forEach(b=>b.classList.remove("on")); }
  document.querySelectorAll("#h-preset button").forEach(b=>b.onclick=()=>{
    const p=b.dataset.p;
    if(p==="all"){ d0El.value=DATA.base; d1El.value=iso(LAST); }
    else if(p==="mtd"){ const d=new Date(iso(LAST)+"T00:00:00Z");
      d0El.value=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-01`; d1El.value=iso(LAST); }
    else if(p==="mature"){ d0El.value=DATA.base; d1El.value=iso(Math.max(0,LAST-MATURITY)); }
    else { const k=+p; d0El.value=iso(Math.max(0,LAST-(k-1))); d1El.value=iso(LAST); }
    init_home();
    document.querySelectorAll("#h-preset button").forEach(x=>x.classList.toggle("on",x===b));
  });

  syncDateText();
  document.getElementById("homefoot").innerHTML=
    `<b>Data as of ${stamp}.</b> Window <b>${dmyHome(lo)} \u2192 ${dmyHome(hi)}</b> (IST). Pulled live from the LeadSquared API (read-only); every date and time on this dashboard is IST. `
    +`Data available from ${isoToDMY(DATA.base)}. `
    +(window.__EXPOOL?`Rates exclude leads held by unworked pool accounts (${(DATA.pools||[]).join(", ")||"none"}) \u2014 toggle in the top bar. `:`Rates <b>include</b> unworked pool leads, which dilute every rate. `)
    +"Connect uses mx_Interacted_Count&gt;0 as a proxy; attempts and connects are under-logged, so effort metrics are floors. "
    +"Revenue is amount collected (mx_Total_Amount_Paid), including part-payments.";
}
// home needs a DD-MM-YYYY day formatter in its own scope
function dmyHome(i){
  const D=window.__DATA, base=new Date(D.base+"T00:00:00Z");
  return isoToDMY(new Date(base.getTime()+i*86400000).toISOString().slice(0,10));
}
const VIEWS={
  speed:{title:"Speed to Lead",init:init_speed},
  ageing:{title:"Lead Ageing",init:init_ageing},
  owner:{title:"Owner Scorecard",init:init_owner},
  source:{title:"Source Performance",init:init_source},
  attempts:{title:"Average Attempts",init:init_attempts},
  connect:{title:"Connectability",init:init_connect},
  funnel:{title:"Funnel / Stage",init:init_funnel}
};
function show(key){
  const view=document.getElementById("view");
  const crumb=document.getElementById("crumb");
  if(key==="home"||!VIEWS[key]){
    view.innerHTML=document.getElementById("tpl-home").innerHTML;
    init_home();
    const strip=view.querySelector("#kpis"); if(strip) strip.insertAdjacentHTML("beforebegin", refreshBanner());
    upgradeDates();
    crumb.innerHTML=""; window.scrollTo(0,0);
    location.hash=""; return;
  }
  view.innerHTML='<div class="wrap">'+document.getElementById("tpl-"+key).innerHTML+'</div>';
  VIEWS[key].init();
  // one banner, every report: the pool exclusion must never be invisible
  const lede=view.querySelector(".lede"); if(lede) lede.insertAdjacentHTML("afterend", refreshBanner()+poolBanner());
  upgradeDates();
  crumb.innerHTML=" / <b>"+VIEWS[key].title+"</b>";
  window.scrollTo(0,0); location.hash=key;
}
// <input type="date"> renders in the viewer's BROWSER/OS locale — a US-region Mac
// shows 08/13/2026 for 13 Aug, which is ambiguous for any day <= 12 and cannot be
// overridden from HTML or CSS. So the native field stops being what the user reads:
// it is collapsed behind a calendar button and keeps holding the ISO value (every
// report still reads el.value), while a text field in front shows and accepts
// DD-MM-YYYY. Same format for every viewer on every machine.
const CAL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>';

function parseDMY(v){
  const m=/^\s*(\d{1,2})\s*[-\/. ]\s*(\d{1,2})\s*[-\/. ]\s*(\d{4})\s*$/.exec(v||"");
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12||d<1||d>31) return null;
  const dt=new Date(Date.UTC(y,mo-1,d));
  // rejects 31-02-2026 etc: the Date rolls over, so the parts stop matching
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return null;
  return dt.toISOString().slice(0,10);
}

function upgradeDates(){
  document.querySelectorAll('input[type=date]').forEach(nat=>{
    if(nat.closest('.dwrap')) return;                       // already upgraded
    const wrap=document.createElement('span'); wrap.className='dwrap';
    const txt=document.createElement('input');
    txt.type='text'; txt.className='dtext'; txt.placeholder='DD-MM-YYYY';
    txt.setAttribute('inputmode','numeric');
    txt.setAttribute('aria-label',(nat.getAttribute('aria-label')||'date')+' (DD-MM-YYYY)');
    nat.tabIndex=-1;                    // invisible: keyboard users tab to the text field
    const cal=document.createElement('span'); cal.className='dcal'; cal.innerHTML=CAL_SVG;
    cal.title='Pick from a calendar';
    nat.parentNode.insertBefore(wrap, nat);
    wrap.appendChild(txt); wrap.appendChild(cal); cal.appendChild(nat);

    const commit=()=>{
      const iso=parseDMY(txt.value);
      if(!iso){ txt.classList.add('bad'); return; }
      let v=iso;
      if(nat.min && v<nat.min) v=nat.min;
      if(nat.max && v>nat.max) v=nat.max;
      txt.classList.remove('bad');
      if(v!==nat.value){ nat.value=v; nat.dispatchEvent(new Event('change',{bubbles:true})); }
      txt.value=isoToDMY(nat.value);
    };
    txt.addEventListener('blur', ()=>{ if(!parseDMY(txt.value)){ txt.classList.remove('bad'); txt.value=isoToDMY(nat.value); } else commit(); });
    txt.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); txt.blur(); } });
    txt.addEventListener('input', ()=>txt.classList.remove('bad'));
    // Safari only opens the popover from its own glyph, which is invisible here, so
    // drive it explicitly. Two dismissal problems come with that:
    //   1. clicking the button to CLOSE also re-fires this handler, reopening it;
    //   2. the native input never had focus, so Escape had nothing to close.
    // Hence the open flag, and focusing the input before showing the picker.
    let open=false;
    const close=()=>{ open=false; try{ nat.blur(); }catch(_){} };
    cal.addEventListener('mousedown', e=>e.preventDefault());   // don't steal focus mid-click
    cal.addEventListener('click', ()=>{
      if(open){ close(); return; }                              // second click = dismiss
      nat.focus();                                              // so Escape + blur work natively
      try{ nat.showPicker(); open=true; }
      catch(_){ nat.style.pointerEvents='auto'; nat.click(); nat.style.pointerEvents=''; open=true; }
    });
    nat.addEventListener('change', close);
    nat.addEventListener('blur',   close);
    nat.addEventListener('keydown', e=>{ if(e.key==='Escape'){ close(); txt.focus(); } });
    // Escape anywhere in the control returns you to the text field with the value intact
    txt.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ e.preventDefault(); txt.value=isoToDMY(nat.value); txt.classList.remove('bad'); txt.blur(); }
    });
  });
  syncDateText();
}
// keep the visible text in step with programmatic .value changes made by reports
function syncDateText(){
  document.querySelectorAll('.dwrap').forEach(w=>{
    const nat=w.querySelector('input[type=date]'), txt=w.querySelector('.dtext');
    if(nat&&txt&&document.activeElement!==txt) txt.value=nat.value?isoToDMY(nat.value):'';
  });
}
document.addEventListener('change', ev=>{
  if(ev.target && ev.target.matches && ev.target.matches('input[type=date]')) setTimeout(syncDateText,0);
});
// Presets and mode buttons set input.value directly, which fires no event — so the
// visible DD-MM-YYYY text went stale behind them. Re-sync after any segmented click.
document.addEventListener('click', ev=>{
  if(ev.target && ev.target.closest && ev.target.closest('.seg,.modeseg')) setTimeout(syncDateText,0);
}, true);
// ---- refresh status: last run, next run, and whether one was missed ----
// All arithmetic is on absolute instants; IST wall-clock is derived by shifting +5:30
// and reading UTC fields, so the result is identical in any viewer timezone.
const IST_MS=330*60000, DAY_MS=86400000;
function istFields(ms){ const d=new Date(ms+IST_MS);
  return {y:d.getUTCFullYear(),mo:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes()}; }
function istStamp(ms){ const f=istFields(ms), p=v=>String(v).padStart(2,"0");
  return `${p(f.d)}-${p(f.mo+1)}-${f.y} ${p(f.h)}:${p(f.mi)} IST`; }
function fmtDur(ms){
  if(ms<0) ms=0;
  const m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h`;
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}
function refreshStatus(){
  const D=window.__DATA;
  if(!D || !D.generated_at) return null;
  const gen=new Date(D.generated_at).getTime(); if(isNaN(gen)) return null;
  const now=Date.now();
  const [hh,mm]=String(D.refresh_ist||"07:00").split(":").map(Number);
  // next instant whose IST wall-clock is hh:mm and which is still ahead of now
  const f=istFields(now);
  let next=Date.UTC(f.y,f.mo,f.d,hh||0,mm||0)-IST_MS;
  if(next<=now) next+=DAY_MS;
  // Alert on DATA AGE, not on schedule adherence. GitHub's scheduled workflows are
  // best-effort: the first scheduled run on this repo started 4h31m after its cron.
  // Judging "late" against the nominal time would false-alarm every morning, so the
  // schedule is shown for information and the health check allows a cycle + drift.
  const LATE_H=30, STALE_H=54;            // 24h cycle + slack; 2 missed cycles
  const ageH=(now-gen)/3600000;
  const state = ageH>STALE_H ? "stale" : (ageH>LATE_H ? "late" : "ok");
  return {gen,now,next,state,age:now-gen,until:next-now,ageH,
          schedule:`${String(hh||0).padStart(2,"0")}:${String(mm||0).padStart(2,"0")} IST daily`};
}
function paintRefresh(){
  const el=document.getElementById("nav-refresh"); if(!el) return;
  const r=refreshStatus();
  if(!r){ el.textContent=""; el.style.display="none"; return; }
  el.style.display="";
  el.classList.remove("late","stale"); if(r.state!=="ok") el.classList.add(r.state);
  el.innerHTML='<span class="dot"></span>'
    +(r.state==="ok" ? `Updated ${fmtDur(r.age)} ago · next ~${fmtDur(r.until)}`
                     : `Refresh overdue — data ${fmtDur(r.age)} old`);
  el.title=`Last refresh: ${istStamp(r.gen)}\nNext scheduled: ${istStamp(r.next)} (${r.schedule})`
    +`\nGitHub runs scheduled jobs on a best-effort basis, so the actual time can slip by hours.`
    +(r.state==="ok"?"":`\nNo refresh has landed in ${fmtDur(r.age)} — check the "Daily LSQ refresh" GitHub Action.`);
}
function refreshBanner(){
  const r=refreshStatus(); if(!r) return "";
  const cls=r.state==="ok"?"":" "+r.state;
  const head=r.state==="ok"
    ? `<b>Data current.</b> Last refreshed <b>${istStamp(r.gen)}</b> (${fmtDur(r.age)} ago).`
    : `<b>Refresh overdue.</b> Last successful refresh <b>${istStamp(r.gen)}</b> — <b>${fmtDur(r.age)}</b> ago, so at least one daily run has not landed. Check the “Daily LSQ refresh” GitHub Action; the numbers below are from that older snapshot.`;
  return `<div class="statusbar${cls}">${head} Next refresh scheduled <b>${istStamp(r.next)}</b> — about <b>${fmtDur(r.until)}</b> away (${r.schedule}; GitHub can start it late).</div>`;
}
// ---- global unworked-pool toggle ----
const PB=document.getElementById("nav-pool");
function poolStats(){
  const D=window.__DATA; if(!D || !D.leads) return {n:0,names:[]};
  let n=0; for(const L of D.leads){ if(L[11]===1 && L[1]!=null && L[1]>=0) n++; }
  return {n, names:(D.pools||[])};
}
function paintPool(){
  const {n,names}=poolStats();
  PB.classList.toggle("on", window.__EXPOOL);
  PB.innerHTML='<span class="dot"></span>'+(window.__EXPOOL?"Pool excluded":"Pool included")
    +(n?' · '+n.toLocaleString('en-IN'):'');
  PB.title=(names.length?names.join(", "):"unworked pool accounts")
    +" — bulk/bot accounts that hold leads without working them. Excluded from all"
    +" rate denominators by default; click to include them.";
}
PB.onclick=()=>{ window.__EXPOOL=!window.__EXPOOL; paintPool();
  show((location.hash||"").replace("#","")||"home"); };
// banner each report drops under its title, so the exclusion is never invisible
function poolBanner(){
  const {n,names}=poolStats(); if(!n) return "";
  return '<div class="poolbar">'+(window.__EXPOOL
    ? '<b>'+n.toLocaleString('en-IN')+' leads excluded</b> — held by unworked pool account'
      +(names.length>1?'s':'')+' ('+(names.join(", ")||"—")+'), which hold leads without'
      +' working them. Rates below describe leads a counsellor actually owns.'
    : '<b>'+n.toLocaleString('en-IN')+' unworked-pool leads included</b> ('+(names.join(", ")||"—")
      +') — coverage, attempts, connect % and enrolment % are diluted by leads nobody worked.')
    +' Toggle in the top bar.</div>';
}
// ---- global theme toggle ----
const ROOT=document.documentElement, TT=document.getElementById("nav-tt");
function effTheme(){ return ROOT.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
function setTheme(t){ ROOT.dataset.theme=t; TT.textContent=t==="dark"?"☀ Light":"☾ Dark"; }
TT.onclick=()=>setTheme(effTheme()==="dark"?"light":"dark"); setTheme("light");
// ---- route ----
document.getElementById("view").innerHTML='<div class="wrap"><p style="color:var(--muted);padding:48px 0;font-size:15px">Loading data…</p></div>';
fetch("data/universe.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{ window.__DATA=d; paintPool(); paintRefresh();
  // the countdown must not go stale in a tab left open all day
  setInterval(paintRefresh, 30000);
  const start=(location.hash||"").replace("#",""); show(VIEWS[start]?start:"home"); }).catch(e=>{ document.getElementById("view").innerHTML='<div class="wrap"><p style="color:var(--crit);padding:48px 0">Could not load data. Try refreshing.</p></div>'; });
</script>
