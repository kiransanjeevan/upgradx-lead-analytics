<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>:root{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef1f5;--ink:#1a2230;--ink-2:#3c4859;--muted:#586472;--line:#e3e7ec;--line-2:#ccd3dc;--accent:#2560ad;--accent-2:#1c4a88;--accent-soft:#e9f0fa;--good:#15683e;--good-soft:#eaf4ee;--good-line:#a7cdb7;--warn:#875008;--warn-soft:#fbf0da;--warn-line:#e4bd80;--crit:#9c302b;--crit-soft:#f9ebe9;--crit-line:#e3aca7;--shadow:0 1px 2px rgb(20 30 45/.05),0 2px 8px rgb(20 30 45/.05);--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;--accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--good-line:#2d5a43;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}}
:root[data-theme="light"]{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef1f5;--ink:#1a2230;--ink-2:#3c4859;--muted:#586472;--line:#e3e7ec;--line-2:#ccd3dc;--accent:#2560ad;--accent-2:#1c4a88;--accent-soft:#e9f0fa;--good:#15683e;--good-soft:#eaf4ee;--good-line:#a7cdb7;--warn:#875008;--warn-soft:#fbf0da;--warn-line:#e4bd80;--crit:#9c302b;--crit-soft:#f9ebe9;--crit-line:#e3aca7;}
:root[data-theme="dark"]{--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;--accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--good-line:#2d5a43;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";}
table,.tile .n,.dtext,.fnum input{font-variant-numeric:tabular-nums;}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 64px;position:relative;}
.themetoggle{position:absolute;top:26px;right:20px;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);}
.themetoggle:hover{border-color:var(--accent);color:var(--accent);}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
h1{font-size:clamp(22px,3.2vw,28px);margin:8px 0 0;letter-spacing:-.02em;font-weight:700;}
.lede{color:var(--ink-2);font-size:14.5px;max-width:82ch;margin:9px 0 0;}
.panel{margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.lvl{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);}
.lvl:last-child{border-bottom:none;}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.lname{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.lname .side{float:right;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);}
.lname .side a{color:var(--accent);cursor:pointer;text-decoration:none;}
.lname .side a:hover{text-decoration:underline;}
input[type=date],input[type=number],input[type=text],.txt{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
.datehint{margin-top:9px;font-size:12px;color:var(--muted);}
.datehint b{color:var(--ink-2);}
.srcs{display:flex;flex-wrap:wrap;gap:6px;}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line-2);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--surface);color:var(--muted);}
.chk.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600;}
.chk .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.chk.on .dot{background:var(--accent);}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
.seg button{border:none;background:var(--surface);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--line-2);}
.seg button.on{background:var(--accent-soft);color:var(--accent-2);}
.segwrap{display:flex;gap:22px;flex-wrap:wrap;}
/* One row of tiles on every report; it scrolls sideways instead of wrapping. */
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(136px,1fr);gap:12px;margin:14px -4px 2px;padding:2px 4px 10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;}
.kpistrip,.hcrow{overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;padding:2px 4px 10px;margin-left:-4px;margin-right:-4px;}
.tiles,.kpistrip,.hcrow{scroll-padding-inline:4px;}   /* snap to the padded edge, not 4px in */
.tiles>*,.kpistrip>*,.hcrow>*{scroll-snap-align:start;}
/* edge fade = "more this way"; toggled by edgeFade() only when the row actually overflows */
.xrow-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);}
.xrow-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px);mask-image:linear-gradient(to right,transparent,#000 48px);}
.xrow-l.xrow-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);}
.tile:has(.tipbtn){padding-right:32px;}
.tile .n{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;}
.tile .l{font-size:12px;color:var(--muted);margin-top:6px;}
.tile.hi .n{color:var(--accent-2);}
.tile.unc .n{color:var(--crit);}
.tile.unc{border-color:var(--crit-line);}
.tile.warn .n{color:var(--warn);}
.tile.warn{border-color:var(--warn-line);}
.tile.good .n{color:var(--good);}
.shrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:24px 2px 10px;}
.sh{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;}
.rowfilter{padding:6px 10px;font-size:13px;width:190px;margin-left:auto;}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:13px;background:var(--surface);}
th{text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;}
th:first-child{text-align:left;}
th.grp{color:var(--accent-2);border-left:1px solid var(--line);}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;}
td:first-child{text-align:left;}
tr:last-child td{border-bottom:none;}
td.dim{color:var(--ink);font-weight:600;white-space:nowrap;}
td.tot{font-weight:700;color:var(--ink);border-left:1px solid var(--line);}
td.crit{color:var(--crit);font-weight:600;}
td.warncol{color:var(--warn);font-weight:600;}
tr.totrow td{background:var(--surface-2);font-weight:700;color:var(--ink);border-top:2px solid var(--line-2);}
.cell{display:inline-block;min-width:24px;border-radius:5px;padding:1px 6px;}
.bar{height:8px;border-radius:4px;background:var(--accent);display:inline-block;vertical-align:middle;}
.cov{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px;}
.cov.g{background:var(--good-soft);color:var(--good);}
.cov.a{background:var(--warn-soft);color:var(--warn);}
.cov.r{background:var(--crit-soft);color:var(--crit);}
.trunc{font-size:12px;color:var(--muted);margin:8px 2px 0;}
.tt-lede{color:var(--ink-2);font-size:14.5px;max-width:82ch;margin:9px 0 0;}
.tt-hours{display:grid;grid-auto-flow:column;grid-auto-columns:14px;gap:2px;justify-content:start;}
.tt-hours span{width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);}
#tt-note div{margin-top:5px;}
.isframe{display:block;width:100%;min-height:70vh;border:0;background:transparent;}
#tt-tbl td{white-space:nowrap;}
/* collapsible note: closed by default, opens in place */
.xfold summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;list-style:none;cursor:pointer;font-weight:700;color:var(--ink-2);}
.xfold summary::-webkit-details-marker{display:none;}
.xfold summary::before{content:"";align-self:center;width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;}
.xfold[open] summary::before{transform:rotate(45deg);}
.xfold summary span{font-weight:400;font-size:12.5px;color:var(--muted);}
.xfold summary:hover{color:var(--accent);}
.xfold summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
.xfold[open] summary{margin-bottom:8px;}
/* the table scrolls inside its own box, so the header and the name column can stay pinned */
#tt-wrap{max-height:calc(100vh - var(--topH,58px) - 24px);overflow:auto;}
#tt-tbl thead{position:sticky;top:0;z-index:3;}
#tt-tbl th{cursor:default;vertical-align:bottom;}
/* Effort: parent column bands, same shape as Talk Time */
table.banded tr.ef-band th{text-align:center;vertical-align:middle;color:var(--ink-2);font-weight:700;letter-spacing:.1em;border-bottom:0;padding-bottom:4px;}
table.banded tr.ef-band th.ef-g{box-shadow:inset 0 -2px 0 var(--line-2);}
table.banded th.ef-s,table.banded td.ef-s{border-left:1px solid var(--line);}
table.banded th{white-space:normal;padding-left:7px;padding-right:7px;}
table.banded td{padding-left:7px;padding-right:7px;}
table.banded tbody td:not(.dim){white-space:nowrap;}
table.banded tr.stl-g .stl-sub{display:block;margin:1px 0 0 18px;font-weight:400;}
table.banded tr.stl-c td.dim{padding-left:32px;}
/* the centre × stage matrix carries a column per stage */
#fn-d th,#fn-d td{padding-left:5px;padding-right:5px;}
#fn-d tbody td{font-size:12px;}
#fn-d tr.stl-c td.dim{padding-left:28px;}
#ef-tbl tr.ef-band th,#ag-tbl tr.ef-band th{text-align:center;vertical-align:middle;color:var(--ink-2);font-weight:700;letter-spacing:.1em;border-bottom:0;padding-bottom:4px;}
#ef-tbl tr.ef-band th.ef-g,#ag-tbl tr.ef-band th.ef-g{box-shadow:inset 0 -2px 0 var(--line-2);}
#ef-tbl th.ef-s,#ef-tbl td.ef-s,#ag-tbl th.ef-s,#ag-tbl td.ef-s{border-left:1px solid var(--line);}
#ef-rows td:not(.dim),#ag-tbl tbody td:not(.dim){white-space:nowrap;}
/* 15 columns: tighter cells so the table fits a laptop width without sideways scroll */
#ef-tbl th,#ef-tbl td{padding-left:7px;padding-right:7px;}
#ef-tbl tbody td{font-size:12.5px;}
#ef-tbl th{white-space:normal;}
#ef-tbl tr.stl-g .stl-sub,#ag-tbl tr.stl-g .stl-sub{display:block;margin:1px 0 0 18px;font-weight:400;}
#ef-tbl tr.stl-c td.dim{padding-left:32px;}
#ag-tbl th{white-space:normal;}
#tt-tbl tr.tt-band th{text-align:center;vertical-align:middle;color:var(--ink-2);font-weight:700;letter-spacing:.1em;border-bottom:0;padding-bottom:4px;}
#tt-tbl tr.tt-band th.tt-g{box-shadow:inset 0 -2px 0 var(--line-2);}
#tt-tbl th.tt-gs,#tt-tbl td.tt-gs{border-left:1px solid var(--line);}
#tt-tbl tr.tt-band th:first-child,#tt-tbl tbody td:first-child{position:sticky;left:0;z-index:1;text-align:left;vertical-align:bottom;box-shadow:inset -1px 0 0 var(--line);}
#tt-tbl tr.tt-centre td span{position:sticky;left:12px;}
#tt-tbl tbody td:first-child{background:var(--surface);}
#tt-tbl tbody tr.tt-centre td:first-child{background:var(--surface-2);position:static;box-shadow:none;}
#tt-tbl tbody tr.tt-sub td:first-child{background:var(--surface);}
tr.tt-centre td{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);text-align:left;}
tr.tt-sub td{font-weight:700;color:var(--ink);border-top:1px solid var(--line-2);}
td.tt-low{color:var(--crit);font-weight:600;}
.tt-pct{font-size:11px;color:var(--muted);font-weight:400;}
.xnote{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.6;border-left:3px solid var(--line-2);padding-left:12px;}
.xnote b{color:var(--ink-2);}
footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--good-soft);color:var(--good);border:1px solid var(--good-line);border-radius:20px;padding:2px 9px;margin-top:10px;}
.dates{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
.fld .fl{font-size:11px;color:var(--muted);margin-bottom:5px;}
input[type=date],#sla,#ownfilter{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
#sla{width:78px;}
.tile.sla .n{color:var(--good);}
#ownfilter{padding:6px 10px;font-size:13px;width:180px;margin-left:auto;}
tr.off{opacity:.4;}
tr.stl-top td{border-top:0;border-bottom:2px solid var(--line-2);}
tr.stl-g{cursor:pointer;}
tr.stl-g:hover td{background:var(--surface-2);}
tr.stl-g:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
tr.stl-g td.dim::before{content:"";display:inline-block;width:6px;height:6px;margin:0 10px 2px 2px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;}
tr.stl-g.open td.dim::before{transform:rotate(45deg);}
tr.stl-c td{font-size:12.5px;}
tr.stl-c td.dim{padding-left:38px;font-weight:400;color:var(--ink-2);}
.stl-sub{color:var(--muted);font-size:11.5px;margin-left:4px;}
/* long programme names wrap inside a capped first column, so the number cells never wrap */
tr.stl-c td.dim{white-space:normal;max-width:340px;line-height:1.35;}
#drows td:not(.dim),#rows td:not(.dim){white-space:nowrap;}
td.dim.clk{cursor:pointer;}
td.dim .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none;}
tr.on td.dim .dot{background:var(--accent);}
td.unc{color:var(--crit);font-weight:600;}
input[type=date],#ownfilter{font-family:var(--sans);font-size:14px;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);}
td.pend{color:var(--crit);font-weight:600;}
.sortarrow{color:var(--accent);font-weight:700;}
th.sorted{color:var(--accent-2);}
td.owncol{white-space:nowrap;}
.muted-pct{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px;}
/* report-specific: greyed n/a cell + note */
  .na{color:var(--muted);font-style:italic;cursor:help;border-bottom:1px dotted var(--line-2);}
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 18px;}
.fstep{display:grid;grid-template-columns:158px 1fr 268px;gap:14px;align-items:center;padding:8px 0;}
.fstep+.fstep{border-top:1px dashed var(--line);}
.flabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);line-height:1.3;}
.flabel .fdesc{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px;}
.ftrack{background:var(--surface-2);border-radius:5px;overflow:hidden;height:22px;display:flex;align-items:center;}
.fval{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;}
.fval b{color:var(--ink);font-size:16px;}
.fpct{margin:0 6px;}
@media(max-width:640px){.fstep{grid-template-columns:1fr;gap:5px;} .fval{text-align:left;}}
/* --- brand tokens --- */
:root{--brand:#e01820;--brand-2:#c3141b;}
@media(prefers-color-scheme:dark){:root{--brand:#ff5257;--brand-2:#ff7378;}}
:root[data-theme="light"]{--brand:#e01820;--brand-2:#c3141b;}
:root[data-theme="dark"]{--brand:#ff5257;--brand-2:#ff7378;}
/* --- SPA shell --- */
.topnav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 20px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);border-top:3px solid var(--brand);}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;font-family:var(--sans);padding:0;}
.logoplate{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:7px;padding:4px 8px;display:inline-flex;align-items:center;box-shadow:0 1px 2px rgb(20 30 45/.06);}
.logoplate img{height:19px;display:block;}
.logoplate.lg{padding:12px 18px;border-radius:13px;}
.logoplate.lg img{height:clamp(40px,7vw,58px);}
.bname{font-weight:750;font-size:14.5px;color:var(--ink);letter-spacing:-.01em;}
.brand:hover .bname{color:var(--brand);}
.crumb{font-size:13px;color:var(--muted);} .crumb b{color:var(--ink-2);font-weight:600;}
.navspace{margin-left:auto;}
.herologo{margin-bottom:20px;}
.hero-eyebrow{color:var(--brand)!important;}
.nav-refresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;}
.nav-refresh:hover,.nav-refresh[aria-expanded="true"]{border-color:var(--muted);}
.nav-refresh .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}
.nav-refresh.late{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft);}
.nav-refresh.late .dot{background:var(--warn);}
.nav-refresh.stale{color:var(--crit);border-color:var(--crit-line);background:var(--crit-soft);}
.nav-refresh.stale .dot{background:var(--crit);}
.nav-pool{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;cursor:pointer;}
.nav-pool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);}
.nav-pool .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.nav-pool.on .dot{background:var(--accent);}

<script>
window.__DATA = {};
// ---- global: unworked holding/bot pools (e.g. "Avtar LCoffline") ----
// These accounts hold real leads but never work them (≈0 attempts, ≈0 contact).
// Leaving them in rate denominators understates counsellor performance, so every
// report excludes them by default. One switch, applied identically everywhere.
window.__EXPOOL = true;
function poolSkip(L){ return window.__EXPOOL && L[11]===1; }
// Dates: <input type="date"> requires ISO yyyy-mm-dd for .value/.min/.max (HTML spec),
// so ISO stays the internal wire format and DD Mon YYYY (15 Oct 2026) is used for every string a
// human reads. All day indices are already IST calendar days (pull.py shifts +5:30).
// The daily pull runs mid-morning IST, so the newest day present is always partial
// (day 73 held 12 leads vs ~900/day). A day is complete only if the snapshot was
// taken after that IST day ended — otherwise "latest day" reads as a collapse.
function lastFullDay(maxDay){
  const D=window.__DATA, DAY=86400000;
  if(!D || !D.generated_at) return maxDay;
  const base=new Date(D.base+"T00:00:00Z");
  const g=new Date(D.generated_at); if(isNaN(g)) return maxDay;
  const ist=new Date(g.getTime()+330*60000);                     // IST wall clock
  const genIdx=Math.round((Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate())-base.getTime())/DAY);
  return Math.max(0, Math.min(maxDay, genIdx-1));
}
// A rate or median built on a handful of leads is noise wearing the costume of a
// measurement — one owner showed 194 leads with a median computed from ONE. Below the
// threshold the value is de-emphasised and its sample size shown, rather than hidden:
// the reader still sees it, but can no longer mistake it for a reliable figure.
const LOW_N = 10;
function smallN(html, n){
  if(n==null || n>=LOW_N) return html;
  const t = n===0 ? "no measurable leads" : `computed from only ${n} measurable lead${n===1?"":"s"} — too few to read as a rate`;
  return `<span class="lown" title="${t}">${html}<span class="nsm">n=${n}</span></span>`;
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function isoToDMY(v){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||"")); return m? m[3]+" "+MON[+m[2]-1]+" "+m[1] : String(v||""); }
// stage lifecycle class from the data file ("open" | "won" | "lost" | "test")
function stageCls(i){ const a=window.__DATA.stage_class; return (a && a[i]) || "open"; }
// ---- ONE definition per metric. Every report counts these the same way, so a number
// called "Attempted" or "Connected" reconciles across pages. Each LSQ signal is under-logged
// on its own, so ANY evidence counts, and a connect implies an attempt (keeps Connect % <= 100%).
//  L[2] first call · L[5] last activity · L[6] follow-up · L[7] attempts · L[8] interacted
//  L[9] stage · L[15] first connect
// ---- shared breakdowns (Speed to Lead, Effort) ----
// Meta, Google and Internshala get their own source group; every other bucket sits under Others.
const SRC_GROUPS=["Meta","Google","Internshala","Others"];
function srcGroupOf(si){ const n=window.__DATA.sources[si]; return SRC_GROUPS.includes(n)?n:"Others"; }
// Centre = the owner's LSQ admission group (pull.py), because the lead's own centre field is ~22% filled
const CTR_LAST=new Set(["No centre","Pool accounts"]);
function centreOf(L){ const oc=window.__DATA.owner_centre; return (oc&&oc[L[4]])||"No centre"; }
function isConnected(L){ return (L[8]||0)>0 || L[15]!=null; }
function isAttempted(L){ return (L[7]||0)>0 || L[2]!=null || isConnected(L); }
function isEnrolled(L){ return stageCls(L[9])==="won"; }
function isOpen(L){ return stageCls(L[9])==="open"; }
// Overdue = a callback nobody made: open lead, follow-up day before the as-of day, and no
// activity since it fell due. Date-passed alone flagged 86% of the book, 90% of which had
// activity after the due date — a stale field, not neglect. asOf is a day index.
function isOverdue(L,asOf){
  if(!isOpen(L) || L[6]==null) return false;
  const fu=Math.floor(L[6]/1440), la=L[5]==null?null:Math.floor(L[5]/1440);
  return fu<asOf && (la==null || la<fu);
}
// SLA, scored one way everywhere: "hit" = first attempt within slaMin of the clock start;
// "miss" = later, or never attempted; "unmeas" = attempted but not timeable (no first-call
// time, no clock start, or called before the clock started, i.e. reassigned after a call),
// which leaves the denominator. Returns [verdict, minutes|null].
function slaOf(L,startMin,slaMin){
  if(!isAttempted(L)) return ["miss",null];
  if(L[2]==null || startMin==null) return ["unmeas",null];
  const m=L[2]-startMin;
  return m<0 ? ["unmeas",null] : [m<=slaMin?"hit":"miss",m];
}
// ---- report init functions (each fully scoped) ----
function init_speed(){

const DATA = window.__DATA;
// leads are positional arrays; the indices this report uses:
//  0 src · 1 created · 2 firstAttempt · 3 assign · 4 owner · 11 pool
// 12 program · 15 firstConnect (null = never connected) · 22 raw Source value · 23 program group
const BASE = new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
const PROGRAMS = DATA.programs||[], RAW = DATA.raw_sources||[], OC = DATA.owner_centre||[], PG = DATA.prog_groups||[];
let ANCHOR="created", DIM="source"; const SEL=new Set(), CSEL=new Set(), OPEN=new Set();
const anchorField={created:1,firstcall:2,assign:3};
const clockStart ={created:1,firstcall:1,assign:3};
// The three paid/partner channels that carry most volume get their own group; every other
// bucket sits under Others. Expanding a group shows the raw LSQ Source values behind it.
const GROUPS=SRC_GROUPS, grpOf=srcGroupOf, LAST=CTR_LAST, ctrOf=centreOf;
const ctrSort=(a,b)=>(LAST.has(a)-LAST.has(b))||a.localeCompare(b);
// q = the question the analysis answers (always visible under the filters); the long text sits behind "How it's measured"
const QUESTION={created:"how fast does a brand-new lead hear from us?",firstcall:"of everything we dialled, how long had those leads been waiting?",assign:"once a lead lands on a counsellor's desk, how fast do they call?"};
const EXPLAIN={
  created:"<b>Created On analysis.</b> Cohort = every lead <b>created</b> in your date range. The clock runs creation → first attempt, so it captures the lead's full end-to-end wait — including time spent in the central pool before a counsellor picks it up.",
  firstcall:"<b>First Call analysis.</b> Cohort = every lead whose <b>first attempt</b> lands in your date range, regardless of when it was created. Everyone here was dialled, so there are no unattempted leads. The clock still runs from creation, so aged leads and reactivations lift the medians.",
  assign:"<b>Assignment analysis.</b> Cohort = every lead <b>assigned</b> to its current owner in your date range. The clock starts at assignment, not creation — stripping out central-pool lag to isolate the counsellor's own response. This is the fair SLA measure."
};
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ if(!isFinite(i)) return ""; return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }
function dmy(i){ return isFinite(i) ? isoToDMY(idxToStr(i)) : "—"; }   // display only; inputs stay ISO
function fm(m){ if(m>=1440)return (m/1440).toFixed(1)+"d"; if(m>=60)return (m/60).toFixed(1)+"h"; return Math.round(m)+"m"; }
function cc(c){return c>=50?"g":(c>=25?"a":"r");}
function nf(n){ return n.toLocaleString("en-IN"); }
function med(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function dimTitle(){ return {source:"Source",owner:"Centre / lead owner",program:PG.length?"Program group / program":"Program"}[DIM]; }
function dimNoun(){ return {source:"source",owner:"owner",program:"program"}[DIM]; }
// SLA has two honest denominators. `sla` = of the leads we actually attempted;
// `slaAll` = of every lead in the cohort (unattempted leads are SLA misses too).
// The headline uses slaAll — an unattempted lead is not a neutral outcome.
function stt(a,sla,total){ if(!a.length) return {n:0,hits:0,sla:0,slaAll:0};
  const hits=a.filter(x=>x<=sla).length;
  return {n:a.length,hits,med:med(a),sla:100*hits/a.length,
          slaAll:total?100*hits/total:0}; }
function blank(){ return {total:0,contacted:0,speeds:[],unmeas:0,connected:0,cspeeds:[],cunmeas:0}; }
// A contacted lead whose call predates the anchor (reassignment) is neither a hit
// nor a miss — it is unmeasurable, and is removed from the SLA denominator.
// The connect clock obeys the same rules: null firstConnect = never connected
// (never a fast connect, never in the median); a negative clock is unmeasurable.
// attempted / connected use the shared definitions; the clocks need the timestamps, so an
// attempted lead with no first-call time (or a connected one with no connect time) is unmeasurable
function add(rec,L,st){ rec.total++;
  if(isConnected(L)){ rec.connected++;
    if(L[15]==null || st==null){ rec.cunmeas++; }
    else { const c=L[15]-st; if(c>=0) rec.cspeeds.push(c); else rec.cunmeas++; } }
  if(!isAttempted(L)) return;               // unattempted: counts as an SLA miss
  rec.contacted++;
  if(L[2]==null || st==null){ rec.unmeas++; return; }
  const m=L[2]-st; if(m>=0) rec.speeds.push(m); else rec.unmeas++; }
const bump=(o,k,L,st)=>add(o[k]=o[k]||blank(),L,st);
// single pass over the selected sources and centres: the aggregate, plus the rows of the
// current breakdown (source: group -> raw value; owner: centre -> owner)
function compute(){
  const af=anchorField[ANCHOR], cf=clockStart[ANCHOR];
  const a=dateToIdx(document.getElementById("d0").value), b=dateToIdx(document.getElementById("d1").value);
  const lo=Math.min(a,b), hi=Math.max(a,b);
  const top={}, sub={}, agg=blank();
  for(const L of DATA.leads){
    if(poolSkip(L) || !SEL.has(L[0])) continue;
    const anc=L[af]; if(anc==null) continue;
    const di=dayIdx(anc); if(di<lo||di>hi) continue;
    const ctr=ctrOf(L); if(CSEL.size && !CSEL.has(ctr)) continue;
    const st=L[cf];
    add(agg,L,st);
    if(DIM==="source"){ const g=grpOf(L[0]); bump(top,g,L,st); bump(sub[g]=sub[g]||{},L[0]+":"+(L[22]??""),L,st); }
    else if(DIM==="owner"){ bump(top,ctr,L,st); bump(sub[ctr]=sub[ctr]||{},L[4],L,st); }
    else if(PG.length){ const g=PG[L[23]]??"Other"; bump(top,g,L,st); bump(sub[g]=sub[g]||{},L[12],L,st); }
    else bump(top,L[12],L,st);
  }
  return {top,sub,agg,lo,hi};
}
function render(){
  const sla=Math.max(1,parseFloat(document.getElementById("sla").value)||120);
  const {top,sub,agg,lo,hi}=compute();
  const clkA={created:"first attempt − created",firstcall:"first attempt − created",assign:"first attempt − assignment"}[ANCHOR];
  const clkC={created:"first connect − created",firstcall:"first connect − created",assign:"first connect − assignment"}[ANCHOR];
  const coh={created:"created",firstcall:"first-called",assign:"assigned"}[ANCHOR];
  const aName=document.querySelector('#anchor option[value="'+ANCHOR+'"]').textContent;
  document.getElementById("ctx-q").innerHTML=`<span><b>${aName}:</b> <span class="q">${QUESTION[ANCHOR]}</span></span>`;
  document.getElementById("ctx-body").innerHTML=`<p>${EXPLAIN[ANCHOR]}</p>`
    +`<p><b>Cohort:</b> leads ${coh} in the date range · <b>Attempt clock:</b> <code>${clkA}</code> · <b>Connect clock:</b> <code>${clkC}</code></p>`
    +`<p><b>Dates:</b> data covers ${isoToDMY(DATA.base)} → ${dmy(maxIdx)}; dates outside that are disabled. The default is the latest <b>complete</b> day, because today is still being collected.</p>`

// Sources dropdown <-> SEL. The dropdown shows "nothing ticked" as All sources, so a full SEL is shown unticked.

const lastFull=lastFullDay(maxIdx);

}
function init_ageing(){

const DATA = window.__DATA;
// lead columns used: 0 src · 1 created · 4 owner · 5 last activity · 6 follow-up · 7 attempts · 9 stage · 22 raw Source
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000, RAW=DATA.raw_sources||[], OC=DATA.owner_centre||[];
const $=id=>document.getElementById(id);

function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ if(!isFinite(i)) return ""; return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }

const LASTFULL=lastFullDay(maxDay);

const OPEN_STG=STAGES.filter(i=>stageCls(i)==="open");

function mk(){ return {b:BUCKETS.map(()=>({all:0,pend:0,noact:0,over:0})), all:0,pend:0,noact:0,over:0,att:0}; }

function compute(){
  const asOf=dateToIdx($("asof").value);

    const c=ctrOfUser(x[ix("user")]); if(CSEL.size && !CSEL.has(c)) continue;
    addC(agg,x);
    const g=own?c:(SRC_GROUPS.includes(sname)?sname:"Others"), k=own?x[ix("user")]:sname+""+RN[x[ix("raw")]];
    addC(top[g]=top[g]||blankC(),x); addC((sub[g]=sub[g]||{})[k]=sub[g][k]||blankC(),x);
  }
  const span=inDays.length?(inDays.length===1?isoToDMY(inDays[0]):isoToDMY(inDays[0])+" → "+isoToDMY(inDays[inDays.length-1])):"none";
  const tile=(n,l,cls)=>`<div class="tile ${cls||""}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const pc=(a,b)=>b?Math.round(100*a/b)+"%":"—";
  $("ef-tiles").innerHTML=tile(nf(agg.dials),`Calls made<br><span style="opacity:.75">${span}</span>`,"hi")
    +tile(nf(agg.leads),"Leads dialled (per day)")
    +tile(av(agg.leads?agg.dials/agg.leads:null),"Calls per lead")
    +tile(pc(agg.conn,agg.leads),`Connected<br><span style="opacity:.75">${nf(agg.conn)} leads answered</span>`,"good")
    +tile(pc(agg.leads-agg.nw,agg.leads),`Older leads<br><span style="opacity:.75">${nf(agg.leads-agg.nw)} not created that day</span>`)
    +tile(nf(agg.first),"First-ever calls");
  $("ef-thead").innerHTML=`<tr class="ef-band"><th></th><th colspan="3" class="ef-g ef-s">Calls</th><th colspan="2" class="ef-g ef-s">Connects</th><th colspan="4" class="ef-g ef-s">Which leads</th></tr>`
    +`<tr><th>${own?"Centre / caller":"Source"}</th><th class="ef-s">Calls</th><th>Leads dialled</th><th>Per lead</th>`
    +`<th class="ef-s">Connected</th><th>%</th><th class="ef-s">New that day</th><th>Older</th><th>Older %</th><th>First-ever call</th></tr>`;
  const row=(name,r,cls,extra)=>{ const tot=(cls||"").includes("totrow"), cp=r.leads?100*r.conn/r.leads:null;
    return `<tr class="${cls||""}" ${extra||""}><td class="dim">${name}</td><td class="ef-s">${nf(r.dials)}</td><td>${nf(r.leads)}</td><td>${av(r.leads?r.dials/r.leads:null)}</td>`
      +`<td class="ef-s">${nf(r.conn)}</td><td>${cp==null?"—":tot?cp.toFixed(1)+"%":`<span class="cov ${cc(cp)}">${cp.toFixed(1)}%</span>`}</td>`
      +`<td class="ef-s">${nf(r.nw)}</td><td>${nf(r.leads-r.nw)}</td><td>${pc(r.leads-r.nw,r.leads)}</td><td>${nf(r.first)}</td></tr>`; };
  const {html,shown,ng}=groupRows(top,sub,agg,row,own,q,r=>r.dials,
    k=>{ const [b,raw]=k.split(""); return [raw==="—"?"(blank)":raw,b]; },
    u=>(TT.agents[u]||{}).name||"Unknown caller", 10);
  $("ef-rows").innerHTML=html; wireGroups(q);
  $("ef-trunc").textContent=(own?(q?`${shown} caller${shown!==1?"s":""} matching “${q}”, in ${ng} centre${ng!==1?"s":""}.`:`${ng} centres, ranked by calls. Click a centre to see its callers.`):"Click a group to see the raw LSQ Source values behind it.")
    +` Call log covers ${isoToDMY(days[0])} → ${isoToDMY(days[days.length-1])}; dates outside it have no calls here.`;
  const DEFS=[
    ["Calling activity",`every <b>outbound call</b> (Ameyo, activity 22) made ${span}, on any lead — including leads created long before. Counsellor = the person who <b>made</b> the call, and their centre; not the lead's owner.`],
    ["Calls · Leads dialled","calls made, and unique leads dialled <b>per day</b>: a lead called on three days counts three times over a multi-day range."],

    ["New that day · Older","leads created on the day they were called, and every other lead dialled — the work on older leads that lead-level dates can't see."],

    ["Source groups","the lead's source, grouped as on the other reports; expanding a group lists the raw LSQ Source values."],
    ["Window",`the call log keeps the last ${days.length} days (${isoToDMY(days[0])} → ${isoToDMY(days[days.length-1])}), refreshed nightly with Talk Time.`],
  ];
  $("ef-foot").innerHTML=`<summary>How this is measured<span>Definitions for every column · call log ${isoToDMY(days[0])} to ${isoToDMY(days[days.length-1])}</span></summary>`
    +DEFS.map(d=>`<div><b>${d[0]}</b> = ${d[1]}</div>`).join("");
}

function init_funnel(){

const DATA = window.__DATA;
// lead columns used: 0 src · 1 created · 4 owner · 7 attempts · 9 stage · 11 pool · 12 programme · 16 counselled
//                    17 amount paid · 22 raw Source · 23 programme group
const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000, RAW=DATA.raw_sources||[], OC=DATA.owner_centre||[];
const PROGS=Array.isArray(DATA.programs)?DATA.programs:[], FPG=DATA.prog_groups||[];
const $=id=>document.getElementById(id);
function dayIdx(min){ return min==null?null:Math.floor(min/1440); }
function dateToIdx(v){ return Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS); }
function idxToStr(i){ if(!isFinite(i)) return ""; return new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10); }
function dmy(i){ return isFinite(i) ? isoToDMY(idxToStr(i)) : "—"; }   // display only; inputs stay ISO
const nf=n=>n.toLocaleString("en-IN");
function cc(c){return c>=50?"g":(c>=25?"a":"r");}
function ccLeak(c){return c<=2?"g":(c<=10?"a":"r");}          // leakage: small = good
function relCls(v,avg){ if(!avg) return "a"; return v>=avg*1.2?"g":(v<=avg*0.8?"r":"a"); }
function heat(v,max){ if(!v||!max) return ""; const pct=Math.min(52,Math.round(52*v/max)); return `background:color-mix(in srgb, var(--accent) ${pct}%, transparent)`; }
function pctStr(n,d){ return d? (100*n/d).toFixed(1)+"%" : "0%"; }
function pctNum(n,d){ return d? 100*n/d : 0; }
const maxDay=(()=>{ let m=0; for(const L of DATA.leads){ const d=dayIdx(L[1]); if(d!=null&&d>m)m=d; } return m; })();
let DIM="source", BREAK="overall"; const SEL=new Set(), CSEL=new Set(), OPEN_C=new Set(), OPEN_D=new Set();
const pname=k=>k==null||k<0?"(no programme)":(PROGS[k]??"(unknown)");
const pgroup=L=>FPG.length?(FPG[L[23]]??"Other"):"All programmes";
const stName=i=>stageCls(i)==="won"?`<span style="color:var(--good)">${DATA.stages[i]}</span>`:DATA.stages[i];
const muted=x=>` <span class="stl-sub">${x}</span>`;
const srcRaw=k=>{ const [bi,ri]=k.split(":"), bn=DATA.sources[+bi]; return [ri===""?bn:RAW[+ri]==="—"?"(blank)":RAW[+ri],bn]; };

// ---- one pass: as-reported (f) and strict-path (n) counts, the C rows and the D stage tables ----
// f = each step evaluated on its own LSQ field · n = cumulative AND down the funnel order, so each
// step really is a subset of the one above; f - n = leads that skipped an earlier step.
function compute(){
  const a=dateToIdx($("dstart").value), b=dateToIdx($("dend").value), lo=Math.min(a,b), hi=Math.max(a,b);
  const f={created:0,attempted:0,connected:0,counselled:0,enrolled:0,enrCns:0};
  const n={attempted:0,connected:0,counselled:0,enrolled:0};
  const miss={enrNoAttempt:0,enrNoConnect:0,enrNoCouns:0,cnsNoConnect:0};
  const blank=()=>({leads:0,att:0,con:0,cns:0,enr:0,enrCns:0,attSum:0,paid:0,pool:0});
  const cTop={}, cSub={}, stage=DATA.stages.map(()=>0), dCol={}, dTop={}, dSub={};
  for(const L of DATA.leads){
    const d=dayIdx(L[1]); if(d==null||d<0||d<lo||d>hi) continue;
    if(!SEL.has(L[0])) continue;
    const ctr=centreOf(L); if(CSEL.size && !CSEL.has(ctr)) continue;
    // C rows: group -> member (source group -> raw Source · centre -> counsellor · programme group -> programme)
    const g = DIM==="source"?srcGroupOf(L[0]) : DIM==="owner"?ctr : pgroup(L);
    const k = DIM==="source"?L[0]+":"+(L[22]??"") : DIM==="owner"?L[4] : (L[12]??-1);
    // a source can look strong purely because most of it is parked in the pool, so the pooled share is counted first
    if(L[11]===1){ (cTop[g]=cTop[g]||blank()).pool++; const s=cSub[g]=cSub[g]||{}; (s[k]=s[k]||blank()).pool++; }
    if(poolSkip(L)) continue;
    const at=isAttempted(L), cn=isConnected(L), cs=L[16]===1, en=isEnrolled(L);
    f.created++; if(at) f.attempted++; if(cn) f.connected++; if(cs) f.counselled++; if(en) f.enrolled++;
    // C2P must divide a SUBSET of the counselled base: 60% of enrolments are never flagged counselled
    if(en && cs) f.enrCns++;
    if(at){ n.attempted++; if(cn){ n.connected++; if(cs){ n.counselled++; if(en) n.enrolled++; } } }
    if(en){ if(!at) miss.enrNoAttempt++; if(!cn) miss.enrNoConnect++; if(!cs) miss.enrNoCouns++; }
    if(cs && !cn) miss.cnsNoConnect++;
    const upd=r=>{ r.leads++; r.attSum+=(L[7]||0); if((L[17]||0)>0) r.paid++; if(at)r.att++; if(cn)r.con++; if(cs)r.cns++; if(en)r.enr++; if(en&&cs)r.enrCns++; };
    upd(cTop[g]=cTop[g]||blank()); const s=cSub[g]=cSub[g]||{}; upd(s[k]=s[k]||blank());
    // D: stage counts, plus the matrix for the chosen view
    const st=L[9]; stage[st]++;
    if(BREAK==="source"||BREAK==="program"){ const col=BREAK==="source"?srcGroupOf(L[0]):pgroup(L); const r=dCol[st]=dCol[st]||{}; r[col]=(r[col]||0)+1; }
    if(BREAK==="owner"){ const t=dTop[ctr]=dTop[ctr]||{}; t[st]=(t[st]||0)+1; const u=(dSub[ctr]=dSub[ctr]||{})[L[4]]=(dSub[ctr]||{})[L[4]]||{}; u[st]=(u[st]||0)+1; }
  }
  return {lo,hi,f,n,miss,cTop,cSub,stage,dCol,dTop,dSub};
}

// ---- A · funnel bars ----
function renderFunnel(f,n){
  const base=f.created||1;
  const steps=[
    {label:"Lead created",   val:f.created,    nest:f.created},
    {label:"Attempted",      val:f.attempted,  nest:n.attempted},
    {label:"Connected",      val:f.connected,  nest:n.connected},
    {label:"Counselled",     val:f.counselled, nest:n.counselled},
    {label:"Enrolled",       val:f.enrolled,   nest:n.enrolled}];
  const neutral='style="background:var(--surface-2);color:var(--ink-2)"';
  $("funnel").innerHTML=steps.map((s,i)=>{
    const solid=100*s.nest/base, extra=100*Math.max(0,s.val-s.nest)/base;
    let badges="";
    // the enrolled step's own conversion is C2P; a raw enrolled ÷ counselled would inflate it ~3x
    if(i>0 && i<4){ const prev=steps[i-1].val, conv=prev?Math.round(100*s.val/prev):0; badges+=` <span class="cov ${cc(conv)}">&rarr; ${conv}% step</span>`; }
    if(i===3) badges+=` <span class="cov" ${neutral}>L2C ${pctStr(f.counselled,f.created)}</span>`;
    if(i===4) badges+=` <span class="cov" ${neutral}>C2P ${pctStr(f.enrCns,f.counselled)}</span> <span class="cov" ${neutral}>L2P ${pctStr(f.enrolled,f.created)}</span>`;
    const skip=s.val-s.nest, skipLine=i>0?(skip>0?`<span class="fpct">${nf(skip)} skipped an earlier step</span>`:`<span class="fpct">all on the full path</span>`):"";
    return `<div class="fstep"><div class="flabel">${s.label}</div>
      <div class="ftrack"><span class="bar" style="width:${solid.toFixed(1)}%;height:22px;border-radius:${extra>0?"5px 0 0 5px":"5px"}"></span><span style="display:block;height:22px;border-radius:${solid>0?"0 5px 5px 0":"5px"};width:${extra.toFixed(1)}%;background:color-mix(in srgb, var(--accent) 26%, transparent)"></span></div>
      <div class="fval"><b>${nf(s.val)}</b><span class="fpct">${(100*s.val/base).toFixed(1)}% of leads</span>${badges}<br>${skipLine}</div></div>`;
  }).join("");
}

// ---- B · path integrity ----
function renderLeak(f,n){
  const rows=[["Attempted","attempts &gt; 0, first call or connect",f.attempted,n.attempted],["Connected","interacted &gt; 0 or first connect",f.connected,n.connected],
              ["Counselled","counselling-done flag",f.counselled,n.counselled],["Enrolled","lead stage class “won”",f.enrolled,n.enrolled]];
  $("leakhead").innerHTML=`<tr><th>Step</th><th>LSQ field behind it</th><th>As reported</th><th class="grp">On the full path</th><th>Skipped an earlier step</th><th>% off-path</th></tr>`;
  $("leakrows").innerHTML=rows.map(([nm,fld,v,ne])=>{ const skip=Math.max(0,v-ne), sp=pctNum(skip,v);
    return `<tr><td class="dim">${nm}</td><td class="fpct">${fld}</td><td>${nf(v)}</td><td>${nf(ne)}</td><td>${nf(skip)}</td><td><span class="cov ${ccLeak(sp)}">${v?sp.toFixed(1):"0.0"}%</span></td></tr>`; }).join("");
}

// ---- C · funnel by source / centre & counsellor / programme ----
function renderDim(cTop,cSub,f){
  const isSrc=DIM==="source", cols=isSrc?13:12, q=$("rowfilter2").value.trim().toLowerCase();
  const avgL2C=pctNum(f.counselled,f.created), avgL2P=pctNum(f.enrolled,f.created), avgC2P=pctNum(f.enrCns,f.counselled);
  const poolCell=r=>{ const base=r.leads+(window.__EXPOOL?r.pool:0), p=base?100*r.pool/base:0;
    return p>0.05?`<span class="cov ${p>=50?"r":p>=20?"a":"g"}" title="${nf(r.pool)} of these leads sit in the unworked pool">${p.toFixed(0)}%</span>`:'<span class="fpct">—</span>'; };
  const title={source:"Source",owner:"Centre / counsellor",program:"Programme group / programme"}[DIM];
  $("dhead").innerHTML=`<tr class="ef-band"><th></th><th colspan="${isSrc?2:1}"></th><th colspan="4" class="ef-g ef-s">Funnel</th><th colspan="2" class="ef-g ef-s">Effort &amp; revenue</th><th colspan="3" class="ef-g ef-s">Conversion</th></tr>`
    +`<tr><th>${title}</th><th>Leads</th>${isSrc?"<th>% in pool</th>":""}<th class="ef-s">Attempted</th><th>Connected</th><th>Counselled</th><th>Enrolled</th>`
    +`<th class="ef-s">Avg att.</th><th>Paying</th><th class="ef-s">L2C</th><th>C2P</th><th>L2P</th></tr>`;
  const row=(label,r,cls,extra)=>{
    const tot=(cls||"").includes("totrow"), l2c=pctNum(r.cns,r.leads), c2p=pctNum(r.enrCns,r.cns), l2p=pctNum(r.enr,r.leads);
    const badge=(v,avg,ok=true)=>!ok?'<span class="fpct">—</span>':tot?v.toFixed(1)+"%":`<span class="cov ${relCls(v,avg)}">${v.toFixed(1)}%</span>`;
    const cp=(v)=>` <span class="fpct">${pctStr(v,r.leads)}</span>`;
    return `<tr class="${cls||""}" ${extra||""}><td class="dim">${label}</td><td>${nf(r.leads)}</td>${isSrc?`<td>${poolCell(r)}</td>`:""}`
      +`<td class="ef-s">${nf(r.att)}${cp(r.att)}</td><td>${nf(r.con)}${cp(r.con)}</td><td>${nf(r.cns)}</td><td>${nf(r.enr)}</td>`
      +`<td class="ef-s">${r.leads?(r.attSum/r.leads).toFixed(2):"—"}</td><td>${r.paid?nf(r.paid)+cp(r.paid):'<span class="fpct">—</span>'}</td>`
      +`<td class="ef-s">${badge(l2c,avgL2C)}</td><td>${badge(c2p,avgC2P,r.cns>0)}</td><td>${badge(l2p,avgL2P)}</td></tr>`;
  };
  const sumRows=rs=>rs.reduce((a,r)=>{ for(const x in a) a[x]+=r[x]||0; return a; },{leads:0,att:0,con:0,cns:0,enr:0,enrCns:0,attSum:0,paid:0,pool:0});
  const order = DIM==="source" ? SRC_GROUPS.filter(g=>cTop[g])
    : Object.keys(cTop).sort((a,b)=>(DIM==="owner"?(CTR_LAST.has(a)-CTR_LAST.has(b)):((a==="Other")-(b==="Other")))||cTop[b].leads-cTop[a].leads);
  const nameOf=(g,k)=>DIM==="owner"?(DATA.owners[k]??"—"):DIM==="program"?pname(+k):srcRaw(k)[0];
  const parts=[]; let html="", shown=0, ng=0;
  order.forEach(g=>{
    if(!cTop[g].leads) return;                                        // pool-only rows carry no funnel
    let ks=Object.keys(cSub[g]).filter(k=>cSub[g][k].leads>0).sort((x,y)=>cSub[g][y].leads-cSub[g][x].leads);
    if(q) ks=ks.filter(k=>String(nameOf(g,k)).toLowerCase().includes(q));
    if(!ks.length) return; ng++; shown+=ks.length;
    const open=!!q||OPEN_C.has(g), nm=Object.keys(cSub[g]).length, unit=DIM==="owner"?"counsellor":DIM==="program"?"programme":"source";
    html+=row(g+(DIM==="source"?"":muted(nm+" "+unit+(nm>1?"s":""))),cTop[g],"stl-g"+(open?" open":""),`data-g="${g}" tabindex="0" aria-expanded="${open}"`);
    if(q) ks.forEach(k=>parts.push(cSub[g][k])); else parts.push(cTop[g]);
    if(open) ks.forEach(k=>{ const [raw,bn]=DIM==="source"?srcRaw(k):[nameOf(g,k),null];
      html+=row(raw+(g==="Others"&&bn&&raw!==bn?muted(bn):""),cSub[g][k],"stl-c"); });
  });
  html=row(q?`Total (${shown} matching)`:"Total",sumRows(parts),"totrow stl-top")+html;
  if(!shown) html+=`<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:16px">No rows match.</td></tr>`;
  $("drows").innerHTML=html;
  $("drows").querySelectorAll("tr.stl-g").forEach(tr=>{ const tg=()=>{ if(q) return; const g=tr.dataset.g; OPEN_C.has(g)?OPEN_C.delete(g):OPEN_C.add(g); render(); };
    tr.onclick=tg; tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tg(); } }; });
  const unit={source:"source group",owner:"centre",program:"programme group"}[DIM];
  $("trunc2").textContent = q ? `${shown} row${shown!==1?"s":""} matching “${q}”, in ${ng} ${unit}${ng!==1?"s":""}.` : `${ng} ${unit}s. Click one to expand it. Conversion badges are shaded relative to the overall rate.`;
  $("rowfilter2").placeholder={source:"Filter source…",owner:"Filter counsellor…",program:"Filter programme…"}[DIM];
}

// ---- D · lead stage ----
function renderStage(stage,dCol,dTop,dSub){
  const total=stage.reduce((a,b)=>a+b,0), st=DATA.stages.map((s,i)=>i).filter(i=>stage[i]>0).sort((a,b)=>stage[b]-stage[a]);
  const own=BREAK==="owner", q=own?$("rowfilter").value.trim().toLowerCase():"";
  $("rowfilter").style.display=own?"":"none";
  const thead=$("thead"), body=$("rows");
  const none=c=>`<tr><td colspan="${c}" style="text-align:center;color:var(--muted);padding:16px">No leads in scope.</td></tr>`;
  if(BREAK==="overall"){
    thead.innerHTML=`<tr><th>Lead stage</th><th>Lifecycle</th><th>Leads</th><th>% of leads</th></tr>`;
    const CL={open:"Open",lost:"Closed",won:"Enrolled"};
    body.innerHTML=`<tr class="totrow stl-top"><td>Total</td><td></td><td>${nf(total)}</td><td>100%</td></tr>`
      +st.map(i=>`<tr><td class="dim">${stName(i)}</td><td class="fpct" style="text-align:left">${CL[stageCls(i)]||stageCls(i)}</td><td>${nf(stage[i])}</td><td>${pctStr(stage[i],total)}</td></tr>`).join("")
      +(st.length?"":none(4));
    $("trunc").textContent="Enrolled stage in green.";
    return;
  }
  if(BREAK==="source"||BREAK==="program"){
    // stages (rows) × source groups or programme groups (columns)
    const cols=BREAK==="source"?SRC_GROUPS.filter(g=>st.some(i=>(dCol[i]||{})[g])):FPG.filter(g=>st.some(i=>(dCol[i]||{})[g]));
    let cmax=1; st.forEach(i=>cols.forEach(c=>{ const v=(dCol[i]||{})[c]||0; if(v>cmax)cmax=v; }));
    const colTot=cols.map(c=>st.reduce((a,i)=>a+((dCol[i]||{})[c]||0),0));
    thead.innerHTML=`<tr class="ef-band"><th></th><th colspan="${cols.length}" class="ef-g ef-s">${BREAK==="source"?"Source group":"Programme group"}</th><th colspan="2" class="ef-g ef-s">All</th></tr>`
      +`<tr><th>Lead stage</th>${cols.map((c,j)=>`<th${j?"":' class="ef-s"'}>${c}</th>`).join("")}<th class="ef-s">Leads</th><th>% of leads</th></tr>`;
    body.innerHTML=`<tr class="totrow stl-top"><td>Total</td>${colTot.map((v,j)=>`<td${j?"":' class="ef-s"'}>${nf(v)}</td>`).join("")}<td class="ef-s">${nf(total)}</td><td>100%</td></tr>`
      +st.map(i=>`<tr><td class="dim">${stName(i)}</td>${cols.map((c,j)=>{ const v=(dCol[i]||{})[c]||0; return `<td${j?"":' class="ef-s"'}><span class="cell" style="${heat(v,cmax)}">${v?nf(v):""}</span></td>`; }).join("")}<td class="ef-s tot">${nf(stage[i])}</td><td>${pctStr(stage[i],total)}</td></tr>`).join("")
      +(st.length?"":none(cols.length+3));
    $("trunc").textContent="Cells shaded by lead count (deeper = more); enrolled stage in green.";
    return;
  }
  // centres (rows, expanding to counsellors) × stages (columns)
  let cmax=1; Object.values(dTop).forEach(r=>st.forEach(i=>{ if((r[i]||0)>cmax) cmax=r[i]; }));
  const rowTot=r=>st.reduce((a,i)=>a+(r[i]||0),0);
  thead.innerHTML=`<tr class="ef-band"><th></th><th colspan="${st.length}" class="ef-g ef-s">Lead stage</th><th colspan="2" class="ef-g ef-s">All</th></tr>`
    +`<tr><th>Centre / counsellor</th>${st.map((i,j)=>`<th${j?"":' class="ef-s"'}>${DATA.stages[i].replace(/^B2C\s*:\s*/,"")}</th>`).join("")}<th class="ef-s">Leads</th><th>% of leads</th></tr>`;
  const line=(label,r,cls,extra)=>`<tr class="${cls||""}" ${extra||""}><td class="dim">${label}</td>${st.map((i,j)=>{ const v=r[i]||0, tot=(cls||"").includes("totrow"); return `<td${j?"":' class="ef-s"'}>${tot?nf(v):`<span class="cell" style="${heat(v,cmax)}">${v?nf(v):""}</span>`}</td>`; }).join("")}<td class="ef-s tot">${nf(rowTot(r))}</td><td>${pctStr(rowTot(r),total)}</td></tr>`;
  const sum={}; let html="", shown=0, ng=0;
  Object.keys(dTop).sort((a,b)=>(CTR_LAST.has(a)-CTR_LAST.has(b))||rowTot(dTop[b])-rowTot(dTop[a])).forEach(c=>{
    let ks=Object.keys(dSub[c]).sort((x,y)=>rowTot(dSub[c][y])-rowTot(dSub[c][x]));
    if(q) ks=ks.filter(k=>String(DATA.owners[k]??"").toLowerCase().includes(q));
    if(!ks.length) return; ng++; shown+=ks.length;
    (q?ks.map(k=>dSub[c][k]):[dTop[c]]).forEach(r=>st.forEach(i=>sum[i]=(sum[i]||0)+(r[i]||0)));
    const open=!!q||OPEN_D.has(c), nm=Object.keys(dSub[c]).length;
    html+=line(c+muted(nm+" counsellor"+(nm>1?"s":"")),dTop[c],"stl-g"+(open?" open":""),`data-g="${c}" tabindex="0" aria-expanded="${open}"`);
    if(open) ks.forEach(k=>html+=line(DATA.owners[k]??"—",dSub[c][k],"stl-c"));
  });
  body.innerHTML=line(q?`Total (${shown} matching)`:"Total",sum,"totrow stl-top")+html+(shown?"":none(st.length+3));
  body.querySelectorAll("tr.stl-g").forEach(tr=>{ const tg=()=>{ if(q) return; const g=tr.dataset.g; OPEN_D.has(g)?OPEN_D.delete(g):OPEN_D.add(g); render(); };
    tr.onclick=tg; tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tg(); } }; });
  $("trunc").textContent=q?`${shown} counsellor${shown!==1?"s":""} matching “${q}”.`:`${ng} centres, ranked by leads. Click a centre to see its counsellors.`;
}

function render(){
  const R=compute(), {f,n,miss}=R;
  $("fn-reset").hidden = $("dstart").value===DATA.base && $("dend").value===idxToStr(maxDay) && SEL.size===DATA.sources.length && !CSEL.size;
  // one row of tiles: each ratio sits under the count it comes from
  const tile=(v,l,sub,cls)=>`<div class="tile ${cls||""}"><div class="n">${v}</div><div class="l">${l}${sub?`<br><span style="opacity:.8">${sub}</span>`:""}</div></div>`;
  $("fn-tiles").innerHTML=tile(nf(f.created),"Leads created (selected)","","hi")

    +tile(nf(f.connected),"Connected",pctStr(f.connected,f.created)+" of leads")

  renderFunnel(f,n); renderLeak(f,n); renderDim(R.cTop,R.cSub,f); renderStage(R.stage,R.dCol,R.dTop,R.dSub);

  const DEFS=[

    ["Attempted · Connected","the dashboard-wide rules: attempted = attempts &gt; 0, a first-call time or a connect; connected = interacted &gt; 0 or a first-connect time (a proxy, not a verified conversation)."],
    ["Counselled · Enrolled","the counselling-done flag on the lead · lead stage class “won”."],

    ["B · Path integrity",`the five steps come from five separate LSQ fields, so they don't nest: a lead can be enrolled with no logged attempt. In this window ${nf(off)} of ${nf(f.enrolled)} enrolled leads (${pctStr(off,e)}) skipped a step — ${nf(miss.enrNoAttempt)} with no sign of an attempt, ${nf(miss.enrNoConnect)} never connected, ${nf(miss.enrNoCouns)} not flagged counselled; ${nf(miss.cnsNoConnect)} counselled leads have no connect logged. These are logging gaps, which is why the ratios use as-reported counts.`],
    ["C · Paying · % in pool","any amount collected (mx_Total_Amount_Paid &gt; 0, part-payments included — not the same as the Enrolled stage) · a source's leads parked in the unworked pool accounts."],
    ["C · Groups","sources: Meta, Google, Internshala, Others (expanding to raw LSQ Source values) · centres: the counsellor's LSQ admission group · programmes: the programme group, from the campaign name first, then Program of Interest."],
    ["D · Lead stage","each lead's current stage (LSQ ProspectStage) and its lifecycle class: open = still being worked, closed = finished without enrolling, enrolled."],
    ["Cross-check in LSQ","stage counts should match Manage Leads grouped by Lead Stage, on the same created dates and sources."],
  ];
  $("fn-foot").innerHTML=`<summary>How this is measured<span>Definitions for every section · data ${isoToDMY(DATA.base)} to ${dmy(maxDay)}</span></summary>`
    +DEFS.map(d=>`<div><b>${d[0]}</b> = ${d[1]}</div>`).join("");
}

function init_home(){
  const DATA=window.__DATA;
  const di=m=>m==null?null:Math.floor(m/1440);
  const maxDay=(()=>{ let m=0; for(const r of DATA.leads){ const d=di(r[1]); if(d!=null&&d>m)m=d; } return m; })();
  const LAST=lastFullDay(maxDay);                       // newest COMPLETE day
  const iso=i=>new Date(new Date(DATA.base+"T00:00:00Z").getTime()+i*86400000).toISOString().slice(0,10);
  const toIdx=v=>Math.round((new Date(v+"T00:00:00Z")-new Date(DATA.base+"T00:00:00Z"))/86400000);
  // Enrolment lags creation by weeks, so a window running up to today measures an
  // immature cohort and understates L2P. MATURITY marks where that starts to bite.
  const MATURITY=30;
  const d0El=document.getElementById("h-d0"), d1El=document.getElementById("h-d1");
  if(!d0El.value){                                       // first render: default to 30d
    d0El.value=iso(Math.max(0,LAST-29)); d1El.value=iso(LAST);
  }
  [d0El,d1El].forEach(e=>{ e.min=DATA.base; e.max=iso(LAST); });
  let lo=Math.max(0,Math.min(toIdx(d0El.value),toIdx(d1El.value)));
  let hi=Math.min(LAST,Math.max(toIdx(d0El.value),toIdx(d1El.value)));
  if(!isFinite(lo)||!isFinite(hi)){ lo=Math.max(0,LAST-29); hi=LAST; }

  // ---- mode ----------------------------------------------------------------
  // COHORT     : population = leads CREATED in the window. A real funnel — each step
  //              nests, so conversion % and L2C/C2P/L2P are meaningful.
  // OPERATIONAL: population = leads TOUCHED in the window, including backlog created
  //              earlier. Each row is a DIFFERENT population keyed on its own event
  //              date, so these are counts only — a step-% between them is not a real
  //              number and is deliberately not shown.
  const MODE=window.__HMODE||"cohort";
  const inWin=v=>{ const d=di(v); return d!=null && d>=lo && d<=hi; };
  const S=DATA.leads.filter(r=>{ if(poolSkip(r)) return false;
    const d=di(r[1]); return d!=null && d>=lo && d<=hi; });
  const n=S.length||1;
  // operational population: any tracked activity whose timestamp lands in the window
  const W=DATA.leads.filter(r=>!poolSkip(r) && (
      inWin(r[5]) || inWin(r[2]) || inWin(r[15]) || inWin(r[19]) || inWin(r[20]) || inWin(r[1])));
  const ops={
    worked   : W.length,
    created  : S.length,
    attempted: DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[2])).length,
    connected: DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[15])).length,
    counselled:DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[19])).length,
    enrolled : DATA.leads.filter(r=>!poolSkip(r)&&inWin(r[20])).length,
  };
  ops.backlog=W.filter(r=>{ const d=di(r[1]); return d==null||d<lo; }).length;

  document.getElementById("h-win").innerHTML=
    `<b>${dmyHome(lo)} \u2192 ${dmyHome(hi)}</b><br>${hi-lo+1} days \u00b7 ${S.length.toLocaleString('en-IN')} leads created`;
  // maturity warning: does the window reach into the not-yet-converted zone?
  const mEl=document.getElementById("h-mature");
  const freshDays=Math.max(0, hi-(LAST-MATURITY));
  if(MODE==="cohort" && hi>LAST-MATURITY && lo<=LAST){
    mEl.hidden=false;
    mEl.innerHTML=`<b>Immature cohort.</b> This window runs to ${dmyHome(hi)}, and leads created in the last ~${MATURITY} days have not had time to counsel or enrol. `
      +`Counselled, Enrolled, L2C, C2P, L2P and Revenue are therefore <b>understated</b> \u2014 use <b>Mature cohort</b> for a conversion rate you can quote.`;
  } else { mEl.hidden=true; }
  const num=v=>v.toLocaleString('en-IN');
  const pct=(a,b)=>b?(100*a/b).toFixed(1)+"%":"\u2014";
  const dur=m=>m==null?"\u2014":m>=1440?(m/1440).toFixed(1)+"d":m>=60?(m/60).toFixed(1)+"h":Math.round(m)+"m";
  const med=a=>{ if(!a.length) return null; const x=a.slice().sort((p,q)=>p-q); return x[Math.floor(x.length/2)]; };

  // ---- single pass ----
  const SLA=120;
  let att=0,con=0,coun=0,enr=0,enrCns=0,attSum=0,revN=0,slaHit=0,slaBase=0,unmeas=0,overdue=0;
  const b=[0,0,0,0];                       // attempt buckets 0 / 1-2 / 3-5 / 6+
  const spd=[];                            // speed from assignment (same clock as the scorecard)
  const ASOF=(()=>{ let m=0; for(const r of S){ const d=di(r[1]); if(d>m)m=d; } return lastFullDay(m); })();
  const bySrc=new Map();
  for(const r of S){
    const a=r[7]||0, isAtt=isAttempted(r), isCon=isConnected(r);
    if(isAtt) att++; if(isCon) con++;
    if(r[16]===1) coun++;
    if(isEnrolled(r)){ enr++; if(r[16]===1) enrCns++; }
    attSum+=a; b[a<=0?0:a<=2?1:a<=5?2:3]++;
    if(r[17]>0) revN++;
    if(isOverdue(r,ASOF)) overdue++;
    // speed: first call minus original assignment (same clock as the scorecard); shared SLA rule
    const [v,d]=slaOf(r,r[3],SLA);
    if(v==="unmeas") unmeas++; else { slaBase++; if(d!=null) spd.push(d); if(v==="hit") slaHit++; }
    const sk=r[0], S1=bySrc.get(sk)||{n:0,att:0,con:0,a:0,paid:0}; S1.n++; S1.att+=isAtt?1:0; S1.con+=isCon?1:0; S1.a+=a; if((r[17]||0)>0) S1.paid++; bySrc.set(sk,S1);
  }
  // window-scoped pool count, and the same split per source — a source can look like a
  // strong performer purely because most of it is parked and only the worked sliver shows
  const poolRows=DATA.leads.filter(r=>{ if(r[11]!==1) return false;
    const d=di(r[1]); return d!=null && d>=lo && d<=hi; });
  const pool=poolRows.length;
  const poolBySrc=new Map();
  for(const r of poolRows) poolBySrc.set(r[0],(poolBySrc.get(r[0])||0)+1);
  const poolPct=k=>{ const p=poolBySrc.get(k)||0, w=(bySrc.get(k)||{n:0}).n; return p+w? 100*p/(p+w) : 0; };

  // ---- KPI row (spec: Master_Dashboard r5) ----
  const kpi = MODE==="cohort"
    ? [["Leads created",num(S.length)],["Leads attempted",num(att)],["Connected",num(con)],
       ["Connect %",pct(con,att)],["Avg attempts / lead",(attSum/n).toFixed(2)],
       ["Median speed to lead",dur(med(spd))],["SLA compliance %",pct(slaHit,slaBase)],
       [(window.__EXPOOL?"Unworked pool (excluded)":"Unworked pool (included)"),num(pool)]]

      ["Longest break","the longest single idle gap (over "+T.gap_min+" minutes) between two calls, and the time it began (IST). Tells one long break, like lunch or a walk-in, apart from many short ones. Daily average shows the average length only."],

    function agg(rows){ // sum rows of one counsellor (avg mode divides by days)

// ---- Internshala funnel: a self-contained page built nightly by reports/internshala/build.py
// into data/. Embedded same-origin, so the dashboard can size the frame to its content and
// re-skin it with the dashboard's own colour tokens and theme (the builder's page carries
// its own palette from when it was a standalone artifact).
function skinFrame(f){
  const d=f.contentDocument; if(!d||!d.documentElement) return;
  const t=document.documentElement.getAttribute("data-theme");
  if(t) d.documentElement.setAttribute("data-theme",t); else d.documentElement.removeAttribute("data-theme");
  // the page is built on the dashboard's token names, so every live value passes straight through
  const cs=getComputedStyle(document.documentElement);
  const toks=["--bg","--surface","--surface-2","--ink","--ink-2","--muted","--line","--line-2","--accent","--accent-2","--accent-soft",
    "--good","--good-soft","--warn","--warn-soft","--warn-line","--crit","--crit-soft","--crit-line","--shadow","--sans","--mono"];
  let st=d.getElementById("dash-skin"); if(!st){ st=d.createElement("style"); st.id="dash-skin"; d.head.appendChild(st); }
  st.textContent=":root,:root[data-theme]{"+toks.map(k=>{ const v=cs.getPropertyValue(k).trim(); return v?k+":"+v+";":""; }).join("")+"}"
    // the frame is sized to its content, so the page itself must never scroll (that was the stray scrollbar)
    +"html,body{overflow:hidden!important;background:transparent!important;margin:0;}.wrap{max-width:none!important;padding:0 0 24px!important;}";
}
function init_internshala(){
  const f=document.getElementById("is-frame");
  const fit=()=>{ try{ const d=f.contentDocument; f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+"px"; }catch(_){} };
  f.addEventListener("load",()=>{
    const d=f.contentDocument;
    if(!d||!/Internshala/.test(d.title||"")){   // a 404 page also "loads"
       f.hidden=true; document.getElementById("is-err").hidden=false; return; }
    skinFrame(f); fit();
    // web fonts and expanding rows change the height after load
    if(d.fonts&&d.fonts.ready) d.fonts.ready.then(fit);
    const ro=new ResizeObserver(fit); ro.observe(d.documentElement); ro.observe(d.body);
    // follow the dashboard's light/dark toggle while this view is open
    const mo=new MutationObserver(()=>{ if(!f.isConnected){ mo.disconnect(); return; } skinFrame(f); });
    mo.observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  });
}

// <input type="date"> renders in the viewer's BROWSER/OS locale — a US-region Mac
// shows 08/13/2026 for 13 Aug, which is ambiguous for any day <= 12 and cannot be
// overridden from HTML or CSS. So the native field stops being what the user reads:
// it is collapsed behind a calendar button and keeps holding the ISO value (every
// report still reads el.value), while a text field in front shows and accepts
// DD Mon YYYY (15 Oct 2026). Same format for every viewer on every machine.
const CAL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>';

// accepts "15 Oct 2026", "15 october 2026" and numeric "15-10-2026" / "15/10/2026"
function parseDMY(v){
  const m=/^\s*(\d{1,2})\s*[-\/. ]\s*(\d{1,2}|[a-z]{3,9})\.?\s*[-\/. ,]\s*(\d{4})\s*$/i.exec(v||"");
  if(!m) return null;
  const d=+m[1], y=+m[3], mo=/^\d/.test(m[2])?+m[2]:MON.findIndex(x=>m[2].slice(0,3).toLowerCase()===x.toLowerCase())+1;
  if(mo<1||mo>12||d<1||d>31) return null;
  const dt=new Date(Date.UTC(y,mo-1,d));
  // rejects 31-02-2026 etc: the Date rolls over, so the parts stop matching
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return null;
  return dt.toISOString().slice(0,10);
}

function upgradeDates(){
  document.querySelectorAll('input[type=date]').forEach(nat=>{
    if(nat.closest('.dwrap')) return;                       // already upgraded
    const wrap=document.createElement('span'); wrap.className='dwrap';
    const txt=document.createElement('input');
    txt.type='text'; txt.className='dtext'; txt.placeholder='DD Mon YYYY';
    txt.setAttribute('inputmode','numeric');
    txt.setAttribute('aria-label',(nat.getAttribute('aria-label')||'date')+' (DD Mon YYYY)');
    nat.tabIndex=-1;                    // invisible: keyboard users tab to the text field
    const cal=document.createElement('span'); cal.className='dcal'; cal.innerHTML=CAL_SVG;
    cal.title='Pick from a calendar';
    nat.parentNode.insertBefore(wrap, nat);
    if(nat.dataset.label){ const k=document.createElement('span'); k.className='xsel-k dk'; k.textContent=nat.dataset.label; wrap.appendChild(k); }
    wrap.appendChild(txt); wrap.appendChild(cal); cal.appendChild(nat);

    // An empty date field produced NaN day-indexes and every formatter downstream threw
    // RangeError, freezing the report on stale numbers. The control simply refuses to
    // hold an empty value: clearing it restores the last good one.
    let lastGood=nat.value;
    nat.addEventListener('change',()=>{
      if(nat.value) { lastGood=nat.value; return; }
      nat.value=lastGood;
      txt.value=isoToDMY(lastGood);
    }, true);                                    // capture: runs before the report's own handler
    const commit=()=>{
      const iso=parseDMY(txt.value);
      if(!iso){ txt.classList.add('bad'); return; }
      let v=iso;
      if(nat.min && v<nat.min) v=nat.min;
      if(nat.max && v>nat.max) v=nat.max;
      txt.classList.remove('bad');
      if(v!==nat.value){ nat.value=v; nat.dispatchEvent(new Event('change',{bubbles:true})); }
      txt.value=isoToDMY(nat.value);
    };
    txt.addEventListener('blur', ()=>{ if(!parseDMY(txt.value)){ txt.classList.remove('bad'); txt.value=isoToDMY(nat.value); } else commit(); });
    txt.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); txt.blur(); } });
    txt.addEventListener('input', ()=>txt.classList.remove('bad'));
    // The native input now sits invisibly over the whole button with its picker
    // indicator stretched to fill it, so a click reaches the real control and the
    // browser opens and closes its own picker. The previous version drove
    // showPicker() from JS with an open/close flag; when showPicker() failed in
    // Safari the flag still flipped, so every second click was swallowed as a
    // "dismiss" and the picker never appeared at all.
    // Firefox has no ::-webkit- indicator, so fall back to showPicker() only when
    // the click did not land on the input itself.
    cal.addEventListener('click', e=>{

      try{ nat.showPicker(); }catch(_){ nat.focus(); }

    });
  });

}

function upgradeSelects(){
