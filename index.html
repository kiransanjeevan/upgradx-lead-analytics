function init_daily(){
  const DATA=window.__DATA, $=id=>document.getElementById(id), cols=DATA.cols||[];
  const BASE=new Date(DATA.base+"T00:00:00Z"), DAYMS=86400000;
  const idxToStr=i=>new Date(BASE.getTime()+i*DAYMS).toISOString().slice(0,10);
  const dateToIdx=v=>Math.round((new Date(v+"T00:00:00Z")-BASE)/DAYMS);
  const di=m=>m==null?null:Math.floor(m/1440);
  const WALK=cols.indexOf("walkins"), TBD=DATA.talk_by_day||null;
  const nf=n=>Math.round(n).toLocaleString("en-IN");

  const genIdx=Math.round((Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate())-BASE.getTime())/DAYMS);
  const genTime=`${String(ist.getUTCHours()).padStart(2,"0")}:${String(ist.getUTCMinutes()).padStart(2,"0")} IST`;
  // without today's file (data/today.json) the default is the last day in the nightly data: today if

  const DEF=ist.getUTCHours()>=12?genIdx:genIdx-1;
  const FLC_SET=new Set(FLC.map(x=>x[0])), OLC_SET=new Set(OLC.map(x=>x[0]));
  const group=c=>OLC_SET.has(c)?c:FLC_SET.has(c)?c:NOT_A_CENTRE.has(c)?null:"Rest of India";
  const blank=()=>({called:0,conn:0,cns:0,walk:0,book:0,rev:0,talk:0});
  // today's numbers come from data/today.json (scripts/pull_today.py, run before the 12pm / 3pm / 6pm
  // shares); every earlier day from the full nightly data. TD stays null if the file is missing or stale.
  let LAST=null, TD=null, TDI=null;
  const nowIst=new Date(Date.now()+330*60000), todayIdx=Math.round((Date.UTC(nowIst.getUTCFullYear(),nowIst.getUTCMonth(),nowIst.getUTCDate())-BASE.getTime())/DAYMS);
  const tdTime=t=>{ const d=new Date(t), x=new Date(d.getTime()+330*60000); return isNaN(d)?"":`${String(x.getUTCHours()).padStart(2,"0")}:${String(x.getUTCMinutes()).padStart(2,"0")} IST`; };
  function render(){ window.__RERENDER=render;
    const D=dateToIdx($("dy-day").value);
    const per={}; const get=c=>per[c]=per[c]||blank();
    const fromToday=TD && D===TDI;
    if(fromToday) for(const [c0,o] of Object.entries(TD.centres||{})){ const c=group(c0); if(!c) continue; const p=get(c);
      p.called+=o.called; p.conn+=o.conn; p.cns+=o.cns; p.walk+=o.walk; p.book+=o.book; p.rev+=o.amt; p.talk+=o.talk_s; }
    else for(const r of DATA.leads){
      const c=group(centreOf(r)); if(!c) continue;
      let att=false, con=false;
      if(r.length>32){ const a=r[31]; for(let i=0;i<a.length;i+=2) if(a[i]===D){ att=true; break; } con=r[32].includes(D); }
      const cns=di(r[19])===D||di(r[27])===D, walk=WALK>=0&&(r[WALK]||[]).some(m=>di(m)===D), book=di(r[20])===D;
      if(!(att||con||cns||walk||book)) continue;
      const o=get(c); if(att||con) o.called++; if(con) o.conn++; if(cns) o.cns++; if(walk) o.walk++; if(book){ o.book++; o.rev+=r[17]||0; }
    }
    const talkDay=fromToday?{}:TBD?(TBD[String(D)]||{}):null;
    if(talkDay && !fromToday) for(const [c0,sec] of Object.entries(talkDay)){ const c=group(c0); if(c) get(c).talk+=sec; }
    const dayLbl=isoToDMY(idxToStr(D)), today=fromToday || D===genIdx;
    // "so far to HH:MM" = the latest call or Conversation Log in the pull — what the numbers really cover
    const upTo=fromToday?(TD.activity_asof?`${TD.activity_asof} IST`:tdTime(TD.generated_at)):genTime;
    $("dy-asof").innerHTML=fromToday?`<b>So far today.</b> ${dayLbl}, activity up to <b>${upTo}</b> (pulled ${tdTime(TD.generated_at)}). Refreshed before the 12pm, 3pm and 6pm shares; the full day lands overnight.`
      :today?`<b>So far today.</b> ${dayLbl}, data pulled ${genTime}; activity after the pull isn't here, and the numbers keep rising until the overnight refresh.`
      :`<b>Full day.</b> ${dayLbl}, data pulled ${genTime} on ${isoToDMY(idxToStr(genIdx))}.`;
    const tTitle=fromToday?` (so far, to ${upTo})`:today?` (so far · data pulled ${genTime})`:"";
    const tbl=(title,list,rest)=>{

      const T=blank(); rows.forEach(([,o])=>{ for(const k in T) T[k]+=o[k]; });

      // headers and row labels mirror the manual sheet recipients know (Leads called = Attempted, Counselling = Counselled)
      const head=["Location","Leads called","Connected","Talk time","Counselling","Walk-ins","Bookings","Booking amount (₹)"];
      // row labels mirror the manual sheet recipients know; the dashboard centre name sits in each label's tooltip
      return {title,head,rows:rows.map(([l,o])=>[l,...cells(o)]),names:rows.map(r=>r[2]),total:["Total",...cells(T)]};
    };

      +t.rows.map((r,j)=>`<tr>${r.map((v,i)=>i?`<td>${v}</td>`:`<td class="dim" title="Dashboard centre: ${t.names[j]}">${v}</td>`).join("")}</tr>`).join("")
      +`<tr class="totrow">${t.total.map((v,i)=>i?`<td>${v}</td>`:`<td class="dim">${v}</td>`).join("")}</tr></tbody>`;
    $("dy-t1").textContent=A.title; $("dy-t2").textContent=B.title;

    LAST=[A,B];
    $("dy-trunc").textContent=`Rest of India = every other centre. Leads in pool accounts and with owners outside a centre group aren't in either table.`
      +(WALK<0||!talkDay?" Walk-ins and talk time arrive with the next refresh.":"");
    const DEFS=[
      ["Location","the lead owner's centre (their LSQ Admission(s) &lt;centre&gt; user group) for every lead column; talk time uses the centre of the counsellor who made the call. OLC = Bangalore HSR, Jayanagar, Marathahalli, Hyderabad Ameerpet, Madhapur, Mumbai. FLC = Pune, Pune-2, Bhubaneswar, Indore, Jaipur, and Rest of India."],
      ["Leads called","unique leads with at least one counsellor attempt that day (a dialler call, or a Conversation Log with no dialler call behind it), or an inbound call that connected — what the other reports call <b>Attempted</b>, named here as on the manual sheet."],
      ["Connected","unique leads a counsellor spoke to that day — the logged outcome says they spoke, or an answered call of 10 s or more. The same rule as every report, so it reads a little lower than a raw “answered” count."],
      ["Talk time","total minutes on answered dialler calls that day, all counsellors of the centre added up. Calls from a personal phone aren't on the dialler."],
      ["Counselling","unique leads with a counselling dated that day (first or latest counselling date) — what the other reports call <b>Counselled</b>, named here as on the manual sheet."],
      ["Walk-ins","unique leads a counsellor logged as “Offline Centre Walkin Done” in the Conversation Log that day."],
      ["Bookings","leads whose first payment is dated that day: any first payment, even a token — the Overview's Enrolled also needs stage = Enrolled, so it can read lower. An instalment on a lead that first paid earlier isn't here — LSQ only dates the first payment."],
      ["Booking amount (₹)","amount paid so far on leads whose first payment was that day (the lead's total amount paid), so it includes any later instalments on those leads."],
      ["Not included","Revenue till date and BCT collected need the finance sheet, which this dashboard can't read yet."],
      ["Refresh","today's numbers are refreshed just before the 12pm, 3pm and 6pm shares (a quick pull of today's activity only); “so far, to HH:MM” is the time of the latest call or Conversation Log in that pull. Earlier days come from the full overnight refresh."],
    ];
    $("dy-foot").innerHTML=defsHead()
      +DEFS.map(d=>`<div><b>${d[0]}</b> = ${d[1]}</div>`).join("");
  }
  // copy both tables as a real table (email, Sheets) with a tab-separated fallback (WhatsApp, plain text)
  $("dy-copy").onclick=async()=>{
    if(!LAST) return;
    const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const one=t=>`<p><b>${esc(t.title)}</b></p><table border="1" cellpadding="4" style="border-collapse:collapse;font-family:Arial;font-size:12px">`
      +`<tr>${t.head.map(h=>`<th style="background:#3c4859;color:#fff">${esc(h)}</th>`).join("")}</tr>`
      +t.rows.map(r=>`<tr>${r.map((v,i)=>`<td${i?' align="right"':""}>${esc(v)}</td>`).join("")}</tr>`).join("")
      +`<tr>${t.total.map((v,i)=>`<td${i?' align="right"':""}><b>${esc(v)}</b></td>`).join("")}</tr></table>`;
    // plain text (WhatsApp): title, then the table in a ``` block so it shows monospace, columns padded to line up
    const tsv=t=>{ const all=[t.head,...t.rows,t.total], w=t.head.map((_,i)=>Math.max(...all.map(r=>String(r[i]).length)));

  document.addEventListener('click',e=>{ const b=btnOf(e); if(!b){ hide(); return; } e.preventDefault(); if(cur!==b||box.hidden) tip(b); else if(ptr!=='mouse') hide(); });
  document.addEventListener('focusin',e=>{ if(e.target.classList&&e.target.classList.contains('tipbtn')) tip(e.target); });
  document.addEventListener('focusout',e=>{ if(e.target===cur) hide(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
  // follow the button while the page or a tile row scrolls; hide once it leaves the screen
  window.addEventListener('scroll',()=>{ if(!cur||box.hidden) return; const r=cur.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth) hide(); else tip(cur); },true);
  window.addEventListener('resize',hide);
})();
function syncDateText(){
  document.querySelectorAll('.dwrap').forEach(w=>{
    const nat=w.querySelector('input[type=date]'), txt=w.querySelector('.dtext');
    if(nat&&txt&&document.activeElement!==txt) txt.value=nat.value?isoToDMY(nat.value):'';
  });
}
document.addEventListener('change', ev=>{
  if(ev.target && ev.target.matches && ev.target.matches('input[type=date]')) setTimeout(syncDateText,0);
});
// Presets and mode buttons set input.value directly, which fires no event — so the
// visible date text went stale behind them. Re-sync after any segmented click.
document.addEventListener('click', ev=>{
  if(ev.target && ev.target.closest && ev.target.closest('.seg,.modeseg')) setTimeout(syncDateText,0);
}, true);
// ---- refresh status: last run, next run, and whether one was missed ----
// All arithmetic is on absolute instants; IST wall-clock is derived by shifting +5:30
// and reading UTC fields, so the result is identical in any viewer timezone.
const IST_MS=330*60000, DAY_MS=86400000;
function istFields(ms){ const d=new Date(ms+IST_MS);
  return {y:d.getUTCFullYear(),mo:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes()}; }
function istStamp(ms){ const f=istFields(ms), p=v=>String(v).padStart(2,"0");
  return `${p(f.d)} ${MON[f.mo]} ${f.y}, ${p(f.h)}:${p(f.mi)} IST`; }
function fmtDur(ms){
  if(ms<0) ms=0;
  const m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h`;
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}
function refreshStatus(){
  const D=window.__DATA;
  if(!D || !D.generated_at) return null;
  const gen=new Date(D.generated_at).getTime(); if(isNaN(gen)) return null;
  const now=Date.now();
  const [hh,mm]=String(D.refresh_ist||"07:00").split(":").map(Number);
  // next instant whose IST wall-clock is hh:mm and which is still ahead of now
  const f=istFields(now);
  let next=Date.UTC(f.y,f.mo,f.d,hh||0,mm||0)-IST_MS;
  if(next<=now) next+=DAY_MS;
  // Alert on DATA AGE, not on schedule adherence. GitHub's scheduled workflows are
  // best-effort: the first scheduled run on this repo started 4h31m after its cron.
  // Judging "late" against the nominal time would false-alarm every morning, so the
  // schedule is shown for information and the health check allows a cycle + drift.
  const LATE_H=30, STALE_H=54;            // 24h cycle + slack; 2 missed cycles
  const ageH=(now-gen)/3600000;
  const state = ageH>STALE_H ? "stale" : (ageH>LATE_H ? "late" : "ok");
  return {gen,now,next,state,age:now-gen,until:next-now,ageH,
          schedule:`${String(hh||0).padStart(2,"0")}:${String(mm||0).padStart(2,"0")} IST daily`};
}
function paintRefresh(){
  const el=document.getElementById("nav-refresh"); if(!el) return;
  const r=refreshStatus();
  if(!r){ el.textContent=""; el.style.display="none"; return; }
  el.style.display="";
  el.classList.remove("late","stale"); if(r.state!=="ok") el.classList.add(r.state);
  el.innerHTML='<span class="dot"></span>'
    +(r.state==="ok" ? `Updated ${fmtDur(r.age)} ago · next ~${fmtDur(r.until)}`
                     : `Refresh overdue — data ${fmtDur(r.age)} old`);
  if(POP.dataset.for==="nav-refresh" && !POP.hidden){ POP.className="navpop "+r.state; POP.innerHTML=refreshPop(); }
}
function refreshPop(){
  const r=refreshStatus(); if(!r) return "";
  return (r.state==="ok"
    ? `<h4>Data is current</h4><p>Last refreshed <b>${istStamp(r.gen)}</b>, ${fmtDur(r.age)} ago.</p>`
    : `<h4>Refresh overdue</h4><p>Last successful refresh <b>${istStamp(r.gen)}</b>, <b>${fmtDur(r.age)}</b> ago, so at least one daily run has not landed. Every report is showing that older snapshot. Check the “Daily LSQ refresh” GitHub Action.</p>`)
    +`<p>Next refresh scheduled <b>${istStamp(r.next)}</b>, about <b>${fmtDur(r.until)}</b> away (${r.schedule}; GitHub can start it late).</p>`;
}
// ---- global unworked-pool toggle ----
const PB=document.getElementById("nav-pool");
function poolStats(){
  const D=window.__DATA; if(!D || !D.leads) return {n:0,names:[]};
  let n=0; for(const L of D.leads){ if(L[11]===1 && L[1]!=null && L[1]>=0) n++; }
  return {n, names:(D.pools||[])};
}
function paintBH(){
  const b=document.getElementById("nav-bh"); if(!b) return;
  b.classList.toggle("on",window.__BH); b.setAttribute("aria-pressed",String(window.__BH));
  // phones get a short label so the top bar never pushes the page sideways
  b.innerHTML='<span class="dot"></span>'+(window.__BH?'<span class="bh-long">Business hours</span><span class="bh-short">Biz hrs</span>'
                                                    :'<span class="bh-long">Clock time 24×7</span><span class="bh-short">24×7</span>');
}
document.getElementById("nav-bh").onclick=()=>{ window.__BH=!window.__BH;
  try{ localStorage.setItem("bh",window.__BH?"on":"off"); }catch(_){}
  paintBH(); rerender(); };
paintBH();
function paintPool(){
  const {n,names}=poolStats();
  PB.classList.toggle("on", window.__EXPOOL);
  PB.innerHTML='<span class="dot"></span>'+(window.__EXPOOL?"Pool excluded":"Pool included")
    +(n?' · '+n.toLocaleString('en-IN')+' since '+isoToDMY(window.__DATA.base).slice(0,6):'');
}
// the pill always shows the state; its overlay explains it and holds the switch
function poolPop(){
  const {n,names}=poolStats(), who=names.join(", ")||"unworked pool accounts", N=n.toLocaleString('en-IN');
  return (window.__EXPOOL
    ? `<h4>${N} leads excluded</h4><p>They are held by unworked pool account${names.length>1?"s":""} (${who}), which hold leads without working them. Every rate on the dashboard describes leads a counsellor actually owns.</p>`
    : `<h4>${N} unworked-pool leads included</h4><p>Leads held by ${who} are counted, so coverage, attempts, connect % and enrolment % are diluted by leads nobody worked.</p>`)
    +`<p style="font-size:12px;color:var(--muted)">${N} is every pool lead created since ${isoToDMY(window.__DATA.base)}. Each report only adds or removes the pool leads inside its own date range, so the change you see on a page is usually smaller.</p>`
    +`<label class="fswitch"><input type="checkbox" id="pool-sw" role="switch"${window.__EXPOOL?" checked":""}><span class="trk"></span>Exclude pool accounts</label>`;
}
// one overlay, opened from whichever pill was clicked
const POP=document.getElementById("navpop");
function closePop(){ if(POP.hidden) return; const b=document.getElementById(POP.dataset.for); if(b) b.setAttribute("aria-expanded","false"); POP.hidden=true; POP.dataset.for=""; }
function openPop(btn){
  if(POP.dataset.for===btn.id){ closePop(); return; }
  closePop();
  const isPool=btn===PB, r=refreshStatus();
  POP.className="navpop "+(isPool?"pool":(r?r.state:""));
  POP.innerHTML=isPool?poolPop():refreshPop();
  POP.setAttribute("aria-label",isPool?"Unworked pool leads":"Data refresh status");
  POP.dataset.for=btn.id; POP.hidden=false; btn.setAttribute("aria-expanded","true");
  const b=btn.getBoundingClientRect();
  POP.style.top=(b.bottom+8)+"px";
  POP.style.left=Math.max(8,Math.min(b.right-POP.offsetWidth,innerWidth-8-POP.offsetWidth))+"px";
  if(isPool) wirePoolSwitch();
}
// flipping the switch re-renders the overlay text and the current report; the overlay stays open
function wirePoolSwitch(){ document.getElementById("pool-sw").onchange=e=>{ window.__EXPOOL=e.target.checked; paintPool();
  POP.innerHTML=poolPop(); wirePoolSwitch(); document.getElementById("pool-sw").focus(); rerender(); }; }
// a global switch redraws the open report in place, keeping its view, dates, filters and table switches
function rerender(){ if(window.__RERENDER) window.__RERENDER(); else show((location.hash||"").replace("#","")||"home"); }
PB.onclick=()=>openPop(PB);
document.getElementById("nav-refresh").onclick=e=>openPop(e.currentTarget);
document.addEventListener("pointerdown",e=>{ if(!POP.hidden && !POP.contains(e.target) && !e.target.closest("#"+POP.dataset.for)) closePop(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !POP.hidden){ const b=document.getElementById(POP.dataset.for); closePop(); if(b) b.focus(); } });
window.addEventListener("resize",closePop);
// ---- global theme toggle ----
const ROOT=document.documentElement, TT=document.getElementById("nav-tt");
function effTheme(){ return ROOT.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
function setTheme(t){ ROOT.dataset.theme=t; TT.textContent=t==="dark"?"☀ Light":"☾ Dark"; }
TT.onclick=()=>setTheme(effTheme()==="dark"?"light":"dark"); setTheme("light");
// ---- route ----
buildSide();   // before the data loads, so the menu is usable straight away
document.getElementById("view").innerHTML='<div class="wrap"><p style="color:var(--muted);padding:48px 0;font-size:15px">Loading data…</p></div>';
fetch("data/universe.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{ window.__DATA=d; paintPool(); paintRefresh();
  // the countdown must not go stale in a tab left open all day
  setInterval(paintRefresh, 30000);
  const h=(location.hash||"").replace("#",""), start=ALIAS[h]||h; show(VIEWS[start]||ALIAS[h]?h:"home"); }).catch(e=>{ document.getElementById("view").innerHTML='<div class="wrap"><p style="color:var(--crit);padding:48px 0">Could not load data. Try refreshing.</p></div>'; });
</script>
