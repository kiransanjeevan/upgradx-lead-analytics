name: Daily LSQ refresh

# Runs early every morning IST and commits the fresh data file.
# Vercel is git-connected, so the commit triggers a redeploy automatically.
on:
  schedule:
    # 01:37 UTC = 07:07 IST — after the ~6 PM IST Internshala batch + overnight
    # automations settle. The odd minute is deliberate: GitHub queues scheduled jobs
    # from a shared pool and :00/:30 are the most contended slots, so runs there are
    # the most likely to be delayed or dropped (see TROUBLESHOOTING in README.md).
    - cron: "37 1 * * *"
    # Backup, 04:43 UTC = 10:13 IST. GitHub does not guarantee scheduled runs and has
    # already skipped one here entirely. This second attempt no-ops when the morning
    # run already landed, so it costs nothing on a normal day and rescues a dropped one.
    - cron: "43 4 * * *"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

# The dashboard reads this to show "next refresh in ..." and to flag a missed run.
# It is NOT what schedules the job — keep it equal to the cron above.
env:
  LSQ_REFRESH_IST: "07:07"   # = the primary cron, 37 1 * * * UTC

permissions:
  contents: write

concurrency:
  group: lsq-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The backup run must not duplicate the morning one. A manual dispatch always
      # proceeds; a scheduled run stops here if today's IST data is already committed.
      - name: Skip if today's data already landed
        id: freshness
        run: |
          gen=$(python3 -c "import json;print(json.load(open('data/universe.json'))['generated_at'][:10])")
          today=$(TZ=Asia/Kolkata date +%F)
          echo "committed data is from $gen; today in IST is $today"
          if [ "$gen" = "$today" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's refresh already landed — skipping the backup run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull LeadSquared data
        if: steps.freshness.outputs.skip != 'true'
        env:
          LSQ_HOST: ${{ secrets.LSQ_HOST }}
          LSQ_ACCESS: ${{ secrets.LSQ_ACCESS }}
          LSQ_SECRET: ${{ secrets.LSQ_SECRET }}
          LSQ_START: ${{ vars.LSQ_START }}   # optional; defaults to 2026-09-01 in the script
        run: python scripts/pull.py

      - name: Commit refreshed data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name  "lsq-refresh-bot"
          git config user.email "actions@github.com"
          git add data/universe.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore: daily LSQ data refresh"
            git push
          fi
