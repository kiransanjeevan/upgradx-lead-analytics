<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Internshala</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* The dashboard's own tokens and components, so the page reads as one more report. Embedded,
     the dashboard injects its live token values (and theme) over these defaults. */
  :root{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef1f5;--ink:#1a2230;--ink-2:#3c4859;--muted:#586472;--line:#e3e7ec;--line-2:#ccd3dc;
    --accent:#2560ad;--accent-2:#1c4a88;--accent-soft:#e9f0fa;--good:#15683e;--good-soft:#eaf4ee;--warn:#875008;--warn-soft:#fbf0da;--warn-line:#e4bd80;
    --crit:#9c302b;--crit-soft:#f9ebe9;--crit-line:#e3aca7;--shadow:0 1px 2px rgb(20 30 45/.05),0 2px 8px rgb(20 30 45/.05);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;
    --accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}}
  :root[data-theme="dark"]{--bg:#0f141b;--surface:#171f29;--surface-2:#1d2732;--ink:#e9edf2;--ink-2:#b0bbc8;--muted:#8794a3;--line:#28323f;--line-2:#3a4653;
    --accent:#79a4e6;--accent-2:#9abbf0;--accent-soft:#17273e;--good:#5cc089;--good-soft:#12241c;--warn:#e3a852;--warn-soft:#2a2012;--warn-line:#5f4a22;--crit:#e0746d;--crit-soft:#2a1615;--crit-line:#5a2c29;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
  .wrap{max-width:1040px;margin:0 auto;padding:30px 20px 64px}
  .eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(22px,3.2vw,28px);margin:8px 0 0;letter-spacing:-.02em;font-weight:700}
  .lede{color:var(--ink-2);font-size:14.5px;max-width:82ch;margin:9px 0 0}
  /* filter toolbar */
  .fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:20px 0 4px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .fsel{position:relative;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 32px 0 11px;cursor:pointer}
  .fsel:hover{border-color:var(--muted)}
  .fsel:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fsel .k{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .fsel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:8px 0;cursor:pointer;outline:none}
  .fsel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);pointer-events:none}
  .xctx{margin:10px 2px 0;font-size:13px;color:var(--ink-2)}
  .xctx summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .xctx summary::-webkit-details-marker{display:none}
  .xctx .q{color:var(--accent-2);font-style:italic}
  .xctx .more{font-size:12px;font-weight:600;color:var(--accent)}
  .xctx .more::after{content:" ▾"}
  .xctx[open] .more::after{content:" ▴"}
  .xctx .body{margin-top:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--ink-2)}
  .xctx .body p{margin:0 0 6px}
  .xctx .body p:last-child{margin:0}
  /* tiles */
  .tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(136px,1fr);gap:12px;margin:14px -4px 2px;padding:2px 4px 10px;overflow-x:auto;scrollbar-width:thin}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
  .tile .n{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .tile .l{font-size:12px;color:var(--muted);margin-top:6px}
  .tile .l span{opacity:.8}
  .tile.hi .n{color:var(--accent-2)} .tile.good .n{color:var(--good)} .tile.warn .n{color:var(--warn)} .tile.warn{border-color:var(--warn-line)}
  .tile.unc .n{color:var(--crit)} .tile.unc{border-color:var(--crit-line)}
  /* sections */
  .shrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:26px 2px 10px}
  .sh{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .trunc{font-size:12px;color:var(--muted);margin:8px 2px 0}
  /* tables, as on the dashboard */
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;background:var(--surface)}
  th{text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td.dim{color:var(--ink);font-weight:600}
  tr.band th{text-align:center;color:var(--ink-2);font-weight:700;letter-spacing:.1em;border-bottom:0;padding-bottom:4px}
  tr.band th.g{box-shadow:inset 0 -2px 0 var(--line-2)}
  th.s,td.s{border-left:1px solid var(--line)}
  tr.tot td{background:var(--surface-2);font-weight:700;color:var(--ink);border-bottom:2px solid var(--line-2)}
  tbody tr:last-child td{border-bottom:0}
  .fpct{color:var(--muted);font-size:11.5px;margin-left:5px;font-weight:400}
  .cov{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px}
  .cov.g{background:var(--good-soft);color:var(--good)} .cov.a{background:var(--warn-soft);color:var(--warn)} .cov.r{background:var(--crit-soft);color:var(--crit)}
  .part{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px;font-weight:400}
  tr.grp{cursor:pointer} tr.grp:hover td{background:var(--surface-2)}
  tr.grp td.dim::before{content:"";display:inline-block;width:6px;height:6px;margin:0 10px 2px 2px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  tr.grp.open td.dim::before{transform:rotate(45deg)}
  tr.kid td{font-size:12.5px} tr.kid td.dim{padding-left:30px;font-weight:400;color:var(--ink-2)}
  /* funnel bars, as on the Funnel report */
  .funnel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px 16px}
  .fstep{display:grid;grid-template-columns:170px 1fr 230px;gap:14px;align-items:center;padding:8px 0}
  .fstep+.fstep{border-top:1px dashed var(--line)}
  .flabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);line-height:1.3}
  .ftrack{background:var(--surface-2);border-radius:5px;overflow:hidden;height:22px}
  .ftrack span{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
  .fval{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .fval b{color:var(--ink);font-size:16px;margin-right:6px}
  @media(max-width:640px){.fstep{grid-template-columns:1fr}.fval{text-align:left}}
  /* one fold-out for every definition, as on the other reports */
  .xfold{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.6;border-left:3px solid var(--line-2);padding-left:12px}
  .xfold b{color:var(--ink-2)}
  .xfold summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;list-style:none;cursor:pointer;font-weight:700;color:var(--ink-2)}
  .xfold summary::-webkit-details-marker{display:none}
  .xfold summary::before{content:"";align-self:center;width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  .xfold[open] summary::before{transform:rotate(45deg)}
  .xfold summary span{font-weight:400;font-size:12.5px;color:var(--muted)}
  .xfold[open] summary{margin-bottom:8px}
  .xfold h4{margin:12px 0 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  .xfold code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  if(hide){ $('#spt').innerHTML = D.speedNote; return; }
  const wk = $('#wkSel').value, rows = scoped().filter(r => wk==='all' || r[WKk()] === +wk), s = sel(rows);
  $('#sph').innerHTML = `<tr><th>Time to first call</th><th>Leads</th><th>% of leads</th><th class="s">Connected</th><th>Counselled</th><th>Paid</th></tr>`;
  const B = D.speedLabels.map((lab,i) => ({lab, s: sel(rows.filter(r => r[SPk()] === i))})), nv = sel(rows.filter(r => r[SPk()] === -1));
  $('#spb').innerHTML = `<tr class="tot"><td>Total</td><td>${nf(s.n)}</td><td>100%</td><td class="s">${pctCell(s.conn,s.n)}</td><td>${nf(s.couns)}</td><td>${nf(s.paid)}</td></tr>`
    + B.map(b => `<tr><td class="dim">${b.lab}</td><td>${nf(b.s.n)}</td><td>${p1(b.s.n,s.n)}</td><td class="s">${b.s.n?`${nf(b.s.conn)} <span class="cov ${cc(pf(b.s.conn,b.s.n))}">${p1(b.s.conn,b.s.n)}</span>`:'—'}</td><td>${nf(b.s.couns)}</td><td>${nf(b.s.paid)}</td></tr>`).join('')
    + `<tr><td class="dim">Never called, or called before the ${BASIS==='C'?'creation':'interested-in'} date</td><td>${nf(nv.n)}</td><td><span class="cov r">${p1(nv.n,s.n)}</span></td><td class="s">—</td><td>—</td><td>${nf(nv.paid)}</td></tr>`;
  $('#spt').textContent = `Hours from the ${BASIS==='C'?'creation':'interested-in'} date to the first logged counsellor call; connect rate is within each bucket.`;
}
function drawAttempts(){
  const rows = scoped(), s = sel(rows);
  $('#ath').innerHTML = `<tr><th>Logged attempts (human)</th><th>Leads</th><th>% of leads</th><th class="s">Connected</th><th>Counselled</th><th class="s">Human calls</th><th>Bot calls</th></tr>`;
  $('#atb').innerHTML = `<tr class="tot"><td>Total</td><td>${nf(s.n)}</td><td>100%</td><td class="s">${pctCell(s.conn,s.n)}</td><td>${nf(s.couns)}</td><td class="s">${nf(s.hum)}</td><td>${nf(s.bot)}</td></tr>`
    + D.attLabels.map((lab,i) => { const b = sel(rows.filter(r => r[X.att] === i));
      return `<tr><td class="dim">${lab}</td><td>${nf(b.n)}</td><td>${p1(b.n,s.n)}</td><td class="s">${b.n?`${nf(b.conn)} <span class="cov ${cc(pf(b.conn,b.n))}">${p1(b.conn,b.n)}</span>`:'—'}</td><td>${nf(b.couns)}</td><td class="s">${nf(b.hum)}</td><td>${nf(b.bot)}</td></tr>`; }).join('');
}
function drawBy(key, labels, head, bodyId, headId, cap){
  const rows = scoped(), m = new Map();
  rows.forEach(r => { if(!m.has(r[key])) m.set(r[key],[]); m.get(r[key]).push(r); });
  const list = [...m.entries()].map(([k,rs]) => ({name:labels[k], s:sel(rs)})).sort((a,b) => b.s.n-a.s.n);
  const T = sel(rows), shown = list.slice(0,cap);
  $(headId).innerHTML = `<tr><th>${head}</th><th>Leads</th><th class="s">Pooled</th><th class="s">Called</th><th>Connected</th><th class="s">Human calls</th><th>Bot calls</th><th class="s">Paid</th></tr>`;
  const line = (n,s,cls) => `<tr class="${cls||''}"><td class="dim">${n}</td><td>${nf(s.n)}</td><td class="s">${s.n?`${nf(s.pool)} <span class="cov ${s.pool/s.n>.5?'r':s.pool/s.n>.2?'a':'g'}">${p1(s.pool,s.n)}</span>`:'—'}</td>`
    + `<td class="s">${pctCell(s.called,s.n)}</td><td>${nf(s.conn)}</td><td class="s">${nf(s.hum)}</td><td>${nf(s.bot)}</td><td class="s">${nf(s.paid)}</td></tr>`;
  $(bodyId).innerHTML = line(list.length>cap?`Total (all ${list.length})`:'Total', T, 'tot') + shown.map(x => line(x.name, x.s)).join('');
}
function drawFoot(){
  const sec = (h, items) => `<h4>${h}</h4>` + items.map(d => `<div><b>${d[0]}</b> = ${d[1]}</div>`).join('');
  $('#foot').innerHTML = `<summary>How this is measured<span>Definitions, caveats and data sources · ${D.asOfLbl}</span></summary>`
    + sec('Definitions', D.defs) + sec('Caveats', D.caveats) + sec('Data', D.provenance);
}
function renderAll(){
  BASIS = $('#basis').value;
  const keep = $('#wkSel').value;
  $('#wkSel').innerHTML = `<option value="all">All weeks</option>` + weeks().map((w,i) => `<option value="${i}">Week of ${w.label}${w.partial?' (part)':''}</option>`).join('');
  if([...$('#wkSel').options].some(o => o.value === keep)) $('#wkSel').value = keep;
  drawContext(); drawTiles(); drawSegments(); drawFunnel(); drawWeeks(); drawSpeed(); drawAttempts();
  drawBy(X.cen, D.cenLabels, 'Centre (lead field)', '#ceb', '#ceh', 12); drawBy(X.prog, D.progLabels, 'Programme', '#prb', '#prh', 8);
}
$('#basis').onchange = () => { OPEN.clear(); renderAll(); };
$('#pop').onchange = renderAll;
$('#wkSel').onchange = drawSpeed;
drawFoot(); renderAll();
</script>
