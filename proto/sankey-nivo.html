<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing Sankey · nivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sankey.css">
<!-- no build step: esm.sh modules, pinned. ?external keeps one React for nivo and its deps -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "@nivo/sankey": "https://esm.sh/@nivo/sankey@0.99.0?external=react,react-dom"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <h1>Routing Sankey · @nivo/sankey</h1>
  <p class="lede">Leads created in the range: source group → where they were routed (owner's centre) → furthest funnel step. Prototype B of 2.</p>
  <div class="fbar" id="fbar"></div>
  <p class="summary" id="summary"></p>
  <div class="chart" id="chart"></div>
</div>
<script type="module">
import { createElement as h } from "react";
import { createRoot } from "react-dom/client";
import { ResponsiveSankey } from "@nivo/sankey";
import { loadUniverse, buildSankey, mountFilters, palette, LAYOUT, labelOf, nodeTip, linkTip, fmt } from "./sankey-data.js";

const el = document.getElementById("chart"), root = createRoot(el);
const tipBox = text => h("div", { className: "tip", style: { position: "static" } }, text);
let D, state;

function render() {
  const { nodes, links, total } = buildSankey(D, state), pal = palette();
  document.getElementById("summary").textContent = `${fmt(total)} leads · ${state.from} → ${state.to}`;
  const byId = new Map(nodes.map(n => [n.id, n]));
  root.render(h(ResponsiveSankey, {
    data: { nodes, links },
    margin: LAYOUT.margin,
    align: "justify", sort: "input",                        // same as d3: sankeyJustify, nodeSort(null)
    colors: n => pal.node(n),
    nodeThickness: LAYOUT.nodeWidth, nodeSpacing: LAYOUT.nodePadding, nodeInnerPadding: 0,
    nodeBorderWidth: 0, nodeBorderRadius: LAYOUT.nodeRadius, nodeOpacity: 1, nodeHoverOthersOpacity: 0.35,
    linkOpacity: LAYOUT.linkOpacity, linkHoverOpacity: 0.7, linkHoverOthersOpacity: 0.1, linkContract: 0,
    enableLinkGradient: true, linkBlendMode: "normal",       // nivo defaults to multiply, which goes dark on the dark surface
    label: n => labelOf(byId.get(n.id)),
    labelPosition: "outside", labelOrientation: "horizontal", labelPadding: LAYOUT.labelPadding,
    labelTextColor: pal.text,
    nodeTooltip: ({ node }) => tipBox(nodeTip(byId.get(node.id), total)),
    linkTooltip: ({ link }) => tipBox(linkTip(link, byId)),
    theme: { background: pal.surface, text: { fill: pal.text, fontSize: 12, fontFamily: "Inter, system-ui, sans-serif" } },
    animate: true, motionConfig: { duration: LAYOUT.duration },
  }));
}

try {
  D = await loadUniverse();
  state = mountFilters(document.getElementById("fbar"), D, s => { state = s; render(); });
  render();
} catch (e) {
  const p = document.createElement("p"); p.className = "err"; p.style.padding = "16px"; p.textContent = e.message; el.replaceChildren(p);
}
</script>
</body>
</html>
