<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing Sankey · d3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sankey.css">
<!-- vendored, pinned: d3 7.9.0 + d3-sankey 0.12.3 (attaches to the d3 global) -->
<script src="vendor/d3-7.9.0.min.js"></script>
<script src="vendor/d3-sankey-0.12.3.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Routing Sankey · d3 + d3-sankey</h1>
  <p class="lede">Leads created in the range: source group → where they were routed (owner's centre) → furthest funnel step. Prototype A of 2.</p>
  <div class="fbar" id="fbar"></div>
  <p class="summary" id="summary"></p>
  <div class="chart" id="chart"></div>
</div>
<div class="tip" id="tip" hidden></div>
<script type="module">
import { loadUniverse, buildSankey, mountFilters, palette, LAYOUT, labelOf, nodeTip, linkTip, fmt } from "./sankey-data.js";

const el = document.getElementById("chart"), tip = document.getElementById("tip");
const svg = d3.select(el).append("svg").attr("width", "100%").attr("height", "100%");
const defs = svg.append("defs"), gLinks = svg.append("g").attr("fill", "none"), gNodes = svg.append("g"), gLabels = svg.append("g");
const keyOf = l => l.source.id + ">" + l.target.id;
const gradId = l => "g-" + keyOf(l).replace(/[^a-z0-9]/gi, "_");
let D, state, first = true;

function showTip(e, text) { tip.textContent = text; tip.hidden = false; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; }
const hideTip = () => { tip.hidden = true; };

function render() {
  const { nodes, links, total } = buildSankey(D, state), pal = palette(), m = LAYOUT.margin;
  document.getElementById("summary").textContent = `${fmt(total)} leads · ${state.from} → ${state.to}`;
  const W = el.clientWidth, H = el.clientHeight, innerW = W - m.left - m.right;
  const graph = d3.sankey().nodeId(d => d.id).nodeAlign(d3.sankeyJustify).nodeSort(null).linkSort(null)   // input order on both, as nivo draws it
    .nodeWidth(LAYOUT.nodeWidth).nodePadding(LAYOUT.nodePadding)
    .extent([[m.left, m.top], [W - m.right, H - m.bottom]])({ nodes: nodes.map(n => ({ ...n })), links: links.map(l => ({ ...l })) });
  const byId = new Map(graph.nodes.map(n => [n.id, n]));
  const t = svg.transition().duration(first ? 0 : LAYOUT.duration).ease(d3.easeCubicInOut);
  first = false;

  // gradients: source colour → target colour along each link, positioned in user space
  defs.selectAll("linearGradient").data(graph.links, keyOf).join(
    enter => { const g = enter.append("linearGradient").attr("id", gradId).attr("gradientUnits", "userSpaceOnUse")
                 .attr("x1", d => d.source.x1).attr("x2", d => d.target.x0);
               g.append("stop").attr("offset", "0%"); g.append("stop").attr("offset", "100%"); return g; },
    update => update, exit => exit.remove())
    .call(g => g.transition(t).attr("x1", d => d.source.x1).attr("x2", d => d.target.x0))
    .each(function (d) { const s = d3.select(this).selectAll("stop");
      s.filter((_, i) => i === 0).attr("stop-color", pal.node(d.source)); s.filter((_, i) => i === 1).attr("stop-color", pal.node(d.target)); });

  const path = d3.sankeyLinkHorizontal();
  gLinks.selectAll("path").data(graph.links, keyOf).join(
    enter => enter.append("path").attr("d", path).attr("stroke-opacity", 0).attr("stroke-width", d => Math.max(1, d.width)),
    update => update,
    exit => exit.transition(t).attr("stroke-opacity", 0).remove())
    .attr("stroke", d => `url(#${gradId(d)})`)
    .on("mousemove", (e, d) => { showTip(e, linkTip(d, byId)); d3.select(e.currentTarget).attr("stroke-opacity", 0.7); })
    .on("mouseleave", e => { hideTip(); d3.select(e.currentTarget).attr("stroke-opacity", LAYOUT.linkOpacity); })
    .transition(t).attr("d", path).attr("stroke-width", d => Math.max(1, d.width)).attr("stroke-opacity", LAYOUT.linkOpacity);

  gNodes.selectAll("rect").data(graph.nodes, d => d.id).join(
    enter => enter.append("rect").attr("x", d => d.x0).attr("y", d => d.y0).attr("width", d => d.x1 - d.x0)
               .attr("height", d => Math.max(1, d.y1 - d.y0)).attr("opacity", 0),
    update => update,
    exit => exit.transition(t).attr("opacity", 0).remove())
    .attr("rx", LAYOUT.nodeRadius).attr("fill", d => pal.node(d))
    .on("mousemove", (e, d) => showTip(e, nodeTip(d, total))).on("mouseleave", hideTip)
    .transition(t).attr("x", d => d.x0).attr("y", d => d.y0).attr("width", d => d.x1 - d.x0)
    .attr("height", d => Math.max(1, d.y1 - d.y0)).attr("opacity", 1);

  // labels outside the node: left of it in the left half, right of it otherwise (same rule as nivo)
  const left = d => d.x0 - m.left < innerW / 2;
  gLabels.selectAll("text").data(graph.nodes, d => d.id).join(
    enter => enter.append("text").attr("opacity", 0).attr("x", d => left(d) ? d.x0 - LAYOUT.labelPadding : d.x1 + LAYOUT.labelPadding)
               .attr("y", d => (d.y0 + d.y1) / 2),
    update => update,
    exit => exit.transition(t).attr("opacity", 0).remove())
    .attr("dy", "0.35em").attr("text-anchor", d => left(d) ? "end" : "start")
    .attr("fill", pal.text).style("font", LAYOUT.font).style("pointer-events", "none").text(labelOf)
    .transition(t).attr("x", d => left(d) ? d.x0 - LAYOUT.labelPadding : d.x1 + LAYOUT.labelPadding)
    .attr("y", d => (d.y0 + d.y1) / 2).attr("opacity", 1);
}

try {
  D = await loadUniverse();
  state = mountFilters(document.getElementById("fbar"), D, s => { state = s; render(); });
  render();
  new ResizeObserver(() => { first = true; render(); }).observe(el);
} catch (e) { const p = document.createElement("p"); p.className = "err"; p.style.padding = "16px"; p.textContent = e.message; el.replaceChildren(p); }
</script>
</body>
</html>
